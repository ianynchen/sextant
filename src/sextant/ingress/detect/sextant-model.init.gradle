// Sextant's own read-only probe (2M design §1). A plain Groovy init script —
// init scripts are always Groovy regardless of the target build's own DSL,
// which is exactly why one script here reads both Groovy- and Kotlin-DSL
// Gradle builds. It registers `sextantModel` on EVERY project and
// `sextantBuild` on the root project only (Android design M4). Each
// project's own `sextantModel` resolves only that project's own
// configurations and writes that project's records; with
// `org.gradle.parallel=true`, Gradle refuses a task that resolves the
// configuration of a different project ("without an exclusive lock"), so one
// root task cannot walk them all. `sextantBuild` reads only project
// properties (path, group, name, version, folder) of every project and never
// a configuration. The reads happen inside each task's own execution
// (`doLast`), never at configuration time, because `compileClasspath`
// cannot be resolved until the task graph is running. All files go into the
// folder named by `-Psextant.outDir` — never stdout, which Gradle itself,
// the target build's own scripts, and JVM warnings all pollute:
// `build.json` from `sextantBuild`, and `projects/<path>.json` from each
// `sextantModel`, where `<path>` is the project path with every `_` made
// `__` first and then every `:` made `_` (the root project is `_`), so two
// project paths never give the same file name. A `sextantModel` or `sextantBuild` name
// collision with the target build surfaces as Gradle's own configuration
// error (a duplicate task registration) and needs no handling here — it
// reaches GradleDetector as an ordinary build-configuration-failure refusal.
//
// Honesty (2M design §1a): running this script executes the target
// repository's own build — its plugins, its `buildSrc`, whatever a
// `doLast`/`afterEvaluate` block on ANY applied plugin chooses to do. Sextant
// adds no sandbox around that, the same trust already extended when the
// fixture suite compiles Maven fixtures with `mvn`. Gradle also writes
// `.gradle/` state into the repository it runs against and may start a
// daemon; neither is filesystem-read-only behaviour, and GradleDetector's
// own docstring says so in those words. Nor is this a narrow, cheap probe
// (2M Task 3 fix round 1, I4): each Java-plugin project's `sextantModel`
// depends on that project's own `classes` task (below), so running it
// compiles the ENTIRE target build in one invocation — every project,
// including ones the CLI will go on to skip-list. With `--continue`, a
// project whose compile fails writes no file, and GradleDetector skips it
// with Gradle's own reason; the other projects are read (Android design M5).
import groovy.json.JsonOutput
import org.gradle.api.Action
import org.gradle.api.DefaultTask
import org.gradle.api.attributes.Attribute
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.file.Directory
import org.gradle.api.file.RegularFile
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.InputFiles

// The task that receives the compiled classes of one Android build (Android design 2e.5).
// AGP fills the two lists through `ScopedArtifacts.toGet`, and that also makes this task
// depend on the tasks that compile the classes. `jars` are the class jars AGP lists for the
// project (`R.jar`); `dirs` are the class directories, which are the only ones Sextant reads.
abstract class SextantAndroidClasses extends DefaultTask {
    @InputFiles
    abstract ListProperty<RegularFile> getJars()

    @InputFiles
    abstract ListProperty<Directory> getDirs()
}

// One project record, built from what the caller read off the project's own
// plugin (Android design M4). Every branch — `java` and Kotlin Multiplatform —
// calls this closure, and only this closure, with the same input map:
//   sourceSets             language name -> the source directories that
//                          language's source-directory set registered
//   resourceDirs           the resource directories
//   classesDirs            the compiled-classes directories
//   classpathConfiguration the configuration to resolve as the compile
//                          classpath, or null
//   declaredRelease        the Java release the build declares, or null
//   target, platform       the version's name and Gradle's label for it, for a
//                          part built in more than one version; null for a
//                          `java` project
//   classpathArtifactType  the artifact type to ask the configuration for, or
//                          null for the configuration's own artifacts
// A project with no compiling plugin passes an empty map and gets a record
// with empty lists.
def sextantRecord = { p, Map inputs ->
    def sourceRoots = []
    def sourceLanguages = new TreeMap()
    def resourceRoots = []
    def classesDirs = []
    def classpath = []
    def languageDirs = inputs.sourceSets ?: [:]
    def resourceDirs = inputs.resourceDirs ?: []
    def buildDirPath = p.layout.buildDirectory.get().asFile.absolutePath
    // Every language directory a JVM-language plugin (Java,
    // Kotlin, Groovy, ...) registered on the source set — the union of
    // the language sets the caller found is the plugin-agnostic way to read
    // that — MINUS the resource dirs (reported separately)
    // and anything under the build directory (annotation
    // processors register their generated-sources dir here
    // too, and a generated dir is not a source root any more
    // than Maven's `target/generated-sources` is).
    sourceRoots = languageDirs.values().flatten()
        .findAll { !resourceDirs.contains(it) && !it.absolutePath.startsWith(buildDirPath) }
        .collect { it.absolutePath }
        .unique()
        .sort()
    // Which plugin's source-directory set registered each source directory
    // (OI-273 round 2). EVERY directory, generated ones under the build
    // directory included (fix round 2, review N1): they are not source roots,
    // but a module whose only code is generated (OpenAPI, jOOQ, protobuf) is
    // written in the language of the set that compiles them.
    languageDirs.each { language, dirs ->
        dirs.each { dir ->
            def key = dir.absolutePath
            sourceLanguages[key] = ((sourceLanguages[key] ?: []) + language).unique().sort()
        }
    }
    resourceRoots = resourceDirs.collect { it.absolutePath }.sort()
    classesDirs = (inputs.classesDirs ?: []).collect { it.absolutePath }.sort()
    def compileClasspath = inputs.classpathConfiguration
    if (compileClasspath != null) {
        def artifacts = compileClasspath.incoming.artifacts
        if (inputs.classpathArtifactType != null) {
            artifacts = compileClasspath.incoming.artifactView { view ->
                view.attributes { it.attribute(Attribute.of("artifactType", String), inputs.classpathArtifactType) }
            }.artifacts
        }
        artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            def entry = [path: artifact.file.absolutePath]
            // Gradle reports a coordinate only where it HAS one
            // (2M design §1): a `ModuleComponentIdentifier` is
            // an external Maven-style dependency. A
            // `ProjectComponentIdentifier` (2M Task 3 fix round
            // 1, I3) is an INTER-PROJECT dependency
            // (`project(":other")`) — internal wiring Gradle
            // resolved just fine, marked `internal` rather than
            // given a group/name/version this identifier does
            // not carry, so GradleDetector can tell it apart
            // from a genuinely unresolved one. Anything else (a
            // flat file() dependency) carries neither and
            // stays path-only.
            if (id instanceof ModuleComponentIdentifier) {
                entry.group = id.group
                entry.name = id.module
                entry.version = id.version
            } else if (id instanceof ProjectComponentIdentifier) {
                entry.internal = true
                // W55: the project PATH (`:pricing-lib`), which is
                // the only identity this component id carries — it
                // has no group/name/version of its own. Recorded so
                // the detector can join it to that project's own
                // entry in `projects[]`, which DOES carry a group
                // and a name, and form the coordinate from those.
                //
                // For a grouped project the path only joins, and the
                // coordinate is its group and name. A project with NO
                // group has no coordinate (Gradle will not publish it),
                // so the detector names it by the root project's name
                // plus this path (OI-273) — the build's own
                // declarations, the same on every machine.
                entry.projectPath = id.projectPath
                // Which version of that project Gradle picked (Android design
                // M1): the label Gradle put on the artifact, read by the
                // attribute's NAME because its type is a Kotlin enum this
                // script cannot name. Null where the project carries no label.
                def attributes = artifact.variant.attributes
                def platformKey = attributes.keySet().find { it.name == "org.jetbrains.kotlin.platform.type" }
                def platform = platformKey == null ? null : attributes.getAttribute(platformKey)
                entry.platform = platform == null ? null : platform.toString()
            }
            classpath << entry
        }
        classpath = classpath.sort { it.path }
    }
    [
        path: p.path,
        group: p.group.toString(),
        name: p.name,
        version: p.version.toString(),
        dir: p.projectDir.absolutePath,
        sourceRoots: sourceRoots,
        sourceLanguages: sourceLanguages,
        resourceRoots: resourceRoots,
        classesDirs: classesDirs,
        declaredRelease: inputs.declaredRelease,
        publishing: p.plugins.hasPlugin("maven-publish"),
        classpath: classpath,
        target: inputs.target,
        platform: inputs.platform,
    ]
}

// The versions of a Kotlin Multiplatform part that compile to JVM bytecode, in
// name order: Kotlin's own platform type `jvm`. The Android version
// (`androidJvm`) is not one of them.
def jvmTargets = { p ->
    p.kotlin.targets.findAll { it.platformType.name() == "jvm" }.sort { it.name }
}

// The name of the Android version of a Kotlin Multiplatform part: the Kotlin target whose
// platform type is `androidJvm`. Null for a part that is not Kotlin Multiplatform, or that
// has no Android version.
def androidTargetName = { p ->
    if (!p.plugins.hasPlugin("org.jetbrains.kotlin.multiplatform")) return null
    p.kotlin.targets.find { it.platformType.name() == "androidJvm" }?.name
}

// The Android plugins whose builds Sextant reads (Android design 2a).
def androidPluginIds = [
    "com.android.application",
    "com.android.library",
    "com.android.kotlin.multiplatform.library",
]

gradle.rootProject { rp ->
    rp.tasks.register("sextantBuild") {
        // No declared inputs/outputs: this task's whole job is a one-shot
        // read of the evaluated model, and Gradle's own up-to-date checking
        // has nothing to gain from a task that is never meant to be skipped.
        doLast {
            def outDir = new File(rp.property("sextant.outDir").toString())
            def projects = rp.allprojects.sort { it.path }.collect { p ->
                [
                    path: p.path,
                    group: p.group.toString(),
                    name: p.name,
                    version: p.version.toString(),
                    dir: p.projectDir.absolutePath,
                ]
            }
            // Composite builds (2M design §1c / Task 3 fix round 1, I1):
            // `includeBuild`d projects are invisible to `allprojects` above —
            // named here instead, so GradleDetector can state the boundary
            // as a note rather than dropping it silently.
            def includedBuilds = gradle.includedBuilds.collect { it.name }.sort()
            outDir.mkdirs()
            new File(outDir, "build.json").text = JsonOutput.toJson(
                [projects: projects, includedBuilds: includedBuilds]
            )
        }
    }
    rp.allprojects.each { p ->
        // What the Android branch below found for this project: whether an Android plugin
        // is applied, why its builds cannot be read (null when they can), and one record
        // per Android build that was read. The per-build tasks add the records.
        def android = [applied: false, failure: null, records: Collections.synchronizedList([])]
        def sextantModel = p.tasks.register("sextantModel") {
            // No declared inputs/outputs, for the same reason as `sextantBuild`.
            doLast {
                def outDir = new File(p.property("sextant.outDir").toString())
                def inputs = [:]
                def records = []
                if (p.plugins.hasPlugin("org.jetbrains.kotlin.multiplatform")) {
                    // A Kotlin Multiplatform part (Android design M1): one record per
                    // version that compiles to JVM bytecode, each with its own name
                    // and label. A part that also applies `java` (`withJava()`) is
                    // read here only: its `java` main IS the JVM version, and its
                    // classes must not be written twice. A part with no JVM version
                    // gets the empty record below.
                    records = jvmTargets(p).collect { target ->
                        def main = target.compilations.getByName("main")
                        sextantRecord(p, [
                            sourceSets: [kotlin: main.allKotlinSourceSets.collectMany { it.kotlin.srcDirs as List }],
                            resourceDirs: main.allKotlinSourceSets.collectMany { it.resources.srcDirs as List },
                            classesDirs: main.output.classesDirs.files,
                            classpathConfiguration: p.configurations.findByName(main.compileDependencyConfigurationName),
                            declaredRelease: null,
                            target: target.name,
                            platform: "jvm",
                        ])
                    }
                } else if (p.plugins.hasPlugin("java")) {
                    def main = p.sourceSets.main
                    // The Java release this project's BUILD declares (W3b). Asked of
                    // GRADLE rather than parsed out of a build script, because the
                    // value can come from a convention plugin, a toolchain, or a
                    // property, and only the evaluated model knows which won.
                    //
                    // `options.release` first — it is the modern and unambiguous
                    // one. `targetCompatibility` is the fallback and still what
                    // older builds set; it arrives as a JavaVersion-ish string, so
                    // `1.8` and `8` both have to reduce to 8. A project declaring
                    // neither reports null: an absence, never a default.
                    def declaredRelease = null
                    def compileJava = p.tasks.findByName("compileJava")
                    if (compileJava != null) {
                        declaredRelease = compileJava.options.release.getOrNull()
                        if (declaredRelease == null) {
                            def target = compileJava.targetCompatibility
                            if (target != null) {
                                def text = target.toString()
                                if (text.startsWith("1.")) text = text.substring(2)
                                if (text.isInteger()) declaredRelease = text.toInteger()
                            }
                        }
                    }
                    // The source-directory sets on the `main` source set (OI-273
                    // round 2): `java` for the Java plugin's own, and every
                    // SourceDirectorySet another plugin hung on the source set under the
                    // name it chose (`kotlin`, `groovy`, ...). A directory's NAME says
                    // nothing — `kotlin.srcDirs("src")` is ordinary — and one directory
                    // can be in two sets: the Kotlin plugin adds `src/main/java` to its own.
                    def languageSets = [java: main.java]
                    main.extensions.extensionsSchema.each { schema ->
                        def extension = main.extensions.findByName(schema.name)
                        if (extension instanceof org.gradle.api.file.SourceDirectorySet) {
                            languageSets[schema.name] = extension
                        }
                    }
                    // And the older form of the same registration (OI-273 fix round 1,
                    // review m1): a Kotlin plugin before the extension existed (1.6.21,
                    // measured on Gradle 8.14.1) hangs its `kotlin` set on the source set
                    // as a CONVENTION object, which Gradle 9 no longer has at all — hence
                    // the `hasProperty` guard. Named the way the plugin named it, as above.
                    if (main.hasProperty("convention")) {
                        main.convention.plugins.each { conventionName, conventionObject ->
                            if (!languageSets.containsKey(conventionName)
                                    && conventionObject.hasProperty(conventionName)) {
                                def set = conventionObject."$conventionName"
                                if (set instanceof org.gradle.api.file.SourceDirectorySet) {
                                    languageSets[conventionName] = set
                                }
                            }
                        }
                    }
                    inputs = [
                        sourceSets: languageSets.collectEntries { language, set -> [language, set.srcDirs] },
                        resourceDirs: main.resources.srcDirs,
                        classesDirs: main.output.classesDirs.files,
                        classpathConfiguration: p.configurations.findByName("compileClasspath"),
                        declaredRelease: declaredRelease,
                        target: null,
                        platform: null,
                    ]
                }
                // An Android part (Android design 2a, 2b): one record per Android build that
                // was read. A part that cannot be read, or that has no release build, gets one
                // record that says why, and the detector skips it with that reason.
                if (android.applied) {
                    def reason = android.failure
                    if (reason == null && android.records.isEmpty()) {
                        reason = "no release build: nothing that ships to read"
                    }
                    if (reason == null) {
                        records += android.records
                    } else {
                        records << (sextantRecord(p, [target: androidTargetName(p), platform: "androidJvm"])
                            + [buildFailure: reason])
                    }
                }
                def projectsDir = new File(outDir, "projects")
                projectsDir.mkdirs()
                new File(projectsDir, p.path.replace("_", "__").replace(":", "_") + ".json").text = JsonOutput.toJson(
                    records ?: [sextantRecord(p, inputs)]
                )
            }
        }
        // "The compiled-classes output directories" (2M design §1) means what it
        // says: the prerequisite is a SUCCESSFUL BUILD, the same precondition
        // `MavenDetector`'s own docstring states for `mvn`, except Gradle's own
        // task graph can state it directly rather than asking the caller for a
        // separate compile step first. `plugins.withId` reacts whether the Java
        // plugin is already applied or applied later, so this reaches every
        // Java-plugin project regardless of configuration order.
        p.plugins.withId("java") {
            sextantModel.configure { dependsOn p.tasks.named("classes") }
        }
        // A Kotlin Multiplatform part: each JVM version's compiled classes, so the
        // build compiles what the task reads. `all` reacts to a version the build
        // adds after this line runs.
        p.plugins.withId("org.jetbrains.kotlin.multiplatform") {
            p.kotlin.targets.all { target ->
                if (target.platformType.name() == "jvm") {
                    sextantModel.configure { dependsOn target.compilations.getByName("main").output.classesDirs }
                }
            }
        }
        // An Android part (Android design 2a, 2b, 2e). AGP is asked for each build it
        // makes, and the release build is kept: the build type `release`, or the only build
        // where the part has no build types (a Kotlin Multiplatform Android library has one
        // build, `androidMain`, with no build type). Each kept build gets its own task, which
        // AGP gives the build's compiled classes, and `sextantModel` depends on it.
        //
        // AGP's classes are not on this script's class path, so they are loaded through the
        // plugin's own class loader. `ScopedArtifacts` came with AGP 7.4; an older AGP does
        // not have it, and the part gets a record that says so.
        androidPluginIds.each { pluginId ->
            p.plugins.withId(pluginId) { plugin ->
                android.applied = true
                def loader = plugin.getClass().classLoader
                def scopeClass
                try {
                    scopeClass = loader.loadClass('com.android.build.api.variant.ScopedArtifacts$Scope')
                } catch (ClassNotFoundException ignored) {
                    def version = loader.loadClass("com.android.builder.model.Version")
                        .getField("ANDROID_GRADLE_PLUGIN_VERSION").get(null)
                    android.failure =
                        "Android Gradle Plugin ${version} is older than 7.4, which Sextant needs to read Android parts"
                    return
                }
                def projectScope = Enum.valueOf(scopeClass, "PROJECT")
                def classes = loader.loadClass('com.android.build.api.artifact.ScopedArtifact$CLASSES')
                    .getField("INSTANCE").get(null)
                def function1 = loader.loadClass("kotlin.jvm.functions.Function1")
                def components = p.extensions.getByName("androidComponents")
                components.onVariants(components.selector().all(), { variant ->
                    if (variant.buildType != null && variant.buildType != "release") return
                    def read = p.tasks.register("sextantModel" + variant.name.capitalize(), SextantAndroidClasses) { task ->
                        task.doLast {
                            // The edition's name (`free`), or for the Android version of a
                            // Kotlin Multiplatform part, that version's name (`android`).
                            def target = variant.flavorName ?: androidTargetName(p)
                            // An older AGP may not have the `kotlin` set; a set it does
                            // not have is left out.
                            def languageDirs = [:]
                            ["java", "kotlin"].each { language ->
                                def set = variant.sources.hasProperty(language) ? variant.sources."$language" : null
                                if (set != null) {
                                    languageDirs[language] = set.all.get().collect { it.asFile }
                                }
                            }
                            android.records << (sextantRecord(p, [
                                sourceSets: languageDirs,
                                resourceDirs: [],
                                classesDirs: task.dirs.get().collect { it.asFile },
                                // AGP offers each library on the compile classpath in
                                // several forms, so one must be named (Android design 2e.7):
                                // without it, Gradle refuses the classpath as ambiguous.
                                classpathConfiguration: variant.compileConfiguration,
                                classpathArtifactType: "android-classes-jar",
                                declaredRelease: null,
                                target: target ?: null,
                                platform: "androidJvm",
                            ]) + [projectJars: task.jars.get().collect { it.asFile.absolutePath }.sort()])
                        }
                    }
                    variant.artifacts.forScope(projectScope).use(read).toGet(
                        classes,
                        { it.jars }.asType(function1),
                        { it.dirs }.asType(function1)
                    )
                    sextantModel.configure { dependsOn read }
                } as Action)
            }
        }
    }
}
