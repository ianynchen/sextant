id: micronaut-kafka
displayName: Micronaut Kafka (listener)
style: annotation_driven
protocol: kafka
direction: inbound
detect:
  coordinates:
    - "io.micronaut.kafka:micronaut-kafka"
measured:
  - { artifact: io.micronaut.kafka:micronaut-kafka, versions: ["5.6.0"],
      identity: reported, by: scripts/probes/w58_micronaut_quarkus_annotations.md }
  # A SECOND row rather than a widened first one: W58 measured what NAMES the
  # endpoint, CP-32 what `@KafkaListener` says ABOUT it — every element with its
  # own `AnnotationDefault`, the `value`/`groupId` alias, and what
  # `KafkaConsumerProcessor` does with the group. A reader chasing the
  # `metadata_from` entries above needs the probe that asked that question.
  - { artifact: io.micronaut.kafka:micronaut-kafka, versions: ["5.6.0"],
      identity: reported, by: scripts/probes/cp32_listener_attributes.md }
  # A THIRD row, and a DIFFERENT artifact rather than a widened second one: the
  # both-written boundary above rests on what resolves an `@AliasFor`, which is
  # `micronaut-core-processor`'s `AbstractAnnotationMetadataBuilder` and not
  # anything in `micronaut-kafka` at all (CP-32 Q13). 4.7.6 is the version
  # `fixtures/orders-micronaut`'s own POM resolves.
  - { artifact: io.micronaut:micronaut-core-processor, versions: ["4.7.6"],
      identity: reported, by: scripts/probes/cp32_listener_attributes.md }
requires: [annotation_args]
# One of a PAIR, split by direction on the type annotation exactly as `micronaut-http.yml`
# and `micronaut-http-client.yml` are, and for the same reason: Micronaut uses ONE method
# annotation for both sides and the class-level marker decides which. Two catalogs gating
# on different markers derive each destination once.
matches:
  # `@KafkaListener` marks the CLASS; `@Topic` on each method names what it consumes.
  type_annotation: io.micronaut.configuration.kafka.annotation.KafkaListener
  # MEASURED (`javap` on micronaut-kafka 5.6.0 `KafkaMessagingBodyBinder`): the body
  # binder keys on `@MessageBody`; an unannotated sole parameter is the message by default.
  request_body: { annotation: io.micronaut.messaging.annotation.MessageBody, fallback: sole_unannotated }
  # §2e's criterion applied to this framework: an attribute a PEER would care
  # about — whether and how a message reaches this handler.
  #
  # TWO ENTRIES FOR ONE ATTRIBUTE, AND THE PROBE IS WHY. MEASURED, CP-32 Q4a
  # (micronaut-kafka 5.6.0): `@KafkaListener` declares `value()` and `groupId()`
  # as `io.micronaut.context.annotation.AliasFor` ONE ANOTHER, both `String`,
  # both defaulting to `""`. `@KafkaListener("orders")` writes `value` into the
  # class file and `@KafkaListener(groupId = "orders")` writes `groupId`; javac
  # writes whichever the source wrote and merges nothing. CP-32 Q9 reads
  # `KafkaConsumerProcessor` calling `AnnotationValue.stringValue("groupId")` on
  # Micronaut's own MERGED metadata, where the alias has already been applied —
  # so `value` is as much the consumer group as `groupId` is, and an entry
  # naming only `groupId` would silently miss every declaration written the
  # short way.
  #
  # A DECLARATION CAN WRITE BOTH, AND THAT IS NOW MEASURED RATHER THAN ASSUMED
  # (fix round 1: this file said "a declaration writes at most one of the two"
  # and nothing had asked). CP-32 Q12 compiles
  # `@KafkaListener(value = "by-value", groupId = "by-group-id")` and reads the
  # class file back: javac accepts it and writes BOTH elements into
  # `RuntimeVisibleAnnotations`. CP-32 Q13 reads what Micronaut then does with
  # it — `AbstractAnnotationMetadataBuilder.processAnnotationAlias`, offsets
  # 164-195: a WITHIN-annotation `@AliasFor` (one naming `member` and no
  # `annotation`/`annotationName`, which is exactly this pair) is a `Map.put` of
  # the aliased name into the SAME members map, so it OVERWRITES rather than
  # refuses. Micronaut resolves such a declaration to ONE group, silently — and
  # this pass would write TWO `consumer_group` rows contradicting each other.
  #
  # STATED, NOT ENCODED, and the reason is where a fix would have to live:
  # `metadata_from` has no first-present-wins form — that is `path_from`'s alias
  # machinery, one key over — so encoding it is an engine change. The exposure
  # is bounded to a declaration that names two DIFFERENT consumer groups for one
  # listener, which is a module Micronaut itself silently collapses; a
  # declaration writing both with the same value yields one row through the
  # insert-if-absent guard. It is recorded here rather than left implied,
  # because a second row on a real endpoint is the false-positive class this key
  # is organised against, and saying so is what stops a reader taking the pair
  # below for a guarantee.
  #
  # BEHAVIOURAL, not routing (§1f): every consumer group on a topic receives
  # every message, so the group qualifies the endpoint and never enters its
  # address.
  #
  # THE GROUP SITS ON THE CLASS AND THE ROW'S HANDLER IS THE METHOD, which is
  # what makes the enclosing-type half of the nearest-wins read load-bearing
  # here: `@KafkaListener` is this catalog's `type_annotation`, and CP-32 Q4b
  # reads `@Topic` — the handler's own annotation — as declaring `value` and
  # `patterns` and nothing else. `@KafkaListener` is also `@Target`-ed at
  # METHOD, and where a method carries one its own value wins outright
  # (`endpoint_attributes._uses_by_annotation`).
  #
  # NO `absent_value`: CP-32 Q9 reads the absent case as
  # `orElseGet(() -> <the bean's class name>)`, a value that is not on the
  # declaration at all — so there is no measured default to state, and silence
  # is the honest answer (D02 §2l).
  #
  # STATED BOUNDARY (CP-32 Q9, offsets 146-167): a declaration that also writes
  # `uniqueGroupId = true` joins `<declared>-<random UUID>` rather than
  # `<declared>`, so the recorded value is then a PREFIX of the group the
  # consumer really joins. Stated rather than encoded: `metadata_from` has no
  # conditional form, and the declared value is still the group a reader would
  # look for.
  #
  # NOT RECORDED, and each is the criterion applied rather than an omission:
  # `clientId`, `producerClientId`, `producerTransactionalId`, `threads`,
  # `threadsValue`, `pollTimeout`, `sessionTimeout`, `heartbeatInterval`,
  # `offsetStrategy`, `offsetReset`, `isolation`, `errorStrategy`,
  # `redelivery`, `batch`, `properties`, `autoStartup`, `uniqueGroupId` — the
  # other 17 of the 19 elements CP-32 Q4a lists (Q4a's `×21` counts those 19
  # plus the annotation TYPE's own `@Retention` and `@Target`), `value` and
  # `groupId` being the two recorded. Every one of the 17 decides how THIS node
  # polls, commits or retries a message that has already reached it, which no
  # peer can observe.
  metadata_from:
    - { annotation: io.micronaut.configuration.kafka.annotation.KafkaListener,
        attribute: groupId, kind: consumer_group }
    - { annotation: io.micronaut.configuration.kafka.annotation.KafkaListener,
        attribute: value, kind: consumer_group }
  mapping:
    path_from: [value, patterns]
    prefix_from: []
    method_from: method
    all_methods: []
    prefix_annotation: null
    annotations:
      - { fqn: io.micronaut.configuration.kafka.annotation.Topic }
