id: okhttp
displayName: OkHttp
style: fluent
protocol: http
direction: outbound

detect:
  coordinates: ["com.squareup.okhttp3:okhttp"]

requires: [call_site, string_constants, chain_reconstruction]

matches:
  # OkHttp has no fluent client object to root a chain on: a `Request.Builder`
  # is built and thrown to a *separate* `OkHttpClient.newCall(request)` call,
  # joined only through the argument `source` id (D00 §5) — never through
  # receiver/result chaining, which is what `terminal_via_argument` is for.
  roots:
    - { owner: okhttp3.Request$Builder, method: <init>, captures: { http_method: GET } }  # GET is OkHttp's own default
  # EVERY verb-setting method `okhttp3.Request$Builder` declares, measured
  # rather than remembered — `javap -p -s` on okhttp 3.14.9 and 4.12.0 gives
  # the same eight: `get() head() post(RequestBody) put(RequestBody)
  # patch(RequestBody) delete() delete(RequestBody) method(String,
  # RequestBody)` (CP-11, `scripts/probes/cp11_sweep_round1.md`). Completeness
  # is the load-bearing property, not coverage: a verb-setting call this list
  # misses falls through as an unmatched step (D02 §4's "unmatched steps pass
  # through uncaptured") and the root's own `http_method: GET` default stands
  # uncorrected — a confidently WRONG verb, not an honest gap. That default is
  # allowlisted in `tests/architecture/test_defaulted_identity_values.py` on
  # exactly this condition, and it stops being true the day OkHttp adds a
  # ninth.
  #
  # `method(String, RequestBody)` is the fully generic overload (`A-C2`): its
  # verb is argument 0, read through the same `argN` grammar `url`/`body`
  # already use, so `.method("DELETE", body)` derives DELETE and a verb held
  # in a variable the scanner cannot read derives `method: NULL` at
  # `unresolved` — the honest gap this file previously CLAIMED to take while
  # publishing GET.
  #
  # `delete` and `head` capture no body, and the two reasons differ. `head()`
  # has no body overload at all. `delete(RequestBody)` DOES exist in both
  # measured versions — a stated under-report: a `fluent` step matches on name
  # alone (no descriptor key exists in this grammar), so the one step covers
  # both overloads and the arity-1 form's body goes unread. Adding
  # `body: arg0` would fix that overload and break the other, whose absent
  # argument 0 would read as a capture that was reached and could not be
  # resolved, demoting every plain `.delete()` chain to `unresolved`.
  steps:
    - { method: url,    captures: { url: arg0 } }
    - { method: get,    captures: { http_method: GET } }
    - { method: head,   captures: { http_method: HEAD } }
    - { method: post,   captures: { http_method: POST, body: arg0 } }
    - { method: put,    captures: { http_method: PUT, body: arg0 } }
    - { method: patch,  captures: { http_method: PATCH, body: arg0 } }
    - { method: delete, captures: { http_method: DELETE } }
    - { method: method, captures: { http_method: arg0, body: arg1 } }
  # A mapping, not the bare flag: without it, any consumer of `build`'s
  # result (a log statement) would count as executing the request.
  terminal:
    - { method: build, terminal_via_argument: { owner: okhttp3.OkHttpClient, method: newCall } }
  # Which annotations carry configuration onto a field, a constructor
  # parameter or a whole properties type — the field ladder's own vocabulary
  # (2F design §4), so no framework name reaches the engine. OkHttp has no
  # base-address step of its own (every request carries a whole `url`), but
  # that url is as often a `@Value`-fed field as a literal, and the ladder
  # reads it the same way. `getter_prefixes` is the accessor convention the
  # properties rung de-prefixes with (`getUrl` → `url`) before relaxed-binding
  # the name against the type's own declared fields.
  field_sources:
    value_annotation: org.springframework.beans.factory.annotation.Value
    properties_annotation: org.springframework.boot.context.properties.ConfigurationProperties
    prefix_from: prefix
    getter_prefixes: [get, is]

# Shared verbatim across every outbound catalog on purpose (not just these
# three plus RestTemplate), for the same reason `nullability` is copied from
# spring-mvc.yml elsewhere: shape (type) expansion is a *global*,
# insert-if-absent pass keyed on the type symbol alone (`derive_shapes`), so
# the FIRST catalog to reach a shared payload type is the one that expands
# it, and every later catalog finds it already there — regardless of
# protocol or direction, including a row a *different* catalog produced
# (Retrofit's own `Call<OrderView>`, say). Every outbound catalog's
# wrappers/serialization/known_types must therefore agree, or the first one
# alphabetically silently mis-describes a route it never derived.
# Endpoint-level ownership is a different question and is NOT this reason:
# `_owns` reads a row's own `catalog_id` (2E-prep design §1a), so a
# catalog's rules describe only the rows it derived itself.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,              payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                       payload_arg: 0, semantics: optional }
  - { type: retrofit2.Call,                           payload_arg: 0, semantics: async }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  # A `class` literal or a constructed `instance` reaches payload rooting as a
  # bare symbol: the extractor's own wire projection travels on a type
  # reference (D00 §5a), and a call argument carries none. So the types that
  # projection already flattens — the boxes and String — are declared here
  # too, with exactly the `wire`/`format` it emits for each, so a captured
  # `String.class` and a scanned `String` field can never disagree. `Void`
  # reaches no wire type at all: the empty `wire` a `void` return already
  # carries reads as "no payload", never as a shape nobody can expand.
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
