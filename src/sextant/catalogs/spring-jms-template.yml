id: spring-jms-template
displayName: Spring JMS (JmsTemplate)
style: single_call
protocol: jms
direction: outbound

detect:
  coordinates: ["org.springframework:spring-jms"]

requires: [call_site, string_constants]

matches:
  owner: org.springframework.jms.core.JmsTemplate
  # CHECKPOINT FACT (real javap descriptors, spring-jms 6.1.6):
  # `convertAndSend(String, Object)` arity 2; `convertAndSend(Object)` arity
  # 1 targets the template's own configured default destination — no
  # destination argument at the call site at all, so no `channel_arg` is
  # declared — `path` NULL, `resolution: unresolved` (I1).
  #
  # THE OVERLOAD COLLISION, CLOSED (2O Task 7 review, Critical 1). Arity 2 is
  # THREE overloads, not one: `(String, Object)`, `(Destination, Object)` and
  # `(Object, MessagePostProcessor)`. Matching on name+arity alone reached
  # this row for all three, so a `convertAndSend(payload, postProcessor)` call
  # whose payload itself READS — an ordinary lambda-free
  # `MessagePostProcessor` passed as a `class`/`instance` literal — published
  # the message BODY as the queue name at `resolved`/`compiler` (§8: the
  # failure mode is fabrication). The earlier note here said those overloads
  # were "not exercised by the fixture, so neither is declared", which implied
  # no consequence; arity matching meant they WERE matched, and that rationale
  # was false. The arity-2 row now states its own erased JVM descriptor, which
  # `_matching_method` compares verbatim against the call's own
  # `target.descriptor`.
  #
  # THE CONSEQUENCE: the arity is claimed by that descriptor, so the
  # `Destination` and `MessagePostProcessor` forms now derive NOTHING where
  # they used to derive an `unresolved` row — a stated under-report in
  # docs/COVERAGE.md rather than a fabricated destination. It stops being
  # right if spring-jms changes the `(String, Object)` descriptor; `javap
  # JmsTemplate` is the check.
  #
  # Arity 1 is `convertAndSend(Object)` and nothing else — no sibling to
  # collide with, so no descriptor is declared and the row keeps matching
  # every arity-1 call. `javap JmsTemplate` is the check that stays true.
  methods:
    - { name: convertAndSend, arity: 2, descriptor: "(Ljava/lang/String;Ljava/lang/Object;)V",
        channel_arg: 0, body_arg: 1 }
    - { name: convertAndSend, arity: 1, body_arg: 0 }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale). `nullability` is harvested from spring-mvc.yml.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

nullability:
  nullable: [org.jspecify.annotations.Nullable, org.springframework.lang.Nullable,
             javax.annotation.Nullable, jakarta.annotation.Nullable,
             org.jetbrains.annotations.Nullable]
  not_null: [org.jspecify.annotations.NonNull, org.springframework.lang.NonNull,
             org.jetbrains.annotations.NotNull]
  scope:
    - { annotation: org.jspecify.annotations.NullMarked, means: not_null_by_default }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  # A `class` literal or a constructed `instance` reaches payload rooting as a
  # bare symbol: the extractor's own wire projection travels on a type
  # reference (D00 §5a), and a call argument carries none. So the types that
  # projection already flattens — the boxes and String — are declared here
  # too, with exactly the `wire`/`format` it emits for each, so a captured
  # `String.class` and a scanned `String` field can never disagree. `Void`
  # reaches no wire type at all: the empty `wire` a `void` return already
  # carries reads as "no payload", never as a shape nobody can expand.
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
