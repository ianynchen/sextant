id: javalin
displayName: Javalin
# The flat registration form (`javalin-routing`) — `app.get("/path", handler)` on a
# `Javalin` instance, the shape the Javalin front page shows, AND
# `config.router.mount(router -> router.get("/path", handler))`, the second flat
# form (found on review): both call the identical fourteen descriptors, at the
# identical argument position, with no nesting — only the receiver's DECLARED type
# differs, which is why `owner:` below names three types rather than one. The
# NESTED form, `ApiBuilder.get(…)` called inside a lambda passed to `path(…)` inside
# `config.router.apiBuilder(…)`, is a tree this style cannot fold — read by its
# sibling `javalin-apibuilder.yml` (`combinator`, A2 Task 3), and stated
# `slice.outside` below rather than matched wrongly here.
style: single_call
protocol: http
direction: inbound

detect:
  coordinates: ["io.javalin:javalin"]

measured:
  - { artifact: io.javalin:javalin, versions: ["6.4.0"],
      identity: reported, by: scripts/probes/w61_javalin_surface.md }

requires: [call_site, string_constants]

matches:
  # `JavalinDefaultRoutingApi<API>` declares the verbs as `default` methods, and
  # exactly TWO types implement it (measured, w61): `io.javalin.Javalin` — the
  # top-level app, `app.get(...)` — and `public final class
  # io.javalin.router.JavalinDefaultRouting`, reached through
  # `RouterConfig.mount(Consumer<JavalinDefaultRouting>)`, `config.router.mount(router
  # -> router.get(...))`. A call site's owner is the receiver's DECLARED type, so all
  # three spellings are named per §3.1, the same shape `spring-resttemplate.yml`'s
  # `RestTemplate`/`RestOperations` pair already uses — one library, three names.
  owner:
    - io.javalin.Javalin
    - io.javalin.router.JavalinDefaultRoutingApi
    - io.javalin.router.JavalinDefaultRouting
  methods:
    - { name: get, arity: 2, http_method: GET, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: get, arity: 3, http_method: GET, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: post, arity: 2, http_method: POST, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: post, arity: 3, http_method: POST, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: put, arity: 2, http_method: PUT, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: put, arity: 3, http_method: PUT, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: delete, arity: 2, http_method: DELETE, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: delete, arity: 3, http_method: DELETE, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: patch, arity: 2, http_method: PATCH, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: patch, arity: 3, http_method: PATCH, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: head, arity: 2, http_method: HEAD, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: head, arity: 3, http_method: HEAD, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
    - { name: options, arity: 2, http_method: OPTIONS, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;)Lio/javalin/router/RoutingApi;" }
    - { name: options, arity: 3, http_method: OPTIONS, url_arg: 0,
        descriptor: "(Ljava/lang/String;Lio/javalin/http/Handler;[Lio/javalin/security/RouteRole;)Lio/javalin/router/RoutingApi;" }
  # HANDLER-BODY READS (spec 2026-09-19 §5d, mechanism 3; CP-25 rows 14–15). What a
  # handler reads off `Context` is one `endpoint_metadata` row per read, matched against
  # the handler body's own call sites — declared ONCE here and applied by HANDLER, so the
  # rows `javalin-apibuilder.yml` derives get the same reads without a second copy (§5d).
  # `Context` is an interface and the reads are its default methods, so a call site is
  # `invokeinterface io/javalin/http/Context.<name>` on the handler's `ctx` (measured on
  # `fixtures/orders-javalin`'s `OrderApp.lambda$nested$10`, `javap -c -p`, 2026-09-20).
  #
  # ARITY IS THE WHOLE DISTINCTION (F7, row 14): `header(String)` READS the request
  # (`req().getHeader`), `header(String, String)` SETS a response header
  # (`res().setHeader`); `cookie(String)` reads, `cookie(String, String[, int])` and
  # `cookie(Cookie)` set. An entry naming the method alone would record every response
  # header the handler sets as a request requirement, so every entry here carries the
  # arity of the read and no other. `queryParam(String)` is `queryParams(key).firstOrNull()`.
  # All three hand a null through: `requirement` NULL (A3) — the handler reads the value,
  # Javalin decides nothing.
  #
  # `queryParamAsClass(String, Class)`/`headerAsClass(String, Class)` read through the same
  # one-argument read and hand back a `Validator`; `Validator.get()` (row 15) is
  # `getOrThrow(...)` over an error map that carries `NULLCHECK_FAILED` when the value is
  # absent and the validator is not a `NullableValidator` — a `ValidationException`, the
  # FRAMEWORK refusing the request. So the read is `required` exactly when its result is
  # the receiver of a `get` (`then`, one result-to-receiver step), and NULL when the chain
  # ends in `getOrDefault`, `allowNullable()`, `check(...)` alone or nothing.
  #
  # STATED BOUNDARY: a `single_call` row's `handler` is the REGISTERING method
  # (`OrderApp#flat`), not the `Handler` lambda it passes, so the lambda's reads are not
  # in the body this pass scans and a flat `app.get("/x", ctx -> ctx.queryParam("q"))`
  # writes nothing; the `ApiBuilder` rows carry the lambda body as `handler` and read
  # fully (COVERAGE). Also the handler body only: a `ctx` handed to a helper is not followed.
  request_reads:
    - { owner: io.javalin.http.Context, method: queryParam, arity: 1, name_arg: 0, kind: query }
    - { owner: io.javalin.http.Context, method: header,     arity: 1, name_arg: 0, kind: header }
    - { owner: io.javalin.http.Context, method: cookie,     arity: 1, name_arg: 0, kind: cookie }
    - { owner: io.javalin.http.Context, method: queryParamAsClass, arity: 2, name_arg: 0, kind: query,
        then: { method: get, requirement: required } }
    - { owner: io.javalin.http.Context, method: headerAsClass,     arity: 2, name_arg: 0, kind: header,
        then: { method: get, requirement: required } }

# Every candidate below is measured against `scripts/probes/w19_catalog_surface.md`
# (regenerated for this catalog) — a method the enumeration lists as unread AND
# addressable (a `String` at argument 0), which is what
# `tests/architecture/test_catalog_slice_coverage.py` checks this file against.
slice:
  outside:
    - owner: io.javalin.Javalin
      method_names: [start]
      why: >
        `start(String host, int port)` takes a `String` at argument 0, exactly the
        shape this catalog reads a URL at — but the string is the BIND HOST, not a
        route. A row here would publish a host address as an HTTP endpoint path.
    - owner: io.javalin.Javalin
      method_names: [sse, ws, before, beforeMatched, after, afterMatched, wsBefore, wsBeforeUpgrade, wsAfter, wsAfterUpgrade]
      why: >
        `sse`/`ws` register OTHER protocols this catalog does not derive as `http`
        (SSE and WebSocket have their own catalogs); `before`/`beforeMatched`/
        `after`/`afterMatched` and their `ws*` twins are FILTERS — cross-cutting
        interceptors matched against a path pattern, never routes an HTTP client can
        address on their own. A row for any of these would publish plumbing as an
        endpoint, the same ruling `jakarta-servlet.yml` makes for `@WebFilter`.
    - owner: io.javalin.router.JavalinDefaultRoutingApi
      method_names: [sse, ws, before, beforeMatched, after, afterMatched, wsBefore, wsBeforeUpgrade, wsAfter, wsAfterUpgrade]
      why: >
        The interface `Javalin` implements, carried as an owner alternate (§3.1). Its
        slice is its implementation's slice: each name here is outside for the reason
        given above for the same name on `Javalin`.
    - owner: io.javalin.router.JavalinDefaultRouting
      method_names: [sse, ws, before, beforeMatched, after, afterMatched, wsBefore, wsBeforeUpgrade, wsAfter, wsAfterUpgrade]
      why: >
        The SECOND type implementing that interface, reached through
        `RouterConfig.mount(Consumer<JavalinDefaultRouting>)` — same names, same
        reason as `Javalin`'s entry above.
    # `addHttpHandler(HandlerType, String, Handler[, RouteRole...])` carries its verb
    # as an ENUM at argument 0 rather than in the method NAME — no `single_call` word
    # reads a verb off an argument, so this row would need one that does not exist
    # yet. It is NOT in the mechanical list above: its own descriptor opens with
    # `HandlerType`, not `String`, so w19's own "name at argument 0" measurement does
    # not count it as a candidate, and declaring it here would be a STALE entry
    # `test_no_slice_names_a_method_the_enumeration_does_not_list` refuses (Task 5's
    # `repartition` precedent). Stated here in prose instead, on all three owners.
    #
    # `io.javalin.apibuilder.ApiBuilder` is not in this catalog's `matches.owner` at
    # all — it is a DIFFERENT type, read by no row above — so its whole addressable
    # surface needs its own mechanical entry, immediately below, rather than riding
    # on the three owners' entries above.
    - owner: io.javalin.apibuilder.ApiBuilder
      method_names: [get, post, put, patch, delete, head, before, after, ws, wsBefore, wsAfter, sse, crud, path, prefixPath]
      why: >
        `ApiBuilder`'s verbs are STATIC methods called inside a lambda passed to
        `path(prefix, () -> { … })`, which composes the full address across TWO
        stack frames neither `single_call` nor this catalog's `owner` conjunct
        reaches — reading `ApiBuilder.get("/{id}", h)` on its own would publish
        `/{id}` with no `path(…)` prefix, a WRONG row rather than a missing one
        (pinned by `test_javalin_flat_registrations_derive_every_route`'s own
        assertion that `/{id}` never appears). The sibling `javalin-apibuilder.yml`
        (`combinator`) reads the six verbs and `path` as one tree under
        `RouterConfig.apiBuilder`; they stay outside THIS file's slice because this
        file reads none of them. `before`/`after`/`ws*`/`sse` sit outside both for
        the same filter/other-protocol reason as the owners above; `crud` registers
        FIVE routes off one `CrudHandler` argument, a one-call-to-many-rows shape
        neither file has a word for (`javalin-crud` on the register); `prefixPath`
        is the prefix computation, not a route.
