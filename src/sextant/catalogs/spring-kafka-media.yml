id: spring-kafka-media
displayName: Spring Kafka (serializer-configured media)
style: config_join
# NO `protocol` AND NO `direction`, and the absence is a claim (OI-1). This
# catalog derives no rows of its own — it stamps rows other engines minted —
# and each rule below carries the `(protocol, direction)` pair of rows it
# applies to, so neither field could ever reach an endpoint from here.
#
# *The pair read `kafka`/`inbound` until OI-1's fix, declared only because the
# wire-identity rule was keyed on the STYLE and `config_join` is nominally a
# wire one. `resolve/endpoints.py` now asks what the CATALOG derives, so a
# top-level default that names nothing this file writes is refused rather than
# required — and `direction: inbound` on a file whose two rules stamp one
# inbound and one outbound column was the clearest sign it was decorative.*

detect:
  coordinates: ["org.springframework.kafka:spring-kafka"]

# W53 (`G-88`). Every class named below was a SPELLING until this probe: no
# `io.confluent` artifact resolved anywhere when A2 audited this file, and a
# class absent from these maps stamps nothing (D02 §4) — so a typo and an
# unconfigured module are indistinguishable in the output. All fourteen opened,
# all fourteen present.
measured:
  - { artifact: io.confluent:kafka-avro-serializer, versions: ["7.6.0"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }
  - { artifact: io.confluent:kafka-protobuf-serializer, versions: ["7.6.0"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }
  - { artifact: io.confluent:kafka-json-schema-serializer, versions: ["7.6.0"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }
  - { artifact: io.confluent:kafka-json-serializer, versions: ["7.6.0"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }
  # `kafka-clients` states its version in `kafka/kafka-version.properties` — its
  # manifest is 25 bytes and carries none. Still `reported`, not `assumed`.
  - { artifact: org.apache.kafka:kafka-clients, versions: ["3.6.2"],
      identity: reported, by: scripts/probes/w53_kafka_serializer_identities.md }

bean_model: spring

requires: [resolved_config]

matches:
  # D02 §2d's second vocabulary: the same resolved configuration read for a
  # media type rather than an address — the config-declared evidence kind
  # D01 §3 already reserves a place for. A rule names the key, which of the
  # two media columns it fills, and the rows it applies to; `values` says
  # what each configured class means on the wire.
  #
  # A stamp lands only where every resolved environment agrees, and never
  # over a non-NULL column: a declaration read off the code itself always
  # wins over a module-level default. An unresolved or unknown class stamps
  # nothing — the class name is in `resolved_config` regardless, which is
  # what a later format-inference pass reads.
  media_from_config:
    rules:
      # `on` is QUOTED deliberately: YAML 1.1 reads a bare `on` as the
      # boolean true, so an unquoted key here would never reach the
      # engine under the name D02 §2d gives it.
      - { key: spring.kafka.producer.value-serializer,   fills: produces,
          "on": { protocol: kafka, direction: outbound } }
      - { key: spring.kafka.consumer.value-deserializer, fills: consumes,
          "on": { protocol: kafka, direction: inbound } }
    values:
      # The producer side's own three classes. A deserializer key normally
      # names a *Deserializer class, so those spellings are declared beside
      # them: one map serves both rules, and a class absent from it stamps
      # nothing rather than guessing.
      org.springframework.kafka.support.serializer.JsonSerializer: application/json
      org.springframework.kafka.support.serializer.JsonDeserializer: application/json
      org.apache.kafka.common.serialization.StringSerializer: text/plain
      org.apache.kafka.common.serialization.StringDeserializer: text/plain
      org.apache.kafka.common.serialization.ByteArraySerializer: application/octet-stream
      org.apache.kafka.common.serialization.ByteArrayDeserializer: application/octet-stream
    # 2G design §7, rung 3: the SAME configured classes, answering the other
    # question — not what MIME type they imply, but what is actually on the
    # wire. Read by `resolve/format.py`, which reuses the `rules` above (they
    # already say which key holds a serializer and which rows it covers)
    # rather than declaring a second copy of that machinery.
    #
    # `values` and `format_from` are deliberately not the same key set. A
    # schema-registry serializer has no MIME string anyone registered, so it
    # appears here and NOT above: it stamps no media and answers rung 3
    # instead, which is the more honest of the two answers — a serializer
    # states the wire outright, where a MIME type for it would be invented.
    # The reverse also holds: a class whose wire format this table cannot
    # name still contributes its media type.
    format_from:
      org.springframework.kafka.support.serializer.JsonSerializer: json
      org.springframework.kafka.support.serializer.JsonDeserializer: json
      org.apache.kafka.common.serialization.StringSerializer: string
      org.apache.kafka.common.serialization.StringDeserializer: string
      org.apache.kafka.common.serialization.ByteArraySerializer: bytes
      org.apache.kafka.common.serialization.ByteArrayDeserializer: bytes
      io.confluent.kafka.serializers.KafkaAvroSerializer: avro
      io.confluent.kafka.serializers.KafkaAvroDeserializer: avro
      io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer: protobuf
      io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer: protobuf
      # Confluent's JSON-Schema serializer puts plain JSON on the wire and
      # carries the schema out of band. `json` is what it means HERE; the
      # `json_schema` value the design reserves (2G design §4) is about the
      # SCHEMA language, is implemented by nothing, and is refused if a
      # catalog writes it.
      io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer: json
      io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer: json
      io.confluent.kafka.serializers.KafkaJsonSerializer: json
      io.confluent.kafka.serializers.KafkaJsonDeserializer: json
