id: spring-web
displayName: Spring Web
style: annotation_driven
protocol: http
direction: inbound

detect:
  coordinates: ["org.springframework:spring-web"]

measured:
  - { artifact: org.springframework:spring-webmvc, versions: ["6.1.6", "6.2.15", "7.0.2", "7.0.9"],
      identity: reported, by: scripts/probes/cp7_http_exchange.md }

bean_model: spring

requires: [annotation_args, type_annotations]

matches:
  type_annotation: org.springframework.web.bind.annotation.RestController
  request_body: { annotation: org.springframework.web.bind.annotation.RequestBody, fallback: none }
  # Spec 2026-09-19 §5b, mechanism 1: what the BINDER enforces on each annotated
  # parameter, one `endpoint_metadata` row per parameter with `requirement` set.
  # `requirement: binder` is `AbstractNamedValueMethodArgumentResolver.resolveArgument`
  # read off spring-web 6.1.6 (CP-25 row 2): a missing value takes `defaultValue` when
  # one is WRITTEN — an unwritten one never reaches the class file, CP-25 row 5 — else
  # the request is rejected when `required` (default true) and not
  # `MethodParameter.isOptional()`: `java.util.Optional`, a declaration annotation whose
  # simple name is `Nullable` (read here as the shape model's `nullability.nullable`
  # spellings — NOT the type reference's own `nullable`, which every Java reference
  # type carries by language rule), or a Kotlin nullable/defaulted parameter, which
  # arrives as kotlinc's `@Nullable` and the extractor's `declares_default` (CP-25 row
  # 3) — the Kotlin branch of `isOptional()` runs only behind
  # `KotlinDetector.isKotlinReflectPresent()` (row 3), so `optional` for a Kotlin
  # DEFAULT assumes `kotlin-reflect` on the runtime classpath; without it
  # `@RequestParam page: Int = 0` is `required` (a `String?` stays `optional` through
  # kotlinc's `@Nullable` annotation, read without reflection). Nearly always present
  # (Initializr, `jackson-module-kotlin`), not checked here: `docs/open-issues.md` OI-105.
  # `kind: param` on `@RequestParam` because Spring reads query string and form
  # body through one API and the annotation cannot tell them apart (§5a). The type
  # names live HERE because the pass names no language's types: `optional_types` is
  # `isOptional()`'s first disjunct; `skip_types` are the whole-map bindings — a
  # `Map`/`MultiValueMap` under `@RequestParam` or `@RequestHeader`, `HttpHeaders` under
  # `@RequestHeader` — which bind everything and name nothing, so there is no row to
  # write for them (`@CookieValue` has no map form).
  request_params:
    - annotation: org.springframework.web.bind.annotation.RequestParam
      kind: param
      name_attrs: [name, value]
      requirement: binder
      required_attr: required
      default_attr: defaultValue
      optional_types: [java.util.Optional]
      skip_types: [java.util.Map, org.springframework.util.MultiValueMap]
    - annotation: org.springframework.web.bind.annotation.RequestHeader
      kind: header
      name_attrs: [name, value]
      requirement: binder
      required_attr: required
      default_attr: defaultValue
      optional_types: [java.util.Optional]
      skip_types: [java.util.Map, org.springframework.util.MultiValueMap, org.springframework.http.HttpHeaders]
    - annotation: org.springframework.web.bind.annotation.CookieValue
      kind: cookie
      name_attrs: [name, value]
      requirement: binder
      required_attr: required
      default_attr: defaultValue
      optional_types: [java.util.Optional]
  mapping:
    # `value` and `path` are @AliasFor each other, so only the one the author
    # typed reaches the bytecode. First present wins, in this order.
    path_from: [value, path]
    prefix_from: [value, path]
    # Spring joins a class-level prefix to a method-level path with EXACTLY
    # ONE `/`, whichever half spelled it: `@RequestMapping("/api/gateway")` +
    # `@GetMapping("owners/{ownerId}")` is served at
    # `/api/gateway/owners/{ownerId}`, and `@RequestMapping("/")` +
    # `@PostMapping("/chatclient")` at `/chatclient`. Both forms are ordinary
    # Spring and both were derived wrong — `/api/gatewayowners/{ownerId}` and
    # `//chatclient` — while the seam was a bare concatenation (found live
    # against spring-petclinic-microservices). Declared here rather than
    # assumed in the engine for the reason `qualifier_separator` is: a Kafka
    # topic name has no segments, so the catalogs composing one declare no
    # separator and keep concatenating bare.
    path_separator: "/"
    # Declared media types (2E Task 5, evidence kind (a)): each mapping
    # annotation's own `consumes`/`produces` attribute, read scalar-or-array
    # like `path_from`. Neither has an alias to worry about here. The SAME
    # names are read off the class-level `@RequestMapping` and apply to every
    # handler that declares none — `ProducesRequestCondition.combine` keeps
    # the method's condition when non-empty and the class's otherwise (added
    # 2026-09-12; until then a class-level `produces = "application/xml"`
    # was dropped and the route read as JSON wherever Jackson was present).
    consumes_from: [consumes]
    produces_from: [produces]
    method_from: method
    # F5 §6.1 (W28). Spring does not choose between two identical mappings — it throws
    # `IllegalStateException` at startup, so the application does not run.
    # `AbstractHandlerMethodMapping$MappingRegistry.validateMethodMapping` keys its
    # registry on the mapping object and refuses a second, different handler under an
    # equal one (spring-webmvc 6.1.6 bytecode, read directly).
    #
    # Declared here and NOT in the messaging catalogs, which is the whole point of it
    # being catalog data: `@KafkaHandler` dispatches by payload type, so several handlers
    # on one topic is ordinary there and reporting it would be a rule mirrored onto a set
    # it does not describe.
    duplicate: conflict
    # The two conditions `RequestMappingInfo.equals` compares that are NOT already
    # columns on the endpoint row. Class-level and method-level values UNION
    # (`ParamsRequestCondition.combine` adds one expression set to the other), so two
    # methods inside one `@RequestMapping(params = "v=1")` class still conflict with each
    # other and not with a method outside it.
    # `version` since Spring 7.0: API versioning is a REQUEST CONDITION
    # (`VersionRequestCondition`) that `RequestMappingInfo.equals` compares exactly as it
    # compares these two. Two handlers on one path with different versions are distinct
    # mappings Spring serves both of; without this word here they read as identical and a
    # `routing_conflict` is filed against a correct API. Absent on 6.x, where the attribute
    # does not exist and so reads as unset — which is the same as not discriminating.
    #
    # verify: javap -cp $(find ~/.m2 -name 'spring-web-7*.jar' | grep -v sources | head -1) \
    #         org.springframework.web.bind.annotation.RequestMapping | grep 'version('
    discriminators: [params, headers, version]
    # Spec 2026-09-19 §5c, mechanism 2: the SAME two attributes read as REQUIREMENTS —
    # one `endpoint_metadata` row per expression, attribute → `kind` (`params` → `param`,
    # because the parameter condition reads the query string and a form body through one
    # API; `headers` → `header`). Parsed as `AbstractNameValueExpression(String)` parses
    # them (CP-25 row 13): `name` → `required`; `name=v` → `required`, value `v`; `!name` →
    # `absent` — the request must NOT carry it; `name!=v` → `optional` — served whenever the
    # value is not `v`, an absent name included, and the EXCLUDED VALUE IS LOST (no column
    # says "not v"; stated here and in COVERAGE). Class-level and method-level expressions
    # UNION (`ParamsRequestCondition.combine`), read off the effective annotation set
    # exactly as `discriminators` above is. A `headers` expression naming `Accept` or
    # `Content-Type` (case-insensitive) writes NO row: `HeadersRequestCondition.
    # parseExpressions` drops both and Spring reads them as produces/consumes instead (A4,
    # CP-25 row 4) — and this catalog's `consumes_from`/`produces_from` read the
    # attributes of that name only, so a media type spelled through `headers=` reaches
    # neither column (a stated boundary, rare in real code).
    request_requirement_attrs: { params: param, headers: header }
    # The conditions on a controller's class (`@Profile`, `@ConditionalOn…`) are the Spring
    # bean model's (`bean-models/spring.yml`, `conditions`): a controller is a bean.
    # The seventh condition, and the one no class file states: a custom `RequestCondition`
    # arrives through a subclass of this type overriding `getCustomMethodCondition`. A
    # module declaring one is left alone entirely rather than told about a conflict it
    # does not have.
    custom_condition: org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping
    all_methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, TRACE]
    prefix_annotation: org.springframework.web.bind.annotation.RequestMapping
    annotations:
      # @RequestMapping carries no pre-set method: it takes one from its own
      # `method` attribute, and means every method when that is absent.
      - { fqn: org.springframework.web.bind.annotation.RequestMapping }
      - { fqn: org.springframework.web.bind.annotation.GetMapping,    method: [GET] }
      - { fqn: org.springframework.web.bind.annotation.PostMapping,   method: [POST] }
      - { fqn: org.springframework.web.bind.annotation.PutMapping,    method: [PUT] }
      - { fqn: org.springframework.web.bind.annotation.DeleteMapping, method: [DELETE] }
      - { fqn: org.springframework.web.bind.annotation.PatchMapping,  method: [PATCH] }

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,             payload_arg: 0, semantics: async }
  - { type: reactor.core.publisher.Flux,             payload_arg: 0, semantics: streaming }
  # 2H Task 6 fix round 1. `ServerSentEvent<T>` is the per-EVENT envelope an
  # SSE stream carries — `id`/`event`/`retry` metadata wrapped around `data:
  # T` — so the payload on that wire is `T`, exactly as `ResponseEntity`'s is.
  # Without this line `Flux<ServerSentEvent<OrderView>>` peeled its outer
  # `Flux` and then stopped, publishing the envelope TYPE as the contract;
  # `rooting.py` peels recursively, so one entry is the whole remedy.
  # `http_envelope`, not `streaming`: the stream is the `Flux` around it, and
  # `semantics` only ever gates `optional`, so the value is a label for a
  # reader rather than a branch.
  - { type: org.springframework.http.codec.ServerSentEvent,
      payload_arg: 0, semantics: http_envelope }
  - { type: java.util.concurrent.CompletableFuture,  payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                      payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# 2H design §6: what turns one of THIS catalog's own rows (`protocol: http`,
# above) into a row of another protocol. `resolve/protocol_hint.py` runs it
# after the engines' merge and before the format ladder; it changes protocol,
# never direction, and never creates an endpoint.
#
# The source protocol is this catalog's own `protocol` field and is never
# named here — that is what scopes the pass to HTTP rows without the pass
# knowing what HTTP is. `protocol:` below is the TARGET.
#
# Two evidence kinds, media first:
#
# `hint_media` — reads the row's `produces` only, in every direction (consumes means
#   "accepts event-stream request bodies", never stream-serving evidence). An HTTP media declaration, so it is duplicated on `spring-mvc.yml` exactly as
#   `media_formats` below is, and for the same reason: this family ships two
#   catalogs that each own the HTTP protocol, and a module pulling in only one
#   of them must still get the vocabulary. The pass UNIONS the two lists (and
#   refuses a contradiction on `protocol`), so a copy that drifted can only
#   widen one file's evidence — never silently change what the other reads.
#
# `hint_returns` — a marker type appears ANYWHERE in the handler's return
#   type: as the returned type itself, or as any type argument nested inside
#   it, to any depth. Both halves of that rule are load-bearing, because the
#   two real shapes sit at opposite ends of it — `ServerSentEvent<T>` arrives
#   as the MIDDLE link of `Flux<ServerSentEvent<T>>`, whose outer symbol is an
#   ordinary reactive type that says nothing about SSE, while `SseEmitter`
#   (spring-webmvc's, declared on `spring-mvc.yml`) is the outer symbol of a
#   flat return with no arguments at all. Unlike `hint_media` these are
#   LIBRARY types, so each is declared once by the catalog whose own artifact
#   declares it — the `parse_calls` rule, not the `media_formats` one: two
#   lists of type names that drifted apart could not be caught the way two
#   contradicting map keys are.
protocol_hint:
  protocol: sse
  hint_media: [text/event-stream]
  hint_returns:
    - org.springframework.http.codec.ServerSentEvent

# 2G design §7, rung 2: what a declared MIME string means on the wire. Shipped
# on the catalogs that own the HTTP protocol, because a `consumes`/`produces`
# attribute is an HTTP declaration; the table itself is protocol-neutral and
# the ladder unions it across every catalog that declares one (two catalogs
# contradicting each other on one key is refused, not resolved).
#
# A MIME string absent from this table maps to nothing — the row then falls to
# a lower rung rather than being guessed at, exactly as an unmapped serializer
# class stamps no media.
#
# **`text/event-stream` is deliberately NOT here, and its absence is a rule
# rather than an omission** (2H design §6). It is the ENVELOPE, not the
# payload: SSE frames the wire, and what each event's `data:` line carries is
# a separate question the MIME string does not answer. Mapping it to anything
# would state a format nobody declared — so an SSE row falls past rung 2 and
# is answered by whatever really describes its payload, which in this module
# is rung 5's assumed JSON default. The MIME string is read, by
# `protocol_hint` above: it names the PROTOCOL, which is a different column
# and a different claim.
media_formats:
  application/json: json
  application/x-protobuf: protobuf
  application/protobuf: protobuf
  avro/binary: avro
  application/xml: xml
  text/xml: xml

# 2G design §7, rung 5: the package families whose presence anywhere in a
# module is evidence that a JSON default converter is on the classpath. Both
# Jackson generations are listed because the relocation between them is a
# package rename and nothing else — two rows here, zero code.
#
# PRESENCE, not usage: a payload carrying none of these annotations is still
# converted by whichever of them the build resolved, which is why the rung
# answers `narrowed` for every ordinary payload rather than only for annotated
# ones.
json_default_markers:
  - com.fasterxml.jackson
  - tools.jackson
  # 2O design §7 (CP-6): Boot auto-configures Jackson's converter from the
  # jar's mere presence, so a module carrying it answers `json` even with no
  # annotation anywhere. A coordinate marker, not a package family, because
  # that is the evidence Boot itself acts on.
  - coordinate: com.fasterxml.jackson.core:jackson-databind

# 2G design §7's fourth vocabulary, read by
# `resolve/shapes/parse_binding.py`: which payload parameter types mean "this
# channel carries the wire's bytes", and which calls turn those bytes into a
# typed payload.
#
# Declared ONCE, here, and unioned across catalogs by the pass exactly as
# `media_formats` and `json_default_markers` above are. Unlike those two it is
# not owned by a PROTOCOL — no protocol owns `readValue`, and a hand-written
# parse happens on any bytes-only channel — so it is owned by the libraries it
# names, and this file is already where 2G's library vocabulary lives: both
# parser package families are named in `json_default_markers` directly above,
# and `media_formats` names the two schema formats. A duplicate copy on
# another catalog of the family (the shape `media_formats` takes) is
# deliberately NOT made: these entries are a LIST, and two lists that drifted
# apart could not be caught the way two contradicting map keys are.
parse_calls:
  # A payload parameter of one of these types is the precondition for
  # binding at all: the handler's own signature says nothing about what is on
  # the wire, so the parse call in the code is the only evidence there is. A
  # handler declaring a real payload type is already described by its
  # signature and is never rebound.
  # `byte[]` is QUOTED deliberately: YAML's flow syntax reads a bare `[` as
  # the start of a sequence, so an unquoted array type never reaches the
  # loader at all.
  bytes_payloads: [java.lang.String, "byte[]"]
  calls:
    # Protobuf, matched by the owner's HIERARCHY and never by a name pattern
    # (2G design §7) — the payload type IS the receiver, so a rule keyed on
    # the generated class's own name would have to know how a code generator
    # spells its output.
    #
    # `MessageOrBuilder` is the marker that joins through the INTERFACE chain
    # and it is listed first for that reason: a generated message's own
    # `implements ...OrBuilder`, and that interface's own
    # `extends MessageOrBuilder`, are both emitted.
    #
    # **The sentence that stood here — "a generated message's
    # `extends GeneratedMessage` is NOT emitted at all" — was false and is
    # corrected (`A-M12`).** `supertype` really is D00 §5a's
    # parameterised-type carrier and really does miss a non-generic `extends`,
    # but capability 9.13 emits a separate `superclass` field for EVERY
    # non-`Object` superclass, and the ancestry walk in
    # `shapes/parse_binding.py` now reads it. So the three `GeneratedMessage*`
    # spellings are reachable by the class chain as well as by a generic
    # builder's supertype, and a payload whose only route to a marker is a
    # plain `extends` binds instead of silently keeping its bytes shape.
    #
    # Whether the LITE runtime reaches any of these is **unverified** and was
    # already so before this correction (`A-Mi2`): no `protobuf-javalite` jar
    # was available to the sweep. `GeneratedMessageLite` is listed, so a
    # module whose payloads extend it binds either way; the claim this file
    # used to make about it — that it "reaches none of these and binds
    # nothing" — is not asserted here any more, because nothing measured it.
    - owner_hierarchy:
        - com.google.protobuf.MessageOrBuilder
        - com.google.protobuf.GeneratedMessage
        - com.google.protobuf.GeneratedMessageV3
        - com.google.protobuf.GeneratedMessageLite
      method: parseFrom
      bytes_arg: 0
      payload_from: receiver_owner
    # Both generations of the same library. The relocation between them is a
    # package rename and nothing else, which is why it costs three rows and
    # no code: the mapper class, its `JsonMapper` subtype (the spelling a
    # caller declaring the narrower type produces at the call site), and the
    # older package's own.
    - { owner: com.fasterxml.jackson.databind.ObjectMapper, method: readValue,
        bytes_arg: 0, payload_from: class_arg, class_arg: 1 }
    - { owner: tools.jackson.databind.ObjectMapper, method: readValue,
        bytes_arg: 0, payload_from: class_arg, class_arg: 1 }
    - { owner: tools.jackson.databind.json.JsonMapper, method: readValue,
        bytes_arg: 0, payload_from: class_arg, class_arg: 1 }
    # Avro's reader construction names the payload type and NOTHING ELSE: the
    # bytes reach a separately built decoder, never this call. It therefore
    # declares no `bytes_arg`, and the pass binds nothing from it — a rung
    # that bound it would be asserting a flow it never saw. Declared because
    # 2G design §7 names it and because the entry is where the type lives the
    # day a decoder-tracing rung exists.
    - { owner: org.apache.avro.specific.SpecificDatumReader, method: "<init>",
        payload_from: class_arg, class_arg: 0 }

# D02 §2i: the family's own configuration model — carried on the family's
# base catalog, one per framework family, read by resolve/config.py's M04
# pass 2 rather than assumed by any engine.
config_model:
  sources:                      # precedence order, lowest first
    - { pattern: "bootstrap{-profile}.properties" }
    - { pattern: "bootstrap{-profile}.yml" }
    - { pattern: "application{-profile}.properties" }
    - { pattern: "application{-profile}.yml" }
  profiles:
    from_filename: "{-profile}"
    from_document_key: spring.config.activate.on-profile
    default_profile: default
    # An environment's ACTIVE profiles, which a `@Profile` condition is evaluated against
    # (conditional-beans Task 7b; CP-45, `scripts/probes/cp45_active_profiles.md`): the keys
    # listing the active profiles (row 1), those included beside them (row 2), and those
    # active where neither names one (row 1; `default_profile` is the reserved name, row 1).
    # Each value is a comma-separated list or a list (row 4); only the base configuration
    # sets them (row 7). `group_prefix.<name>` lists the profiles active wherever `<name>`
    # is, transitively (row 8, `expandProfiles`).
    active_keys: [spring.profiles.active]
    include_keys: [spring.profiles.include]
    default_keys: [spring.profiles.default]
    group_prefix: spring.profiles.group
    by: scripts/probes/cp45_active_profiles.md
  placeholders: { open: "${", close: "}", default_separator: ":" }
  key_matching: relaxed          # relaxed | exact
  # `spring.config.import`-shaped prefixes (2F design §2's `remote_source`
  # reason): a winning value starting with one of these names a config-server
  # import, not a value this pass can ever resolve from files alone.
  remote_prefixes: ["configserver:", "optional:configserver:"]

# **The key under which a module registers the name OTHER modules call it by** (the
# reactor-linking spec 2026-10-19; `D01`'s `participants.aliases`, `M05`'s "alias index").
#
# **On this file for the reason `config_model` and `terminals` are** — the family's base
# catalog carries what is true across the family, a declaration-only file cannot be a catalog
# (`style` and `matches` are required and this declares no boundary), and every catalog is
# loaded regardless of gating, so the declaration reaches every module.
#
# **A build coordinate is not a service name, and the gap is not cosmetic.** The artifactId is
# `spring-petclinic-customers-service`; every client in that system states `customers-service`,
# which is the name the module registers in discovery and declares in its own configuration.
#
# **MEASURED as a correspondence on real code, which is the right evidence for this claim and
# is stated rather than replaced by a bytecode probe.** The claim is that the value at this key
# is the name other modules call this one by. Counting the distinct names clients actually
# state across two multi-module systems, against what each module declares:
#
# | | names stated by clients | matched by this key's value | matched by the artifactId |
# |---|---|---|---|
# | `spring-petclinic-microservices` | 4 | **4** | 0 |
# | `mall-swarm` | 5 | 0 | **5** |
#
# Nothing in either system is matched by neither, and NEITHER source alone covers both: the
# artifactId misses every one of petclinic's, and petclinic's registered names are exactly
# what its clients write. So a participant answers to both, and the link yield is 0 without
# this key on that corpus and 10 with it. `mall-swarm`'s modules register names identical to
# their artifactIds, which is why they carry no alias at all.
#
# One key, not a list: a module registers under one name, and declaring several would claim
# otherwise. A module declaring no value keeps its artifactId, which is `petclinic`'s config
# server — 1 of its 8 modules.
participant_name_key: spring.application.name

# D02 §2j (F7 §8.2, W30). What a call REACHES, where the call is a terminal — D00 §4's
# `terminal_kind`, which that schema declared and nothing produced for two phases. Its own
# note said why, and the note was right: "a data-access call is `persistence` only to
# something that knows the callee is one". This is that knowledge.
#
# **On this file for the reason `config_model` is** — the family's base catalog carries
# what is true across the family. A terminals-only file cannot be a catalog (`style` and
# `matches` are required and it declares no boundary), and every catalog is loaded
# regardless of gating, so these rules reach every module.
#
# **Three routes, because three frameworks answer differently**, and each was measured on a
# real repository before it was written. NONE is a name match: `*Mapper` and `*Repository`
# are naming conventions, and §8.1 forbids a rule weaker than the one the framework applies.
terminals:
  # By OWNER — the call lands on the library type itself.
  #
  # Re-measured whole for W30's review, which found five published figures disagreeing:
  # `EntityManager` is 82 of `spring-petclinic-rest`'s 102 classified terminals and 2 of
  # `jhipster-sample-app`'s 70; `JdbcTemplate` is 3 in petclinic-rest. `RedisTemplate` is
  # 41 on `mall-admin` and is the one rule here whose `target` is not a database — which
  # is what the sub-field is for, and what makes "does this hit a cache or a database"
  # answerable. The `java.sql` rules classify NOTHING on `mall-admin`, which uses MyBatis
  # rather than raw JDBC.
  - { owner: jakarta.persistence.EntityManager,   kind: persistence, target: database }
  - { owner: javax.persistence.EntityManager,     kind: persistence, target: database }
  - { owner: java.sql.Connection,                 kind: persistence, target: database }
  - { owner: java.sql.Statement,                  kind: persistence, target: database }
  - { owner: java.sql.PreparedStatement,          kind: persistence, target: database }
  # `ResultSet` is ALL 17 of `spring-petclinic-rest`'s classified `java.sql` terminals and
  # the other three above are ZERO there — reading a row back is where the JDBC calls
  # actually are. The three are kept because a module using `JdbcTemplate` directly is
  # ordinary and this corpus does not happen to; that they are unmeasured is stated
  # rather than left to be inferred from their absence in the counts.
  #
  # **`java.sql.Date` is deliberately absent**, and it is the near-miss this list has to
  # get right: it is 2 terminals in that same corpus, it lives in the same package, and it
  # is a VALUE — a date that happens to be JDBC's spelling of one. Classifying it as
  # persistence would say a call reaches a database because of the package its argument
  # type came from. The package is not the evidence; the API is.
  - { owner: java.sql.ResultSet,                  kind: persistence, target: database }
  - { owner: org.springframework.jdbc.core.JdbcTemplate,        kind: persistence, target: database }
  - { owner: org.springframework.data.redis.core.RedisTemplate, kind: persistence, target: cache }
  - { owner: org.springframework.data.redis.core.StringRedisTemplate, kind: persistence, target: cache }
  # By SUPERTYPE — the owner implements a declared type.
  #
  # **NOT read from the `type_hierarchy` table**, though this comment said so until W30's
  # review: that table is written by the same pass that writes the edges and written
  # AFTER them, so reading it here returned nothing at all. `resolve/terminals.py` reads
  # the `superclasses`/`implementations` facts directly, in JVMS 5.4.3.3 order.
  #
  # `jhipster-sample-app`'s repositories are its OWN interfaces and carry no annotation at
  # all; the class file says they implement `JpaRepository`, which is 68 of its 70
  # classified terminals.
  #
  # **Naming only the base `Repository` classifies ZERO** — measured, and it is the reason
  # every level a user extends is listed. The chain ends at the first UNSCANNED type: a
  # framework's own interface has no facts here, so the walk never sees what it extends,
  # and a catalog author must name the level a user actually writes. Transitivity still
  # earns its keep for a user-defined intermediate — jhipster's
  # `OperationRepositoryWithBagRelationships` is scanned and is reached through it.
  #
  # **Eight of the nine are unmeasured**, and that is stated rather than implied by the
  # count above: `JpaRepository` is the only one any of the three corpora reaches. The
  # other eight are the levels Spring Data's own documentation tells a user to extend, so
  # they are a considered guess at the shape rather than a measured one — a module using
  # `MongoRepository` would be the first to test it.
  - { supertype: [org.springframework.data.repository.Repository,
                  org.springframework.data.repository.CrudRepository,
                  org.springframework.data.repository.ListCrudRepository,
                  org.springframework.data.repository.PagingAndSortingRepository,
                  org.springframework.data.repository.ListPagingAndSortingRepository,
                  org.springframework.data.repository.reactive.ReactiveCrudRepository,
                  org.springframework.data.jpa.repository.JpaRepository,
                  org.springframework.data.mongodb.repository.MongoRepository,
                  org.springframework.data.elasticsearch.repository.ElasticsearchRepository],
      kind: persistence, target: database }
  # By SCANNED PACKAGE — an annotation names packages and every type inside them qualifies.
  #
  # `mall-admin`'s mappers carry NO annotation. `@MapperScan({"com.macro.mall.mapper",
  # "com.macro.mall.dao"})` on a config class is how MyBatis registers them, and that
  # annotation is in the fact stream with its package list — 199 terminals, 172 in
  # `mapper` and 27 in `dao`. Reading the
  # scan is reading the framework's own answer; matching `*Mapper` would be guessing at it,
  # and would also claim every unrelated type whose name happens to end that way.
  - { scanned_by: org.mybatis.spring.annotation.MapperScan, packages_from: value,
      kind: persistence, target: database }
  - { scanned_by: tk.mybatis.spring.annotation.MapperScan,  packages_from: value,
      kind: persistence, target: database }
