id: spring-pulsar
displayName: Spring for Apache Pulsar (PulsarListener)
style: annotation_driven
protocol: pulsar
direction: inbound

detect:
  coordinates: ["org.springframework.pulsar:spring-pulsar"]

requires: [annotation_args, typed_signatures]

matches:
  # No type-level gate: `@PulsarListener` sits on the method directly.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [org.springframework.pulsar.listener.Acknowledgement] }
  mapping:
    # CHECKPOINT FACT (javap, spring-pulsar 1.2.11): `@PulsarListener`
    # declares `topics()` as `String[]` and `topicPattern()` as a scalar
    # `String` — the `@KafkaListener` shape exactly. The two alias one
    # another (a listener declares only one), so first present wins.
    path_from: [topics, topicPattern]
    # NO class-level listener shape for Pulsar: `@PulsarListener` is
    # `@Target({TYPE, METHOD, ANNOTATION_TYPE})`, but the jar declares no
    # `@PulsarHandler` counterpart at all — there is no annotation a
    # class-level listener would dispatch to, so there is no prefix to
    # declare. A TYPE-level use derives nothing (the derivation joins method
    # symbols only). That stops being true the day the framework ships a
    # handler annotation for the class-level form.
    prefix_from: []
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    prefix_annotation: null
    annotations:
      - { fqn: org.springframework.pulsar.annotation.PulsarListener }

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order.
#
# No broker envelope is added here: `@PulsarListener`'s own envelope
# parameter type is `org.apache.pulsar.client.api.Message<T>`, which lives in
# the Pulsar client jar rather than in this catalog's own dependency, and no
# fixture reaches it — an entry declared for a type nothing here has seen
# would be a rule about a shape nobody measured.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
