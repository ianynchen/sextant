id: jakarta-websocket
displayName: Jakarta WebSocket (annotated endpoints)
style: annotation_driven
protocol: websocket
direction: inbound

detect:
  coordinates: ["jakarta.websocket:jakarta.websocket-api", "javax.websocket:javax.websocket-api"]

measured:
  - { artifact: jakarta.websocket:jakarta.websocket-api, versions: ["2.2.0"],
      identity: reported, by: scripts/probes/cp11_sweep_round1.md }
  - { artifact: jakarta.websocket:jakarta.websocket-client-api, versions: ["2.2.0"],
      identity: reported, by: scripts/probes/cp11_sweep_round1.md }

requires: [annotation_args, typed_signatures]

matches:
  # THE TYPE GATE (`A-C1`). `@ServerEndpoint` plays both roles — the marker AND
  # the path prefix — and until this key it played only the second, on the
  # spring-jms.yml/spring-kafka.yml precedent that a prefix annotation gates by
  # side effect. It does not. `derive_endpoints.sql:725` is a no-op for a
  # catalog declaring no `$type_annotation`, so a lone `@OnMessage` minted a
  # declaration and the absent prefix composed as the empty address.
  #
  # MEASURED (CP-11 Q3, jakarta.websocket-api / -client-api 2.2.0):
  # `@OnMessage` is `@Target(METHOD)`, declares one attribute
  # (`maxMessageSize`), carries no address, and ships in the CLIENT api jar —
  # it is the message callback for a `@ClientEndpoint` class exactly as much as
  # for a `@ServerEndpoint` one. `@ClientEndpoint` and `@ServerEndpoint` are
  # both `@Target(TYPE)`, and only the second makes a class SERVED. So a
  # `@ClientEndpoint` class with an `@OnMessage` handler — a class that dials
  # OUT — was published as an INBOUND WebSocket endpoint: direction inverted
  # and address invented in one row. `docs/COVERAGE.md:1211-1216` names exactly
  # this failure mode as the reason the `javax` spelling is left
  # detection-only; the same hazard was live on the `jakarta` path and stated
  # nowhere.
  #
  # Naming the same annotation here and as `prefix_annotation` below is the
  # spring-cloud-openfeign shape, not a new one: the two CTEs join it on
  # different roles.
  type_annotation: [jakarta.websocket.server.ServerEndpoint,
                    javax.websocket.server.ServerEndpoint]
  #
  # Deliberately NO `request_body` block (unlike every other catalog here):
  # checkpoint answer 5 (Phase 2H Task 2) rules that a WebSocket frame is
  # untyped by definition — `@OnMessage`'s own parameter (`onFrame(String
  # frame)`) is an opaque frame, never a declared contract, and there is no
  # `@Payload`-shaped marker this protocol offers to tell a real payload
  # parameter apart from the frame itself. Omitting the block (rather than
  # writing one that would still capture `String`) is what keeps
  # `request_shape` NULL regardless of the frame parameter's own type
  # (`shapes/contracts.py::_body_parameter`: "A catalog declaring neither
  # contributes no request shapes").
  mapping:
    # CHECKPOINT FACT (Phase 2H Task 2, checkpoint answer 5): `@OnMessage`
    # carries NO attribute at all in bytecode — a bare `#…()` entry, zero
    # element-value pairs. `value` is never present, so every `@OnMessage`
    # method's own path suffix reads as '' — the same `@KafkaHandler`
    # precedent (`path_from: [topics, topicPattern]` on a row that carries
    # neither); naming an attribute here that is never populated is what
    # keeps the suffix empty rather than the whole row silently absent.
    path_from: [value]
    # `@ServerEndpoint`'s own `value` is a SCALAR string in bytecode
    # (checkpoint answer 5) — `#…(#value=s#"/live")`, not a `String[]` like
    # every Spring mapping annotation — but the same scalar-or-array read
    # (`path_from`/`prefix_from` share one) already handles a scalar with no
    # new vocabulary.
    prefix_from: [value]
    # `@ServerEndpoint("/live")`'s value is a URI path, so its seam joins with
    # `/` like every other path-addressed catalog here. Inert in practice
    # rather than dormant-and-wrong: `@OnMessage` carries no attribute at all
    # (above), so the suffix is always '' and an empty half takes no separator
    # with it — the prefix reaches `path` exactly as written either way.
    path_separator: "/"
    # Neither generation's annotations declare a `method` attribute; the name
    # is borrowed and never populated (spring-jms.yml/spring-kafka.yml
    # precedent), which is what keeps every row verbless below.
    method_from: method
    # Verbless (D02 §2, amended): a WebSocket frame handler declares no
    # HTTP-style verb.
    all_methods: []
    prefix_annotation: [jakarta.websocket.server.ServerEndpoint,
                        javax.websocket.server.ServerEndpoint]
    annotations:
      - { fqn: jakarta.websocket.OnMessage }
      - { fqn: javax.websocket.OnMessage }

# BOTH SPELLINGS (W12, second pass). `javax.websocket.server.ServerEndpoint` and
# `javax.websocket.OnMessage` are the pre-Jakarta-EE-9 spelling of the exact same
# annotations — a package rename and nothing else. Measured rather than assumed
# (`scripts/probes/w11_javax_jakarta.md`): at javax.websocket-api 1.1 against
# jakarta.websocket-api 2.2.0 and jakarta.websocket-client-api 2.2.0, both
# `ServerEndpoint`s declare the same five attributes (`value`, `subprotocols`,
# `decoders`, `encoders`, `configurator`) and target `TYPE`; both `OnMessage`s
# declare `maxMessageSize` and target `METHOD`. Nothing needed re-measuring beyond
# the names, so unlike `javax-jms.yml` this is two names rather than a twin file.
#
# THE COMMENT THAT STOOD HERE was a boundary that had stopped being one.
# It said `mapping.prefix_annotation` "is SINGLE-valued (`annotation_driven.py::
# run` reads it as one fqn, never a list) and this task's own acceptance rule
# refuses an engine change that would widen it". W9 widened it, along with
# `matches.type_annotation` — both are in D02's list of widened keys — so the
# stated blocker was gone and the gap stayed open for want of anyone re-reading
# the reason.
#
# It was also invisible to W11's own sweep, which is the more useful half of the
# lesson. That sweep read raw catalog TEXT, so the `javax` names written in this
# very comment counted as "named" and it reported websocket as carrying both
# spellings — while `docs/COVERAGE.md` said "javax.websocket is detection-only".
# A sweep that reads prose reports a gap as closed because somebody wrote about
# it. It parses the YAML and looks at rule-bearing VALUES now, and
# `detect.coordinates` — which still names the javax artifact, and which made a
# javax-only module recognisable as WebSocket-shaped while nothing matched inside
# it — is counted as detection rather than as a rule.
#
# The gate still names `@ServerEndpoint` in every spelling it lists and never
# `@OnMessage` or `@ClientEndpoint` — `tests/architecture/
# test_sweep_round1_framework_rules.py` asserts that of EVERY element now, not
# only of a scalar, because a list whose second element was `@OnMessage` would
# have slipped past the assertion this widening replaced.

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
