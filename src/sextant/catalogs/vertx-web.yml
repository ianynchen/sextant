id: vertx-web
displayName: Vert.x Web (Router routes)
style: fluent
protocol: http
direction: inbound

# A Vert.x route is a chain on a `Router` (spec 2026-10-30 §3a): a root that may name a
# verb and a path (`router.get("/orders")`), steps on the `Route` it returns that refine
# it (`method`, `path`, `produces`), and a handler that registers it. This is the shape
# `vertx-eventbus-chain.yml` ships for the event bus, read by the same engine. Not
# `combinator`: a router is not one tree of calls, each route is its own statement on a
# shared `Router` object.
#
# What javac writes, measured (CP-56 row group (h), rows 304-316,
# `scripts/probes/cp56_vertx_web.md`): every call is `invokeinterface` on the interface
# (`Router`, `Route`), left to right on one operand stack, so `router.get("/x").handler(h)`
# is a root whose result is the receiver of the step. A method reference `this::h` is a
# `lambda` argument naming `h` itself (row 304); a lambda names its synthetic body
# (rows 305-308). The statement style, `Route r = router.route(p); r.method(GET);
# r.handler(h);`, calls each later method on the local and pops the result (row 309):
# every self-returning call is flagged `returns_receiver` below, so those statements are
# one chain and not a fork per call.

detect:
  coordinates: ["io.vertx:vertx-web"]

# Three lines, each as its jars' own manifests state it (CP-56's version scope). Every
# core descriptor below is the same in all three (row group (a)). The RxJava 3 wrappers ship
# in `vertx-rx-java3` at the same three versions, and the Mutiny wrappers in
# `smallrye-mutiny-vertx-web` at 3.23.1 (over Vert.x 4.5) and 4.0.2 (over Vert.x 5): their
# owners are cited in row group (g), and the few methods that group does not list are the
# ones `javap` measured, named in the comments where they appear.
measured:
  - { artifact: io.vertx:vertx-web, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.vertx:vertx-core, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.vertx:vertx-rx-java3, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.smallrye.reactive:smallrye-mutiny-vertx-web, versions: ["3.23.1", "4.0.2"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }

requires: [call_site, string_constants, chain_reconstruction]

matches:
  # A ROUTE WITH NO VERB SERVES EVERY VERB (row 114: `RouteState.matches` skips the method
  # test when the route's method set is empty). One row, method NULL, marked as serving any
  # method — never a fan-out to a list: `HttpMethod` is a class with 31 constants at 4.5.10
  # and 5.0.0, 32 at 5.2.1, plus `valueOf` for any other token (row 133), so the set is
  # open.
  verbless_serves: any
  # A ROUTE WITH NO PATH SERVES EVERY PATH (rows 113, 117: `route()` stores no path and no
  # pattern, and `matches` then skips the path test). Published as `/*`, Vert.x's own
  # spelling of "every path".
  pathless_serves: "/*"
  # A PATH VERT.X REFUSES IS NOT REPAIRED (row 118): `RouteImpl.checkPath` throws
  # `IllegalArgumentException("Path must start with /")` for an empty path or one whose
  # first character is not `/`, from `route(String)`, `route(HttpMethod, String)`, every
  # verb's `x(String)` and `path(String)` (row 121). The regex forms do not call it, so a
  # pattern is never refused.
  refuses_unrooted_path: true
  # The verb a `getstatic HttpMethod.X` names (row 133). `VERSION_CONTROL` and
  # `BASELINE_CONTROL` are not listed: their wire spelling is not the field's name and was
  # not measured, so a route given one reads its verb as unread rather than as a guess.
  # `QUERY` is 5.2.1 only.
  verb_values:
    fields:
      "io.vertx.core.http.HttpMethod#OPTIONS": OPTIONS
      "io.vertx.core.http.HttpMethod#GET": GET
      "io.vertx.core.http.HttpMethod#HEAD": HEAD
      "io.vertx.core.http.HttpMethod#POST": POST
      "io.vertx.core.http.HttpMethod#PUT": PUT
      "io.vertx.core.http.HttpMethod#DELETE": DELETE
      "io.vertx.core.http.HttpMethod#TRACE": TRACE
      "io.vertx.core.http.HttpMethod#CONNECT": CONNECT
      "io.vertx.core.http.HttpMethod#PATCH": PATCH
      "io.vertx.core.http.HttpMethod#QUERY": QUERY
      "io.vertx.core.http.HttpMethod#PROPFIND": PROPFIND
      "io.vertx.core.http.HttpMethod#PROPPATCH": PROPPATCH
      "io.vertx.core.http.HttpMethod#MKCOL": MKCOL
      "io.vertx.core.http.HttpMethod#COPY": COPY
      "io.vertx.core.http.HttpMethod#MOVE": MOVE
      "io.vertx.core.http.HttpMethod#LOCK": LOCK
      "io.vertx.core.http.HttpMethod#UNLOCK": UNLOCK
      "io.vertx.core.http.HttpMethod#MKCALENDAR": MKCALENDAR
      "io.vertx.core.http.HttpMethod#REPORT": REPORT
      "io.vertx.core.http.HttpMethod#CHECKOUT": CHECKOUT
      "io.vertx.core.http.HttpMethod#CHECKIN": CHECKIN
      "io.vertx.core.http.HttpMethod#UNCHECKOUT": UNCHECKOUT
      "io.vertx.core.http.HttpMethod#MKWORKSPACE": MKWORKSPACE
      "io.vertx.core.http.HttpMethod#UPDATE": UPDATE
      "io.vertx.core.http.HttpMethod#LABEL": LABEL
      "io.vertx.core.http.HttpMethod#MERGE": MERGE
      "io.vertx.core.http.HttpMethod#MKACTIVITY": MKACTIVITY
      "io.vertx.core.http.HttpMethod#ORDERPATCH": ORDERPATCH
      "io.vertx.core.http.HttpMethod#ACL": ACL
      "io.vertx.core.http.HttpMethod#SEARCH": SEARCH

  # THE ROOTS, every `Router` method that makes a route (rows 2-22), each by its erased
  # descriptor: `get()` and `get(String)` are one name at two arities. The argument-less
  # forms are roots too, so a later `path(…)` or `method(…)` supplies what they lack. A
  # regex root's path is a PATTERN (`url_is: pattern`): published verbatim, never given a
  # leading `/`, never linked by path (spec §3a).
  #
  # Not here: `Router.router(Vertx)` and `new RouterImpl(vertx)` make the router, not a
  # route (rows 1, 314), and `mountSubRouter` (4.5 only, row 4) mounts one (`mount` below).
  roots:
    - { owner: &routers [io.vertx.ext.web.Router, io.vertx.rxjava3.ext.web.Router, io.vertx.mutiny.ext.web.Router], method: route, descriptor: "()Lio/vertx/ext/web/Route;" }
    - { owner: *routers, method: route, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { url: arg0 } }
    - { owner: *routers, method: route, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: arg0, url: arg1 } }
    - { owner: *routers, method: routeWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { url: arg0, url_is: pattern } }
    - { owner: *routers, method: routeWithRegex, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: arg0, url: arg1, url_is: pattern } }
    - { owner: *routers, method: get, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: GET } }
    - { owner: *routers, method: get, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: GET, url: arg0 } }
    - { owner: *routers, method: getWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: GET, url: arg0, url_is: pattern } }
    - { owner: *routers, method: post, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: POST } }
    - { owner: *routers, method: post, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: POST, url: arg0 } }
    - { owner: *routers, method: postWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: POST, url: arg0, url_is: pattern } }
    - { owner: *routers, method: put, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: PUT } }
    - { owner: *routers, method: put, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: PUT, url: arg0 } }
    - { owner: *routers, method: putWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: PUT, url: arg0, url_is: pattern } }
    - { owner: *routers, method: delete, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: DELETE } }
    - { owner: *routers, method: delete, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: DELETE, url: arg0 } }
    - { owner: *routers, method: deleteWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: DELETE, url: arg0, url_is: pattern } }
    - { owner: *routers, method: patch, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: PATCH } }
    - { owner: *routers, method: patch, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: PATCH, url: arg0 } }
    - { owner: *routers, method: patchWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: PATCH, url: arg0, url_is: pattern } }
    - { owner: *routers, method: head, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: HEAD } }
    - { owner: *routers, method: head, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: HEAD, url: arg0 } }
    - { owner: *routers, method: headWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: HEAD, url: arg0, url_is: pattern } }
    - { owner: *routers, method: options, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: OPTIONS } }
    - { owner: *routers, method: options, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: OPTIONS, url: arg0 } }
    - { owner: *routers, method: optionsWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: OPTIONS, url: arg0, url_is: pattern } }
    - { owner: *routers, method: trace, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: TRACE } }
    - { owner: *routers, method: trace, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: TRACE, url: arg0 } }
    - { owner: *routers, method: traceWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: TRACE, url: arg0, url_is: pattern } }
    - { owner: *routers, method: connect, descriptor: "()Lio/vertx/ext/web/Route;", captures: { http_method: CONNECT } }
    - { owner: *routers, method: connect, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: CONNECT, url: arg0 } }
    - { owner: *routers, method: connectWithRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { http_method: CONNECT, url: arg0, url_is: pattern } }

  # THE STEPS: every method `Route` declares to return `Route` (row 110, the interface a
  # caller names, row group (b)): 20 abstract at all three versions, which `RouteImpl`
  # answers with `this` for every one, plus the defaults `respond(Function)` and, at 4.5.10
  # only, `useNormalisedPath(boolean)`, each answering a self-returning call. Every one is
  # `returns_receiver: true`, so a statement-style route stays one chain; the ones that
  # carry nothing a row reads are capture-less. Owner-gated, because a call on another
  # type sharing a name (`MessageConsumer.handler`) is not this chain's.
  steps:
    # `method` ADDS a verb (`RouteImpl` keeps a set): `.method(GET).method(DELETE)` is two
    # rows, one per verb, and a verb root's own verb stays in the set.
    - { owner: &routes [io.vertx.ext.web.Route, io.vertx.rxjava3.ext.web.Route, io.vertx.mutiny.ext.web.Route], method: method, descriptor: "(Lio/vertx/core/http/HttpMethod;)Lio/vertx/ext/web/Route;",
        captures: { http_method: arg0 }, repeats: [http_method], returns_receiver: true }
    # `path` sets the path (and is refused as the roots are, row 121); `pathRegex` sets it
    # as a pattern, which `checkPath` never sees. Each says which, so the last call wins.
    - { owner: *routes, method: path, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { url: arg0, url_is: address }, returns_receiver: true }
    - { owner: *routes, method: pathRegex, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { url: arg0, url_is: pattern }, returns_receiver: true }
    # Each call adds one media type, as the route's own `produces`/`consumes` lists do.
    - { owner: *routes, method: produces, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { produces: arg0 }, repeats: [produces], returns_receiver: true }
    - { owner: *routes, method: consumes, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        captures: { consumes: arg0 }, repeats: [consumes], returns_receiver: true }
    # `virtualHost` restricts which `Host` the route serves: a requirement on the row, an
    # `endpoint_metadata` entry of kind `host`, named for the header it matches (a literal
    # `name`) and valued with the host pattern the call names.
    - { owner: *routes, method: virtualHost, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;",
        collects: { kind: host, name: Host, value: arg0 }, returns_receiver: true }
    # A disabled route serves nothing until it is enabled again, last call wins; a removed
    # route leaves the router, and `enable()` after it restores nothing (`poisons` holds to
    # the chain's end).
    - { owner: *routes, method: disable, descriptor: "()Lio/vertx/ext/web/Route;",
        captures: { serves: false }, returns_receiver: true }
    - { owner: *routes, method: enable, descriptor: "()Lio/vertx/ext/web/Route;",
        captures: { serves: true }, returns_receiver: true }
    - { owner: *routes, method: remove, descriptor: "()Lio/vertx/ext/web/Route;",
        poisons: [serves], returns_receiver: true }
    # THE REGISTRATION STEPS, named again in `terminal` below: a route serves once it is
    # given a handler. Every handler is kept, in call order (`.handler(auth).handler(h)` is
    # two handlers on one route), and the row names the one that answers (`passes_on`
    # below). `blockingHandler` has two overloads, both with the handler at argument 0.
    - { owner: &route_handler_owners [io.vertx.ext.web.Route, io.vertx.rxjava3.ext.web.Route], method: handler, descriptor: "(Lio/vertx/core/Handler;)Lio/vertx/ext/web/Route;",
        captures: { handler: arg0 }, repeats: [handler], returns_receiver: true }
    # Mutiny's `handler` takes a `java.util.function.Consumer`, not a `Handler` (row 246),
    # and Vert.x calls its `accept`. A lambda or method reference names the method that runs
    # (row 304), so it reads as it does for a `Handler`; an object implementing `Consumer` is
    # a stated boundary (below).
    - { owner: io.vertx.mutiny.ext.web.Route, method: handler, descriptor: "(Ljava/util/function/Consumer;)Lio/vertx/mutiny/ext/web/Route;",
        captures: { handler: arg0 }, repeats: [handler], returns_receiver: true }
    - { owner: *routes, method: blockingHandler,
        captures: { handler: arg0 }, repeats: [handler], returns_receiver: true }
    - { owner: *routes, method: respond, descriptor: "(Ljava/util/function/Function;)Lio/vertx/ext/web/Route;",
        captures: { handler: arg0 }, repeats: [handler], returns_receiver: true }
    # `order(int)` and `last()` decide which of several routes on one verb and path is tried
    # first (spec §3b): Vert.x sorts its routes by order, a route's own order being the
    # router's count when it was made (row 116: `incrementOrderSequence` in every root) until
    # `order(int)` sets one. `last()` calls a self-returning method of its own class (row
    # 101), `order(Integer.MAX_VALUE)`, so the later of the two calls wins.
    - { owner: *routes, method: order, descriptor: "(I)Lio/vertx/ext/web/Route;",
        captures: { order: arg0 }, returns_receiver: true }
    - { owner: *routes, method: last, descriptor: "()Lio/vertx/ext/web/Route;",
        captures: { order: last }, returns_receiver: true }
    # Self-returning and carrying nothing a row reads: `subRouter` mounts a router (a
    # terminal, and `mount` below), and `failureHandler` answers only a failed request, so it
    # registers no route of its own.
    - { owner: io.vertx.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/ext/web/Router;)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: io.vertx.rxjava3.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/rxjava3/ext/web/Router;)Lio/vertx/rxjava3/ext/web/Route;", returns_receiver: true }
    - { owner: io.vertx.mutiny.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/mutiny/ext/web/Router;)Lio/vertx/mutiny/ext/web/Route;", returns_receiver: true }
    - { owner: *route_handler_owners, method: failureHandler, descriptor: "(Lio/vertx/core/Handler;)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: io.vertx.mutiny.ext.web.Route, method: failureHandler, descriptor: "(Ljava/util/function/Consumer;)Lio/vertx/mutiny/ext/web/Route;", returns_receiver: true }
    - { owner: *routes, method: setName, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: *routes, method: useNormalizedPath, descriptor: "(Z)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: *routes, method: useNormalisedPath, descriptor: "(Z)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: *routes, method: putMetadata, descriptor: "(Ljava/lang/String;Ljava/lang/Object;)Lio/vertx/ext/web/Route;", returns_receiver: true }
    - { owner: *routes, method: setRegexGroupsNames, descriptor: "(Ljava/util/List;)Lio/vertx/ext/web/Route;", returns_receiver: true }
    # The `Router` methods that return the router they are called on: no route chain passes
    # through them, and they are steps only so the mount join below reads `router.errorHandler(
    # 500, h)` as that same router, never as a router of its own. Measured with `javap` on
    # vertx-web 4.5.10, 5.0.0 and 5.2.1 (CP-56 lists `Route`'s, not `Router`'s): every
    # `RouterImpl` body of these ends `aload_0; areturn`. `uncaughtErrorHandler` is 5.2.1's
    # (absent at 4.5.10 and 5.0.0). The wrappers' are measured the same way, `javap` on
    # vertx-rx-java3 4.5.10, 5.0.0 and 5.2.1 and smallrye-mutiny-vertx-web 3.23.1 and 4.0.2
    # (CP-56 lists neither wrapper's `Router` self-returning methods): every one ends
    # `aload_0; areturn`, Mutiny 3.23.1's `Consumer` forms through the private `__errorHandler`
    # and `__modifiedHandler` twins, which do. Mutiny's take a `Consumer` where the core's and
    # RxJava 3's take a `Handler`.
    - { owner: *routers, method: putMetadata, descriptor: "(Ljava/lang/String;Ljava/lang/Object;)Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: *routers, method: clear, descriptor: "()Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: [io.vertx.ext.web.Router, io.vertx.rxjava3.ext.web.Router], method: errorHandler, descriptor: "(ILio/vertx/core/Handler;)Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: [io.vertx.ext.web.Router, io.vertx.rxjava3.ext.web.Router], method: uncaughtErrorHandler, descriptor: "(Lio/vertx/core/Handler;)Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: [io.vertx.ext.web.Router, io.vertx.rxjava3.ext.web.Router], method: modifiedHandler, descriptor: "(Lio/vertx/core/Handler;)Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: *routers, method: allowForward, descriptor: "(Lio/vertx/ext/web/AllowForwardHeaders;)Lio/vertx/ext/web/Router;", returns_receiver: true }
    - { owner: io.vertx.mutiny.ext.web.Router, method: errorHandler, descriptor: "(ILjava/util/function/Consumer;)Lio/vertx/mutiny/ext/web/Router;", returns_receiver: true }
    - { owner: io.vertx.mutiny.ext.web.Router, method: uncaughtErrorHandler, descriptor: "(Ljava/util/function/Consumer;)Lio/vertx/mutiny/ext/web/Router;", returns_receiver: true }
    - { owner: io.vertx.mutiny.ext.web.Router, method: modifiedHandler, descriptor: "(Ljava/util/function/Consumer;)Lio/vertx/mutiny/ext/web/Router;", returns_receiver: true }
  # A route given no handler serves nothing and derives nothing: a route built and configured
  # but never handed one. `subRouter` ends a chain too, so the mount below reads the path of
  # the route it is called on; a mount's chain derives no row of its own.
  terminal: [handler, blockingHandler, respond, subRouter]

  # SUB-ROUTERS (spec §3c). `parent.route("/api/*").subRouter(sub)` (row 38, all three
  # versions) and 4.5's `parent.mountSubRouter("/api", sub)` (row 4; row 122: it builds
  # `route(mountPoint + "*")` and calls `subRouter`) serve every route registered on `sub`
  # under `/api`. A router is the OBJECT a producer made, reached along one call path: a route
  # takes the prefix of the mount that received the same router on the same path, its routes
  # and the mount in any methods. The producers are every call returning a `router_type`
  # whose body the module does not read (`Router.router(vertx)`, row 1) and every constructor
  # of a class implementing one (`new RouterImpl(vertx)`, row 314), derived from the facts.
  # The prefix is the mount path less its trailing `*` and the `/` before it: `/api/*`,
  # `/api*` and `"/" + name + "*"` mount at `/api` or `/<name>`. Every path Vert.x accepts
  # starts with `/` (row 118), so the join is `leading_slash`, as Ktor's and Javalin's.
  #
  # A MOUNT VERT.X REFUSES serves nothing through it, not even at the root, and is recorded
  # (rows 119-120): `subRouter` on a route whose path is exact (no trailing `*`, including a
  # path whose last piece is read and is not `*`) or a regular expression throws
  # `IllegalStateException`; 4.5's `mountSubRouter` given a mount point ending in `*` throws
  # `IllegalArgumentException`. Vert.x throws at the mount call, so a route reached only
  # through such a mount has no row; one also served another way keeps that row.
  # `route().subRouter(sub)`, with no path, mounts at the root.
  #
  # THE WRAPPERS' MOUNTS are their own rules, since the router they take is the wrapper's
  # own type (rows 171, 250, 137, 216). The wrapper `Router`s are router types too, so a
  # router built by `io.vertx.rxjava3.ext.web.Router.router(vertx)` is found as the core's
  # is. RxJava 3 and Mutiny mount at 4.5 only through `mountSubRouter` (4.5.10 and Mutiny
  # 3.23.1: rows 137, 216), as the core does.
  router_type: [io.vertx.ext.web.Router, io.vertx.rxjava3.ext.web.Router, io.vertx.mutiny.ext.web.Router]
  mount:
    - { owner: io.vertx.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/ext/web/Router;)Lio/vertx/ext/web/Route;",
        router_arg: 0, prefix_from: receiver_path, wildcard: "*", refuses: [exact, pattern] }
    - { owner: io.vertx.ext.web.Router, method: mountSubRouter, descriptor: "(Ljava/lang/String;Lio/vertx/ext/web/Router;)Lio/vertx/ext/web/Route;",
        router_arg: 1, prefix_arg: 0, wildcard: "*", refuses: [wildcard] }
    - { owner: io.vertx.rxjava3.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/rxjava3/ext/web/Router;)Lio/vertx/rxjava3/ext/web/Route;",
        router_arg: 0, prefix_from: receiver_path, wildcard: "*", refuses: [exact, pattern] }
    - { owner: io.vertx.rxjava3.ext.web.Router, method: mountSubRouter, descriptor: "(Ljava/lang/String;Lio/vertx/rxjava3/ext/web/Router;)Lio/vertx/rxjava3/ext/web/Route;",
        router_arg: 1, prefix_arg: 0, wildcard: "*", refuses: [wildcard] }
    - { owner: io.vertx.mutiny.ext.web.Route, method: subRouter, descriptor: "(Lio/vertx/mutiny/ext/web/Router;)Lio/vertx/mutiny/ext/web/Route;",
        router_arg: 0, prefix_from: receiver_path, wildcard: "*", refuses: [exact, pattern] }
    - { owner: io.vertx.mutiny.ext.web.Router, method: mountSubRouter, descriptor: "(Ljava/lang/String;Lio/vertx/mutiny/ext/web/Router;)Lio/vertx/mutiny/ext/web/Route;",
        router_arg: 1, prefix_arg: 0, wildcard: "*", refuses: [wildcard] }
  path_join: leading_slash

  # WHICH HANDLER ANSWERS (spec §3b). Vert.x calls a route's handlers in order, then the next
  # matching route's, for as long as each calls `next()` on the `RoutingContext` it was
  # handed: a handler that does is middleware, and the row names the first that does not. A
  # chain whose every handler passes on is no row (`router.route().handler(BodyHandler.
  # create())`).
  # Each wrapper's `RoutingContext.next()` is `()V` on the wrapper's own type (rows 292-294),
  # so a handler written against the wrapper passes on through its own entry.
  passes_on:
    - { owner: io.vertx.ext.web.RoutingContext, method: next }
    - { owner: io.vertx.rxjava3.ext.web.RoutingContext, method: next }
    - { owner: io.vertx.mutiny.ext.web.RoutingContext, method: next }
  # The framework's own handlers (`BodyHandler`, `CorsHandler`, `AuthenticationHandler`, …)
  # carry the request on or fail it, by Vert.x's contract, so a handler object of this
  # package or its subpackages passes on without its body being read. NOT every one does:
  # `StaticHandler`, `TemplateHandler` and the `graphql` and `sockjs` subpackages answer the
  # request themselves, and a route served only by one of them derives no row — a stated
  # boundary (spec §4), not a claim that nothing serves it. A handler of another type the
  # module does not build is not readable here. The wrappers have the same package under
  # their own roots: `BodyHandler`, `CorsHandler` and `StaticHandler` are classes there in
  # vertx-rx-java3 (4.5.10, 5.2.1) and smallrye-mutiny-vertx-web (3.23.1, 4.0.2), each
  # implementing `Handler` (Mutiny's also `Consumer`, `javap`), the same two answering
  # packages among them.
  framework_handlers: [io.vertx.ext.web.handler, io.vertx.rxjava3.ext.web.handler, io.vertx.mutiny.ext.web.handler]
  # What Vert.x calls on a handler OBJECT (`Handler<RoutingContext>.handle`): a route given
  # `new X(…)` runs `X.handle` (user ruling 2026-10-30). This is one list for the catalog, not
  # one per owner, and Mutiny's `Route.handler` takes a `Consumer`, which Vert.x calls
  # `accept` on: a Mutiny handler that is a lambda or a method reference is read (it names the
  # method that runs), the framework's own handler objects pass on, and a Mutiny handler that
  # is an OBJECT of the module's own class is not read, `partial` with a pass-through
  # question (stated below). `accept` is not added to this list: it would make a class that
  # implements `Handler` and also has an unrelated `accept` method answer for both.
  handler_methods: [handle]

  # HANDLER-BODY READS (spec §3a), the mechanism `javalin.yml` ships: what the handler body
  # reads off its `RoutingContext`, one `endpoint_metadata` row per read, matched against
  # the body's own call sites. `queryParam(String)` reads the query string;
  # `request().getHeader(String)` a header, matched through the `request()` call that
  # produced its receiver. `pathParam(String)` is not here: a path parameter is part of the
  # address, as in Javalin, and once the route's own `:name`s are set aside every other name
  # it reads is a mount prefix's variable, a regex group or nothing, never a requirement. Each hands back null when the value is absent: `requirement`
  # NULL, the handler reads it and Vert.x decides nothing. The handler body only: a
  # context handed to a helper is not followed here.
  request_reads:
    - { owner: io.vertx.ext.web.RoutingContext, method: queryParam, arity: 1, name_arg: 0, kind: query }
    - { via: { owner: io.vertx.ext.web.RoutingContext, method: request }, method: getHeader, arity: 1, name_arg: 0,
        kind: header }

# BOUNDARIES, stated rather than discovered:
#   * WHICH HANDLER ANSWERS, where the module cannot read it: a handler that hands its
#     context to a method of another jar (Hono's `HttpUtils.nextRoute`), or is an object
#     another jar builds, gives its row at `partial`, with a `handler_pass_through` question
#     naming that method. A handler that calls `next()` on one branch is middleware.
#   * A CONTEXT STORED WHERE THE WALK CANNOT FOLLOW IT: written to a field, or handed to a
#     constructor (an anonymous class's synthetic capture field). A `next()` on it later is on
#     a `getfield` the facts do not name, so the handler is not readable here: `partial`, with
#     the field or constructor named in its `handler_pass_through` question.
#   * A ROUTER MOUNTED OUTSIDE THIS MODULE. A router this module does not build (Quarkus's
#     `@Observes Router`, one handed in from another module) is published at its root,
#     `resolved`: it may be mounted under a prefix this module cannot see, and Quarkus's
#     `quarkus.http.root-path` is not applied. A mount whose path is not read whole puts the
#     named hole `<prefix>` in front of the route's path, `partial`, never linked by path.
#   * THE RXJAVA 3 AND MUTINY WRAPPERS (`io.vertx.rxjava3.ext.web.*`,
#     `io.vertx.mutiny.ext.web.*`, row group (g)) are owners of every root, step, mount and
#     `next()` above, with their own descriptors. What is NOT read through them:
#       - a Mutiny handler that is an object of the module's own class implementing
#         `Consumer`: Vert.x calls its `accept`, and `handler_methods` is `handle` for the
#         whole catalog. The row is `partial` with a `handler_pass_through` question naming
#         the type, never a guess;
#       - the handler-body reads (`request_reads`): the wrappers' `RoutingContext.queryParam`
#         and `request().getHeader` are not in CP-56, so no requirement is derived from a
#         wrapper handler's body.
#   * VERT.X 3.x, unmeasured and unmatched by every descriptor above.
