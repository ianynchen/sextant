id: kafka-consumer
displayName: Apache Kafka (raw KafkaConsumer)
style: single_call
protocol: kafka
direction: inbound

# Its own detect coordinate is the SAME artifact `kafka-clients.yml` (the raw
# producer's own file) already names — `kafka-clients` ships both
# `KafkaProducer` and `KafkaConsumer`, so any module pulling one in pulls the
# other's own class too. This is its own file because the OWNER differs
# (`KafkaConsumer`, not `KafkaProducer`) and the direction differs
# (inbound), never because the dependency does.
detect:
  coordinates: ["org.apache.kafka:kafka-clients"]

measured:
  - { artifact: org.apache.kafka:kafka-clients, versions: ["3.6.2"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }

requires: [call_site, string_constants]

matches:
  owner: org.apache.kafka.clients.consumer.KafkaConsumer
  # CHECKPOINT FACT (real javap descriptors, kafka-clients 3.6.2):
  # `subscribe(Collection<String>)` and `subscribe(Pattern)` are BOTH arity
  # 1, indistinguishable by name+arity alone. They are now TWO rows, one per
  # overload, each declaring its own erased JVM `descriptor` (descriptor sweep
  # R3) — because Java identifies a method by name and parameter types in
  # order, never by argument count (GUIDELINES §8.1's language rule), and one
  # row standing for two overloads is that rule's absence written down.
  #
  # THE `channel_via` LIST SPLITS WITH THEM, and that is the whole reason a
  # single descriptor would have been the wrong fix here: `List.of`,
  # `Arrays.asList` and `Collections.singletonList` produce a `Collection` and
  # belong to the first row; `Pattern.compile` produces a `Pattern` and belongs
  # to the second. One descriptor would have claimed arity 1 for one overload
  # and deleted half of this row's stated purpose. Both overloads carry the
  # destination at position 0, so nothing wrong was derivable before the split
  # either — this closes the shape, it does not fix a bug.
  #
  # A THIRD arity-1 `subscribe` would now derive nothing rather than being read
  # through whichever row it reached first; `javap -p -s KafkaConsumer`, and
  # re-running `scripts/probes/cp10_catalog_descriptors/run.sh`, is the check.
  #
  # THE TWO REBALANCE-LISTENER OVERLOADS ARE NOW DECLARED TOO (`A-M6`).
  # MEASURED at kafka-clients 3.6.2 (CP-12 Q7): `KafkaConsumer` declares five
  # methods that name what this consumer reads — `subscribe` in four forms and
  # `assign`. The note that stood here said the two arity-2 `subscribe`
  # overloads "remain undeclared, so they match no row at all — unchanged by
  # this", which was an accurate description of a silent drop rather than a
  # boundary: `consumer.subscribe(topics, rebalanceListener)` is the IDIOMATIC
  # consumer-group call, `_matching_method` filters on arity before descriptors
  # so it never reached the arity-1 rows, and it derived nothing while
  # `docs/COVERAGE.md` listed this catalog "✅ shipped" with no arity
  # qualification. Each arity-2 row carries the same `channel_arg`/`channel_via`
  # as its arity-1 twin, because the listener is a TRAILING argument and the
  # destination stays at position 0.
  #
  # `assign(Collection<TopicPartition>)` is the fifth and is DELIBERATELY
  # ABSENT, stated in COVERAGE §5.8 rather than left silent. Its argument is a
  # collection of `TopicPartition` OBJECTS, and the topic name is a constructor
  # argument INSIDE each one — two hops from the call site, where every
  # `channel_via` form above is one hop to a call returning the destination
  # itself. Declaring it with `channel_arg: 0` would read a `TopicPartition`
  # list as a destination; declaring it with no channel at all would derive a
  # path-less row. The first is a fabrication and the second is a choice worth
  # making deliberately rather than as a side effect of this fix, so neither is
  # taken here. It closes when `record_wrappers`' constructor-argument read —
  # which `kafka-clients.yml` already uses for `ProducerRecord` — can be
  # declared over a COLLECTION of records rather than one.
  #
  # `List.of` binds a FIXED-ARITY overload for up to 10 elements (checkpoint
  # ruling, also `linked_channels`'s own docstring): each element is its own
  # positional literal argument, never an array to unpack, so `all_strings`
  # reads one resolved row per topic — exactly what the fixture's own
  # two-topic call derives. `Arrays.asList` is declared here too, but review
  # round 1 disassembled a real probe: it is a genuine varargs call, one
  # single `anewarray` argument in bytecode, never several positional ones.
  # **Both spellings now resolve per topic**, and the two halves landed a task
  # apart: extractor capability 9.15 put the array's contents in that slot's
  # own `elements`, and 2O Task 13 taught `all_strings` to read them. Until
  # the second half, `Arrays.asList` derived the one trailing unresolved tuple
  # `linked_channels` documents for an unreadable destination — honest, and an
  # under-report of a topic list sitting in the facts. A varargs array the
  # extractor still cannot read end to end never reaches the `array` kind at
  # all, and degrades to that same one tuple. `singletonList` and
  # `Pattern.compile` each
  # take exactly one string argument, so `arg: 0` alone reads it — a topic
  # pattern lands on `path` verbatim, never expanded into real topic names,
  # the same rule `spring-kafka.yml`'s own `topicPattern` listener row
  # already keeps.
  methods:
    - name: subscribe
      arity: 1
      descriptor: "(Ljava/util/Collection;)V"
      channel_arg: 0
      channel_via:
        - { owner: java.util.List, method: of, arg: all_strings }
        - { owner: java.util.Arrays, method: asList, arg: all_strings }
        - { owner: java.util.Collections, method: singletonList, arg: 0 }
    - name: subscribe
      arity: 1
      descriptor: "(Ljava/util/regex/Pattern;)V"
      channel_arg: 0
      channel_via:
        - { owner: java.util.regex.Pattern, method: compile, arg: 0 }
    - name: subscribe
      arity: 2
      descriptor: "(Ljava/util/Collection;Lorg/apache/kafka/clients/consumer/ConsumerRebalanceListener;)V"
      channel_arg: 0
      channel_via:
        - { owner: java.util.List, method: of, arg: all_strings }
        - { owner: java.util.Arrays, method: asList, arg: all_strings }
        - { owner: java.util.Collections, method: singletonList, arg: 0 }
    - name: subscribe
      arity: 2
      descriptor: "(Ljava/util/regex/Pattern;Lorg/apache/kafka/clients/consumer/ConsumerRebalanceListener;)V"
      channel_arg: 0
      channel_via:
        - { owner: java.util.regex.Pattern, method: compile, arg: 0 }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale).
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
