id: spring-jms
displayName: Spring JMS (listeners)
style: annotation_driven
protocol: jms
direction: inbound

detect:
  coordinates: ["org.springframework:spring-jms"]

requires: [annotation_args, typed_signatures]

matches:
  # No type-level gate: `@JmsListener` sits on the method directly.
  # `jakarta.jms.Message` excluded alongside `Session`: unlike Kafka's
  # `ConsumerRecord<K, V>`, a raw `Message` parameter carries no
  # compile-time-typed payload this catalog's rules can pull a real
  # contract out of — leaving it eligible for `sole_unannotated` would
  # describe the opaque envelope itself as if it were the payload.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [jakarta.jms.Session, jakarta.jms.Message] }
  mapping:
    # CHECKPOINT FACT: `@JmsListener.destination` is genuinely scalar in
    # bytecode (unlike Kafka's `topics`).
    path_from: [destination]
    # No class-level listener shape for JMS (unlike Kafka's `@KafkaHandler`
    # polymorphism) — no prefix annotation to declare.
    prefix_from: []
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    prefix_annotation: null
    annotations:
      - { fqn: org.springframework.jms.annotation.JmsListener }

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order (Task 10
# fix round 1, finding 1). Endpoint-level ownership is a different question
# and is NOT this reason: `_owns` reads a row's own `catalog_id` (2E-prep
# design §1a), so a catalog's rules describe only the rows it derived
# itself.
# That finding was not hypothetical: it reproduced a `@NonNull` HTTP field
# silently reading as nullable once THIS file — sorted first among inbound
# catalogs — reached the same shared type with no nullability rules of its
# own. **Its nullability half is closed structurally** (D02 §1b): the rules
# are one declaration and no catalog holds a copy. It is quoted here because
# `wrappers` below is still a copy, and is still exposed to exactly the
# sort-order hazard it describes.
#
# No broker-specific wrapper is added here: unlike Kafka's `ConsumerRecord<K,
# V>`, a raw `jakarta.jms.Message` carries no compile-time-typed payload
# argument to unwrap to.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# CP-16 measured what this file's `CHECKPOINT FACT` comment above asserted
# without a version, and found it right: `@JmsListener` declares six attributes
# at 6.1.6 and 7.0.9, `destination()` is the only address among them, and it is
# genuinely scalar. The post-processor reads `destination`, `selector`,
# `subscription`, `concurrency`, `containerFactory` and `id` — there is no
# seventh source of a destination to have missed.
#
# It also measured the claim just above about there being no class-level shape:
# `@JmsListener` is `@Target({METHOD, ANNOTATION_TYPE})`, where `@KafkaListener`
# and `@RabbitListener` add `TYPE`. So `prefix_annotation: null` here is the
# framework's own rule rather than a simplification of it.
#
# ONE THING CP-16 FOUND THAT THIS FILE DOES NOT HANDLE, stated rather than
# encoded: `@JmsListener` is `@Repeatable(JmsListeners.class)` and the
# post-processor calls
# `AnnotatedElementUtils.getMergedRepeatableAnnotations(element, JmsListener,
# JmsListeners)`, naming both. Two listeners on one method are folded by javac
# into the container, and this catalog — which names no container, a key
# `annotation_driven` does not have — sees no annotation at all and drops BOTH
# destinations (`OI-36`).
measured:
  - { artifact: org.springframework:spring-jms, versions: ["6.1.6", "7.0.9"],
      identity: reported, by: scripts/probes/cp16_listener_destinations.md }
