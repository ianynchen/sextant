        nesting a builder; `invoke` is the `"/x" { handler }` route form for the same
        reason; `add` and `resource` attach or declare routes too — the receiver-rooted
        shape `G-37` names, engine work rather than a catalog line, and routes written any
        of those ways derive NOTHING. `and`/`or`/`not` compose predicates INSIDE the DSL,
        three overloads each for `and`/`or` (`javap -p -s`, 6.1.6 and 7.0.2), two of which
        take a `String` operand the `composers` fold has no position for; this file's
        `composers` block is keyed on the Java `RequestPredicate` owner and reads none of
        them. `resources` serves static resources and `withAttribute` attaches metadata.
    - owner: org.springframework.web.reactive.function.server.RouterFunctions
      method_names: [resourceLookupFunction]
      why: >
        Builds the lookup FUNCTION `resources(Function)` takes — a `Function<ServerRequest,
        Mono<Resource>>` from a pattern and a location — and serves nothing itself: the
        route is declared by whichever `resources(...)` call the function is handed to,
        and that call is read. *`resource` and `resources` sat beside it here on the
        ground that "this analysis has no row shape for 'these bytes are served here'";
        that ground was false — `derived_resource` and `schema_operations` both mint rows
        with no handler — and spec §6 moved them into `verbs`, handler-less.*
    - owner: org.springframework.web.reactive.function.server.RouterFunctions
      method_names: [changeParser]
      why: >
        Swaps the `PathPatternParser` a whole router tree matches with. It changes how
        addresses are PARSED rather than declaring one, and it appears in the enumeration
        only because it takes a router as its first argument.
    - owner: org.springframework.web.reactive.function.server.RouterFunctions
      method_names: [toHttpHandler, toWebHandler]
      why: >
        Adapt a whole router into the reactive server's own handler types. They declare
        no address and serve nothing new — they are how an assembled tree is MOUNTED —
        and they appear in the enumeration only because their first argument is a router.
        The servlet package declares neither.
