id: spring-webflux-router
displayName: Spring WebFlux (functional routing)
style: combinator
protocol: http
direction: inbound

detect:
  coordinates: ["org.springframework:spring-webflux"]

measured:
  - { artifact: org.springframework:spring-webflux, versions: ["6.1.6", "7.0.2"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }

# **NO `array_arguments`**, and the line is measured rather than argued (W47's review).
# Withhold the capability and re-resolve on facts where every `array` argument arrives as one
# opaque `unresolved`: this catalog's row count is UNCHANGED and only its media column goes
# NULL. `spring-stomp-endpoint.yml` is the one that declares it, because there a two-path
# registration collapses into one boundary and a registered URL disappears.
#
# D02 §1's doctrine is that `requires` keeps degradation visible and that "silently finding
# fewer endpoints is the failure this prevents" — a row present and honestly `unresolved`,
# or a column NULL where nothing was read, is not that failure.
#
# *W46 declared it here and W46's review reverted it on a rule — "`requires` names a
# capability without which a catalog derives NOTHING" — that is false of the thirty catalogs
# declaring `string_constants`, whose rows all survive its absence with a NULL address. The
# rule is narrowed to what the measurement supports; the wider convention is `OI-78`.*
requires: [call_site, string_constants, chain_reconstruction]

# D02 §2's `combinator` style, both DSLs Spring WebFlux ships for functional
# routing: the Java `RouterFunctions.route`/`.nest` tree and the Kotlin
# `coRouter { }` builder. Two different owners feed one core (the engine has
# no framework knowledge at all) — argument-rooted for Java, body-linked
# (receiver-rooted) for Kotlin — and every owner/method/arity/argument
# position below is exactly what 2E's checkpoint froze against a real scan
# (checkpoint items (1a), (1b), (3)); nothing here is invented past that.
matches:
  entries:
    # Java: `RouterFunctions.route(predicate, handler)` and `.nest(prefix,
    # subtree)` are both static two-argument calls on the same owner
    # (checkpoint (1a)). `nest` is ALSO declared as a `prefixes` rule below —
    # dispatch there wins, so this entry's own `handler_arg` is read only for
    # `route`; `nest` never reaches it.
    #
    # NO `descriptor` HERE, and that is a ruling rather than an omission
    # (descriptor sweep, out of scope). `methods` in a `combinator` entry is a
    # bare list of NAMES, matched by `engines/combinator.py` on owner and name
    # alone — a different grammar from `single_call`'s `methods` rows, whose
    # `descriptor` key pins a row to one overload's erased signature. This
    # engine has no such key to declare, so closing the same overload question
    # here is an engine change, not a catalog edit. It stops being theoretical
    # the day `RouterFunctions` declares a `route` or `nest` overload whose
    # position 1 is not the handler; `javap -p -s RouterFunctions` is the check.
    #
    # `resources`/`resource` (spec §6) are admitted here for the same reason `nest` is:
    # the entry is what makes a static call a ROOT, and their `verbs` rules below are
    # what read them — dispatch lands there, and this `handler_arg` is never read for
    # either. The argument-less `route()` matches this entry by name too; it is the
    # builder chain's origin (`origins` below), its result is consumed by the first
    # builder call, and a bare `route().build()` declares nothing and derives nothing.
    - owner: org.springframework.web.reactive.function.server.RouterFunctions
      methods: [route, nest, resources, resource]
      handler_arg: 1
    # Kotlin: `coRouter(builderLambda)` — the file-facade class (`…Kt`
    # suffix), NOT `CoRouterFunctionDsl` itself (checkpoint (1b) ruling 2).
    # Its one argument is a `lambda`-kind argument naming the DSL body's own
    # synthetic method, so the tree roots here and jumps straight to it;
    # `ktRoutes` is the only root the checkpoint found (ruling 5) — the body
    # methods themselves are reached only through this and the `nest` link
    # below, never rooted on their own (2E checkpoint F4).
    - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDslKt
      method: coRouter
      body_arg: 0
      origin_param: 0
    # The reactive `router { }` WITHOUT coroutines (`GAP-1b`): the file-facade class,
    # exactly as the servlet twin has declared since W44 and `coRouter` above does.
    # `javap -p -s RouterFunctionDslKt` at spring-webflux 6.1.6 and 7.0.2: one method,
    # `router(Function1)RouterFunction` — no `plus` here, unlike the servlet facade.
    # `KotlinWebFluxRoutes.kt` is the live instance; it derived NOTHING until this line.
    - owner: org.springframework.web.reactive.function.server.RouterFunctionDslKt
      method: router
      body_arg: 0
      origin_param: 0

  vocabulary:
    # MEASURED, at spring-webflux 6.1.6 and 7.0.2 (CP-12 Q11/Q12,
    # `scripts/probes/cp12_sweep_round1b.md`): `RequestPredicates` and
    # `CoRouterFunctionDsl` EACH declare seven per-verb factories, identical at
    # both minors — read off the jars as "declared on the type and spelled in
    # upper case", which is the framework's own way of marking a verb factory
    # apart from `all`, `path`, `accept`, `headers`, `contentType` and the two
    # generic `method`/`methods` forms.
    #
    # This list held GET/POST/HEAD for Java and GET/POST for Kotlin, and those
    # are EXACTLY the verbs `fixtures/orders-service/.../routes/OrderRoutes.java`
    # and `KotlinOrderRoutes.kt` declare (`A-M9`). The comment above says the
    # standard this file was built to — "exactly what 2E's checkpoint froze
    # against a real scan… nothing here is invented past that" — and that
    # standard, applied to a fixture rather than to the framework, produces
    # §8.1 rule 1's failure in as many words: the encoded rule was a projection
    # of the examples in front of the author.
    # `RouterFunctions.route(RequestPredicates.PUT("/orders/{id}"), h::update)`
    # is an entirely ordinary WebFlux route and derived no verb and no address.
    #
    # `method(HttpMethod)`/`methods(HttpMethod...)` stay OUT and are a stated
    # COVERAGE boundary: their verb is an enum constant argument rather than the
    # method's own name, and this grammar reads a verb only as a literal
    # declared beside the owner.
    verbs:
      # Java: `RequestPredicates.GET/HEAD/POST/…("/x")` are one-argument
      # predicates with no handler of their own — a route only once some
      # `RouterFunctions.route` attaches a handler to the predicate they
      # produce (checkpoint (1a)'s full call sequence).
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: GET
        verb: GET
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: HEAD
        verb: HEAD
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: POST
        verb: POST
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: PUT
        verb: PUT
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: PATCH
        verb: PATCH
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: DELETE
        verb: DELETE
        path_arg: 0
      - owner: org.springframework.web.reactive.function.server.RequestPredicates
        method: OPTIONS
        verb: OPTIONS
        path_arg: 0
      # **THE TWO-ARGUMENT `(String, handler)` FORM ONLY**, and `CoRouterFunctionDsl.GET`
      # declares FOUR — `javap -p -s` at **spring-webflux** 6.1.6, which is where this
      # class ships; the first version of this note said three and cited spring-webmvc,
      # where `javap` answers "class not found":
      #   `(String, Function2)V`                     the one this row reads
      #   `(RequestPredicate, Function2)V`           a predicate, NO path
      #   `(String, RequestPredicate, Function2)V`   path, predicate, handler
      #   `(String)RequestPredicate`                 a predicate FACTORY, returns rather
      #                                              than declares
      # This grammar matches on owner and name alone — no `descriptor` key — so `path_arg:
      # 0` is read against whichever overload a caller wrote. On the second that
      # argument is a PREDICATE, not a path, and on the third the handler sits
      # at position 2 while `handler_arg: 1` reads the predicate. `KotlinOrderRoutes.kt` is the one live
      # Kotlin router here and it writes the two-argument form throughout.
      #
      # Not in `slice.outside`, because the slice is for methods a catalog does not read
      # and these are read. It is an OVERLOAD gap, the same engine work `route`/`nest` need.
      # Kotlin: the builder's own two-argument form — `GET("/x") { handler
      # }`/`POST("/x") { handler }` declare a whole route in one call
      # (checkpoint (1b), the `…$1$1$1#`/`…$1$1$2#` call sites). One
      # vocabulary, two arities: the Java rows above and these rows are
      # the same verbs, read off two different owners because the DSL
      # receiver (`ALOAD 0`) carries no chain to fold a bare predicate
      # through (checkpoint (1b) ruling 3).
      #
      # Each Kotlin verb has FOUR overloads (CP-12 Q12) and this grammar
      # matches on owner and name alone, with no `descriptor` key to declare —
      # the same engine gap the `entries` comment above already states for
      # `route`/`nest`. So one row per verb covers all four, and the
      # `path_arg: 0`/`handler_arg: 1` positions are the two-argument
      # `(String, handler)` form's. That is unchanged by this edit and is why
      # widening the verb list does not widen the exposure.
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: GET
        verb: GET
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: HEAD
        verb: HEAD
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: POST
        verb: POST
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: PUT
        verb: PUT
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: PATCH
        verb: PATCH
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: DELETE
        verb: DELETE
        path_arg: 0
        handler_arg: 1
      - owner: org.springframework.web.reactive.function.server.CoRouterFunctionDsl
        method: OPTIONS
        verb: OPTIONS
        path_arg: 0
        handler_arg: 1
      # The NON-coroutine DSL's seven verbs, FIVE overloads each (`GAP-1b`,
      # `W44-verb-overloads`, spec §1b). MEASURED with `javap -p -s` on
      # `RouterFunctionDsl` at spring-webflux 6.1.6 and 7.0.2, identical to the servlet
      # twin at spring-webmvc 6.1.6 and 7.0.2 (A1 Task 5; `scripts/probes/
      # cp12_sweep_round1b.md` carries the counts):
      #   `(Function1)V`                             a catch-all — `/**`, resolved
      #   `(String)RequestPredicate`                 a predicate FACTORY: no handler,
      #                                              a route once an entry attaches one
      #   `(String, Function1)V`                     a literal path and its handler
      #   `(RequestPredicate, Function1)V`           the predicate's constraints
      #   `(String, RequestPredicate, Function1)V`   path, predicate, handler at 2
      # `arity` splits 1/2/3 and `arg_types` splits the two arity-1 forms and the two
      # arity-2 forms on position 0 (spec §3b). Every handler is a `Function1` (the
      # reactive one returns `Mono<ServerResponse>`; the erased descriptor is the same),
      # so the catch-all is typed on it rather than left open. No `extends_receiver`:
      # the DSL receiver is the body's own parameter and carries no chain (checkpoint
      # (1b) ruling 3); the body walk folds each call where it stands. This owner had
      # NO rule at all before A1 Task 5 — a reactive `router { }` derived nothing, with
      # nothing saying so. `KotlinWebFluxRoutes.kt` is the live instance, under `/ktflux`.
      - owner: org.springframework.web.reactive.function.server.RouterFunctionDsl
        method: GET
        verb: GET
        arity: 1
        arg_types: { 0: kotlin.jvm.functions.Function1 }
        handler_arg: 0
