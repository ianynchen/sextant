      owner: org.springframework.http.MediaType
      values:
        APPLICATION_JSON: application/json

    composers:
      and: [{ owner: org.springframework.web.servlet.function.RequestPredicate, method: and }]
      or: [{ owner: org.springframework.web.servlet.function.RequestPredicate, method: or }]

  # Merging ROUTE SETS along result→receiver, never constraints, so every one is
  # owner-qualified to `RouterFunction` — an owner-free continuation never roots one.
  # `andNest` is the SHAPED form: its second argument is a whole router to fold under its
  # own prefix, not a handler.
  #
  # `andOther` was missing from the reactive twin too — an omission there rather than a
  # difference between the packages: both interfaces declare it with `and`'s exact
  # signature, `(LRouterFunction;)LRouterFunction;`. **Undeclared, a merged router still
  # derives at TOP LEVEL**, because an unclaimed continuation consumes neither its receiver
  # nor its argument and both `route(...)` calls stay root candidates. What is lost is a
  # PREFIX: under `nest(path("/p"), a.andOther(b))` the routes come out at `/a` and `/b`
  # rather than `/p/a` and `/p/b`, with one extra handler-less `unresolved` row beside them.
  # Measured by driving the engine with and without the declaration (W44's review — the
  # first statement here said "every route merged that way is lost", which is not what
  # happens).
  continuations:
    - { name: andRoute, owner: org.springframework.web.servlet.function.RouterFunction }
    - name: andNest
      owner: org.springframework.web.servlet.function.RouterFunction
      path_arg: 0
      subtree_arg: 1
    - { name: and, owner: org.springframework.web.servlet.function.RouterFunction }
    - { name: andOther, owner: org.springframework.web.servlet.function.RouterFunction }
    # The builder chain (spec §4): `build()` ends it and, consumed by nothing, roots
    # it; `add(RouterFunction)` folds a whole router built beside it through the plain
    # continuation's argument fold (spec §5) — one built in another method is one
    # unresolved row (spec §7 case 4).
    - { name: build, owner: org.springframework.web.servlet.function.RouterFunctions$Builder }
    - { name: add, owner: org.springframework.web.servlet.function.RouterFunctions$Builder }
    # Pass-throughs (spec §4b): declared so a chain through them keeps every route to
    # its left. Each reads NO argument — a filter, an attribute, an error handler is
    # never a route. `onError` has two overloads (`Predicate`/`Class` at position 0)
    # and a pass-through reads neither, so one line covers both.
    - { name: filter,         owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }
    - { name: before,         owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }
    - { name: after,          owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }
    - { name: onError,        owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }
    - { name: withAttribute,  owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }
    - { name: withAttributes, owner: org.springframework.web.servlet.function.RouterFunctions$Builder, pass_through: true }

  # Spec §4b: where a builder chain STARTS. The argument-less `route()` returns a
  # `RouterFunctions$Builder` and declares nothing; a receiver it produced contributes
  # zero routes and poisons nothing, which is what tells "the chain starts here" from
  # "I could not read the receiver". The only origin either stack names. `arity: 0` is
  # load-bearing: `route(predicate, handler)` shares the name, heads every `andRoute`
  # chain, and read as an origin its route is DROPPED — the live fixture's
  # `GET /fn/orders` disappeared the first time this line lacked it (A1 Task 4).
  origins:
    - { owner: org.springframework.web.servlet.function.RouterFunctions, method: route, arity: 0 }


# Copied verbatim from `spring-web.yml` rather than re-declared, so an outbound-shapes
# join never has to reconcile two catalogs describing one wrapper surface two ways. The
# reactive wrappers are absent on purpose: `Mono`/`Flux` are not what a servlet handler
# returns, and declaring a type this package never carries would be catalog data with no
# framework behind it.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.concurrent.CompletableFuture,  payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                      payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in `shape-models/json.yml`.
shape_model: json

# D02's declared SLICE (F2 §3.8), the same one the reactive twin carries. Measured
# (`scripts/probes/w19_catalog_surface.md`, regenerated for A1 Task 4): this catalog reads
# **20 of the 20** methods `RouterFunctions$Builder` declares at spring-webmvc 6.1.6 — it
# read 0 of them until the engine could root a walk at `build()` and let a verb extend
# its receiver (`G-37`, spec §4). What stays outside is listed below, each with the
# reason it declares no address.
slice:
  outside:
    - owner: org.springframework.web.servlet.function.RouterFunctionDsl
      method_names: [add, and, invoke, not, or, param, pathExtension, resource, resources, withAttribute]
      why: >
        The methods this catalog does not read, and what each actually is — measured with
        `javap -p`, because a first version described them from their names and got three
        wrong. `param` and `pathExtension` each declare a HANDLER-taking void overload, so
        `param("x") { … }` DECLARES a route rather than nesting a builder; `invoke` is the
        `"/x" { handler }` route form for the same reason. `add` and `resource` attach or
        declare routes too. All five are the receiver-rooted shape `G-37` names, which is
        engine work rather than a catalog line, and routes written any of those ways derive
        NOTHING. `path` left this list when its one-argument predicate factory became a
        `prefixes` rule (A1 Task 5); its handler-taking overload, `path("/x") { … }`, is
        the same route-declaring shape and derives one unresolved row rather than nothing.
        `and`/`or`/`not` compose predicates INSIDE the DSL, where this file's `composers`
        block is keyed on the Java `RequestPredicate` owner and so reads none of them.
        `resources` serves static resources and `withAttribute` attaches metadata. The
        enumeration admits six of these by `route declaration` rather than by a `String`
        at argument 0.
    - owner: org.springframework.web.servlet.function.RouterFunctionDslKt
      method_names: [plus]
      why: >
        Kotlin's `+` operator on two whole routers — `andOther`'s DSL spelling, and the same
        under-report it was. Undeclared, a merged router still derives at top level and
        loses any prefix it sits under. Named rather than declared because a rule no
        fixture exercises is a rule nobody checks, and no corpus here supplies a Kotlin one.
    - owner: org.springframework.web.servlet.function.RouterFunctions
      method_names: [resourceLookupFunction]
      why: >
        Builds the lookup FUNCTION `resources(Function)` takes — a `Function<ServerRequest,
        Optional<Resource>>` from a pattern and a location — and serves nothing itself: the
        route is declared by whichever `resources(...)` call the function is handed to,
        and that call is read. *`resource` and `resources` sat beside it here on the
        ground that "this analysis has no row shape for 'these bytes are served here'";
        that ground was false — `derived_resource` and `schema_operations` both mint rows
        with no handler — and spec §6 moved them into `verbs`, handler-less.*
    - owner: org.springframework.web.servlet.function.RouterFunctions
      method_names: [changeParser]
      why: >
        Swaps the `PathPatternParser` a whole router tree matches with. It changes how
        addresses are PARSED rather than declaring one, and it appears in the enumeration
        only because it takes a router as its first argument.
