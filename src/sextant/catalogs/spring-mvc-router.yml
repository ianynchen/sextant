      # 7.0.2 — the same two overloads the reactive twin declares, both arity 2, both
      # linking to their body the same way (a `lambda`-kind argument naming the body
      # method):
      #   `nest(String, Function1)V`             `"/x".nest { }`, a literal prefix
      #   `nest(RequestPredicate, Function1)V`   `accept(JSON).nest { }`, a predicate
      # One rule each, split on position 0's type, so the row says which argument it
      # reads rather than reading a predicate through a `path_arg` (one untyped rule
      # stood here; A1 Task 5's review aligned the stacks).
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: nest
        arity: 2
        arg_types: { 0: java.lang.String }
        path_arg: 0
        body_arg: 1
        origin_param: 0
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: nest
        arity: 2
        arg_types: { 0: org.springframework.web.servlet.function.RequestPredicate }
        predicate_arg: 0
        body_arg: 1
        origin_param: 0
      # The DSL's own predicate factory, `path(String)RequestPredicate` — what
      # `GET(path("/health")) { }` hands its predicate position, so the route reads
      # `/health` (A1 Task 5, `KotlinMvcRoutes.kt`). `arity: 1` is load-bearing: the
      # same name's `path(String, Function1)V` overload DECLARES a verb-less route
