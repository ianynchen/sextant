      # read a route declaration as a bare prefix. Unaccepted, it derives one
      # unresolved row instead (spec §3's G-13 guard), never silence — the slice
      # below is keyed by NAME and cannot list one overload of a read name.
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: path
        arity: 1
        path_arg: 0
      # The builder's nesting forms (spec §5), MEASURED with the same `javap`:
      #   `path(String, Consumer<Builder>)`      a lambda-bodied builder under a path
      #   `path(String, Supplier<RouterFunction>)` a lambda-bodied router under a path
      #   `nest(RequestPredicate, Consumer<Builder>)`
      #   `nest(RequestPredicate, Supplier<RouterFunction>)`
      # Both lambdas land in a body method of their own, so both are `body_arg`; the two
      # overloads at each name share an arity and are split on position 1's type. Each
      # carries the chain on (`extends_receiver`). Inside a `Consumer<Builder>` body the
      # builder is the body's own parameter: its verbs carry no receiver the walk can
      # see, their chain contributes nothing, and the body folds under the prefix.
      - owner: org.springframework.web.servlet.function.RouterFunctions$Builder
        method: path
        arity: 2
        arg_types: { 1: java.util.function.Consumer }
        path_arg: 0
        body_arg: 1
        extends_receiver: true
        origin_param: 0
      - owner: org.springframework.web.servlet.function.RouterFunctions$Builder
        method: path
        arity: 2
        arg_types: { 1: java.util.function.Supplier }
        path_arg: 0
        body_arg: 1
        extends_receiver: true
      - owner: org.springframework.web.servlet.function.RouterFunctions$Builder
        method: nest
        arity: 2
        arg_types: { 1: java.util.function.Consumer }
        predicate_arg: 0
        body_arg: 1
        extends_receiver: true
        origin_param: 0
      - owner: org.springframework.web.servlet.function.RouterFunctions$Builder
        method: nest
        arity: 2
        arg_types: { 1: java.util.function.Supplier }
        predicate_arg: 0
        body_arg: 1
        extends_receiver: true

    media:
      # `accept` fills `produces`, `contentType` fills `consumes` — request-matching
      # semantics: a route guarded by `accept(JSON)` serves clients that accept JSON.
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: accept
        fills: produces
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: contentType
        fills: consumes
      # BOTH, because `RouterFunctionDsl` declares both. The reactive twin declared only
      # `accept` on the strength of "no `contentType` call exists anywhere in the
      # checkpoint's Kotlin scan" — a statement about a FIXTURE, written as a statement
      # about the framework. Corrected there in this same commit.
      # Each name ALSO has a `(MediaType, Function1)V` overload — a route DECLARED
      # under one media guard, handler and all — which is a VERB rule above
      # (`dsl-media-route`, spec 2026-09-21 §7a), split from this one by `arity`.
      # `KotlinMvcRoutes.kt` carries a live instance.
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: accept
        fills: produces
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: contentType
        fills: consumes

    # One measured member, and only one. A constant nobody declared contributes nothing
    # rather than leaking its own symbol fragment into a media column — a route declaring
    # `MediaType.APPLICATION_XML` reads NULL here, an under-report closed one measured
    # member at a time and never by guessing that a constant's name is its wire value.
    # `RequestPredicates.param` (spec 2026-09-19 §5c; `inbound-request-requirements`; CP-26
    # rows 2 and 2b): the servlet twin has NO `queryParam` — its parameter predicate is
    # `param(String, String)` / `param(String, Predicate)`, and `ParamPredicate.test` reads
    # `ServerRequest.param(name)`, which `DefaultServerRequest` backs with
    # `HttpServletRequest.getParameterMap` — the query string AND the form body, the one API
    # that cannot tell the two apart. So the kind is `param`, as §5a reserves it for exactly
    # this case (the reactive twin's `queryParam` reads the query string alone and is
    # `query`). A REQUIREMENT contributor, folded where a predicate argument or an `and(...)`
    # reaches it, as `media` is: present and equal to the value, or present and satisfying a
    # predicate the walk cannot read (no `value_arg`, value NULL: "name required, value
    # unread", `resolved`; a variable in the String overload's value position is
    # recorded the same way). Both `required`: `test`
    # returns false without the parameter and the route does not match. The two share a
    # name and an arity, so `arg_types` tells them apart (spec §3c). `headers(Predicate)` is
    # an arbitrary function over the whole header map and is NOT read — stated here, no
    # rule. (The Kotlin DSL's `param(name, predicate, f)`/`queryParam` spellings are in
    # `slice.outside`; unchanged.)
    request_requirement:
