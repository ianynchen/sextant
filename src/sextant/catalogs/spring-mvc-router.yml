        arity: 2
        arg_types: { 1: java.lang.String }
        kind: param
        name_arg: 0
        value_arg: 1
        requirement: required
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: param
        arity: 2
        arg_types: { 1: java.util.function.Predicate }
        kind: param
        name_arg: 0
        requirement: required

