      # route. A verb rule on the second: `arity: 2` is what tells it from the factory
      # (arity 1 — a vararg is one array slot; the engine falls through to the media rule
      # for a call no verb overload accepts, and refuses a verb rule on a media name that
      # declares no arity), the media at 0 fills the column `fills` names, the handler at
      # 1, and no verb of its own (`verb: null`, as `route(predicate, handler)` reads):
      # one row, `method` NULL, path `/**` (the served any-path pattern), media set,
      # resolved. NO `all_methods` on this catalog (§0b A1): `resources(…)` routes are
      # verb-less rows too and serve GET/HEAD/OPTIONS only, so a fan-out would publish
