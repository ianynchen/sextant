id: spring-mvc-router
displayName: Spring MVC (functional routing)
style: combinator
protocol: http
direction: inbound

# THE ASYMMETRY THIS CLOSES (F10 §11, `G-29`, W44). `spring-webflux-router.yml` has read
# functional routing since 2E and only the REACTIVE package: `org.springframework.web.
# reactive.function.server`. Spring MVC ships the same two DSLs under
# `org.springframework.web.servlet.function`, and a servlet application using them derived
# nothing at all — its whole functional routing surface absent, with nothing saying so.
#
# **Measured against the jar, not mirrored from the twin.** The two packages really are
# structurally identical here, and that is a MEASUREMENT rather than an assumption — W43
# is the cautionary case, where the twin's own descriptor was wrong for its sibling.
# Read out of spring-webmvc 6.1.6 with `javap -p -s`:
#
#   * `RouterFunctions.route(RequestPredicate, HandlerFunction)` and
#     `nest(RequestPredicate, RouterFunction)` — the same two-argument static pair.
#   * `RequestPredicates` declares the same SEVEN verb factories, each
#     `(Ljava/lang/String;)LRequestPredicate;`, plus `path`, and `accept`/`contentType`
#     as `MediaType...` varargs.
#   * Kotlin's entry point is `RouterFunctionDslKt.router(Function1)` — `coRouter`'s twin,
#     under a different NAME, which is the one thing a copy would have got wrong.
#   * `RouterFunctionDsl` declares the same seven verbs, `nest`, `accept` AND
#     `contentType`.
detect:
  coordinates: ["org.springframework:spring-webmvc", "org.springframework.boot:spring-boot-starter-web"]

measured:
  - { artifact: org.springframework:spring-webmvc, versions: ["6.1.6"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }
  # The Kotlin DSL's verb overloads (Q14), counted on this stack's own jar at both minors.
  - { artifact: org.springframework:spring-webmvc, versions: ["6.1.6", "7.0.2"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }

# **NO `array_arguments`**, and the line is measured rather than argued (W47's review).
# Withhold the capability and re-resolve on facts where every `array` argument arrives as one
# opaque `unresolved`: this catalog's row count is UNCHANGED and only its media column goes
# NULL. `spring-stomp-endpoint.yml` is the one that declares it, because there a two-path
# registration collapses into one boundary and a registered URL disappears.
#
# D02 §1's doctrine is that `requires` keeps degradation visible and that "silently finding
# fewer endpoints is the failure this prevents" — a row present and honestly `unresolved`,
# or a column NULL where nothing was read, is not that failure.
#
# *W46 declared it here and W46's review reverted it on a rule — "`requires` names a
# capability without which a catalog derives NOTHING" — that is false of the thirty catalogs
# declaring `string_constants`, whose rows all survive its absence with a NULL address. The
# rule is narrowed to what the measurement supports; the wider convention is `OI-78`.*
requires: [call_site, string_constants, chain_reconstruction]

matches:
  entries:
    # The argument-rooted Java form. `nest` is ALSO a `prefixes` rule below — dispatch
    # there wins, so this entry's `handler_arg` is read only for `route`.
    #
    # NO `descriptor` HERE, and that is the ENGINE's shape rather than an omission:
    # `methods` in a `combinator` entry is a bare list of NAMES, matched on owner and name
    # alone, and this engine has no `descriptor` key to declare. Closing the same overload
    # question here is engine work. It stops being theoretical the day `RouterFunctions`
    # declares a `route` or `nest` overload whose position 1 is not the handler; at
    # spring-webmvc 6.1.6 `javap -p -s` says each name has exactly one two-argument form
    # plus the argument-less `route()` builder entry, the chain's origin (`origins` below).
    #
    # `resources`/`resource` (spec §6) are admitted here for the same reason `nest` is:
    # the entry is what makes a static call a ROOT, and their `verbs` rules below are
    # what read them — dispatch lands there, and this `handler_arg` is never read for
    # either. The argument-less `route()` matches this entry by name too; it is the
    # builder chain's origin (`origins` below), its result is consumed by the first
    # builder call, and a bare `route().build()` declares nothing and derives nothing.
    - owner: org.springframework.web.servlet.function.RouterFunctions
      methods: [route, nest, resources, resource]
      handler_arg: 1
    # Kotlin: the FILE-FACADE class (`…Kt`), not the DSL type — the same rooting the
    # reactive twin uses, and the entry function is `router`, not `coRouter`.
    - owner: org.springframework.web.servlet.function.RouterFunctionDslKt
      method: router
      body_arg: 0
      origin_param: 0

  vocabulary:
    verbs:
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: GET
        verb: GET
        path_arg: 0
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: HEAD
        verb: HEAD
        path_arg: 0
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: POST
        verb: POST
