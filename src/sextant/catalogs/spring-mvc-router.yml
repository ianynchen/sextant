      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: PUT
        verb: PUT
        path_arg: 0
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: PATCH
        verb: PATCH
        path_arg: 0
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: DELETE
        verb: DELETE
        path_arg: 0
      - owner: org.springframework.web.servlet.function.RequestPredicates
        method: OPTIONS
        verb: OPTIONS
        path_arg: 0
      # The Kotlin DSL's seven verbs, FIVE overloads each (`W44-verb-overloads`, spec
      # §1b). MEASURED with `javap -p -s` on `RouterFunctionDsl` at spring-webmvc 6.1.6
      # and 7.0.2, and the same five on the reactive twin at spring-webflux 6.1.6 and
      # 7.0.2 (A1 Task 5; `scripts/probes/cp12_sweep_round1b.md` carries the counts):
      #   `(Function1)V`                             a catch-all — `/**`, resolved
      #   `(String)RequestPredicate`                 a predicate FACTORY: no handler,
      #                                              a route once an entry attaches one
      #   `(String, Function1)V`                     a literal path and its handler
      #   `(RequestPredicate, Function1)V`           the predicate's constraints
      #   `(String, RequestPredicate, Function1)V`   path, predicate, handler at 2
      # `arity` splits 1/2/3 and `arg_types` splits the two arity-1 forms and the two
      # arity-2 forms on position 0 (spec §3b). Every handler is a `Function1`, so the
      # catch-all is typed on it rather than left open. No `extends_receiver`: the DSL
      # receiver is the body's own parameter and carries no chain (checkpoint (1b)
      # ruling 3); the body walk folds each call where it stands.
      #
      # *One rule per verb stood here, `path_arg: 0`/`handler_arg: 1`, matched on owner
      # and name alone — right for the `(String, Function1)` form and wrong for the other
      # four: the three-argument form lost its handler (position 1 is the predicate),
      # `GET(path("/x")) { }` read a predicate as its path and derived a path-NULL
      # unresolved row, and the catch-all read its handler as a path. Measured against
      # `KotlinMvcRoutes.kt` before these rules existed (A1 Task 5's report).*
      # `KotlinMvcRoutes.kt` is the live instance: every `GET` overload under `/ktmvc`.
      - owner: org.springframework.web.servlet.function.RouterFunctionDsl
        method: GET
        verb: GET
        arity: 1
