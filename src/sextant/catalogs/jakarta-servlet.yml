id: jakarta-servlet
displayName: Jakarta Servlet (@WebServlet on an HttpServlet subclass)
style: supertype_dispatch
protocol: http
direction: inbound

# The Servlet API rather than any framework: `@WebServlet` is processed by the
# CONTAINER's own deployment scan, so a class extending `HttpServlet` is served
# the same whether the module is a plain WAR, a Spring Boot app with
# `@ServletComponentScan`, or anything else. CP-9 measured it with no framework
# in the picture at all (`scripts/probes/cp9_servlet_shapes.md`).
#
# The list is DIRECT API declarations only, and it is incomplete on purpose:
# the API usually arrives transitively, through a container or a web starter,
# and Maven records direct declarations only. Nothing reads it — `detect
# .coordinates` gates exactly one style (`derived_resource`, 2O Task 6) and
# this is not it — so an incomplete list costs nothing here and would cost
# every servlet in the estate if it ever became an activation gate without
# being completed first.
detect:
  coordinates: ["jakarta.servlet:jakarta.servlet-api"]

# `call_site` is here for `bypassed_by` below and nothing else: whether an
# override of `service()` DELEGATES through `super.service(req, resp)` is the
# one fact separating two shapes the container answers differently (CP-9 rows
# 35-43), and it arrives only as a call site. A scan that produced none skips
# this catalog and reports the skip, which is the honest degradation — the
# alternative is reading every delegating wrapper as a replacement.
requires: [annotation_args, call_site, type_annotations, typed_signatures, superclass]

matches:
  # THE SUPERTYPE IS THE CONTRACT. `HttpServlet.service` is what reads a
  # request's method and dispatches to the matching `doXxx`; a class that does
  # not extend it has no such dispatch, which is why a `GenericServlet`
  # subclass — same annotation, same registration — derives nothing (CP-9 rows
  # 16-17, 28). Matched on the DIRECT superclass: a class reaching
  # `HttpServlet` through an intermediate base of its own is a stated boundary
  # in docs/COVERAGE.md, not a guess.
  supertype: jakarta.servlet.http.HttpServlet

  # THE ADDRESS IS ON THE TYPE, which is the whole reason this is not an
  # `annotation_driven` catalog: that engine's derivation joins method symbols
  # and a type-level annotation mints no row of its own
  # (`derive_endpoints.sql:398-400`).
  #
  # `urlPatterns` and `value` are the same attribute under two spellings
  # (javap, jakarta.servlet-api via tomcat-embed-core 10.1.50 and 11.0.24:
  # `WebServlet` declares `String[] value()` and `String[] urlPatterns()`,
  # `@Target(TYPE)`, no `@Inherited`). Both reach the fact stream as their own
  # argument key (CP-9 rows 21-22), so both are named — a catalog naming one
  # would derive nothing for half the estate. An ALIAS SET, not a precedence
  # list: writing BOTH is a deployment error the container refuses, so such a
  # module serves nothing and either value would be a fabricated address.
  # Exactly one key present, or no row.
  #
  # EACH PATTERN IS ITS OWN ENDPOINT (CP-9 rows 1-2). And each is published
  # VERBATIM: `/legacy/*` and `*.do` are pattern grammars with their own
  # precedence rules, and CP-9 measured only that a declared pattern is served
  # at its own literal spelling — normalising one would publish an address no
  # probe covered.
  address:
    annotation: jakarta.servlet.annotation.WebServlet
    args: [urlPatterns, value]

  # The one word this style's `members` vocabulary carries (2O design §3b).
  members: overridden_dispatch_methods

  # THE VERB IS THE OVERRIDDEN METHOD, one each, and the framework serves no
  # verb it was given no override for (CP-9 rows 4-6: `PUT /verbs` is a 405
  # where the class declares `doGet` and `doPost`).
  #
  # `parameters` is not decoration. A method is identified by its name AND its
  # parameter types in order (GUIDELINES §8.1's language rule), and CP-9 row 18
  # measured the consequence: `doGet(String, HttpServletResponse)` overrides
  # nothing, `HttpServlet`'s own `doGet` still applies, and the container
  # answers 405. A name-only selector would publish that address.
  #
  # Seven entries: every `doXxx` `HttpServlet` declares (javap, all three
  # versions). `doHead`, `doOptions` and `doTrace` are here and that is not in
  # tension with the ruling below — an EXPLICIT override is a handler the
  # module declared, with a symbol to attribute, and CP-9 rows 11-12 and 31
  # measured all three served.
  #
  # `doTrace` carries ONE STATED DEPENDENCY, recorded in docs/COVERAGE.md
  # beside Actuator's `exposure.include`, which is the same shape. A Tomcat
  # connector refuses TRACE before dispatch unless `allowTrace` is set, and
  # its default is false (CP-9 row 13: 405 even with `doTrace` overridden) —
  # but `allowTrace` is CONNECTOR CONFIGURATION, set by whoever deploys the
  # module and invisible from its repository, so the default is a deployment
  # fact and not proof that the address is unserved. Over a connector that
  # permits the method, `service()` dispatches TRACE to `doTrace` exactly as
  # it dispatches GET to `doGet` (CP-9 row 31: 200, all three containers).
  # We report code facts and state the deployment dependency; this entry
  # leaves the day the dispatch itself stops happening, not the day a
  # container ships a different connector default.
  dispatch:
    - name: doGet
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: GET
    - name: doPost
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: POST
    - name: doPut
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: PUT
    - name: doDelete
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: DELETE
    - name: doHead
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: HEAD
    - name: doOptions
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: OPTIONS
    - name: doTrace
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
      method: TRACE

  # OVERRIDING `service()` AND DECLARING NO `doXxx` REPLACES THE DISPATCH
  # ITSELF, so the table above describes nothing about such a class: CP-9 rows
  # 14-15 measured GET and PUT both served by one `service` override, where the
  # table would have claimed GET and denied PUT. A wrong answer, not a partial
  # one — so the class derives NOTHING and docs/COVERAGE.md records the shape.
  #
  # **The qualifier is the fix for `A-M2`, and it is about the CONFIGURATION
  # rows 14-15 measured rather than about the rule.** `ServiceOnlyServlet`
  # declares no `doXxx` at all, and the verdict was then applied to every
  # `service()` override — including the commonest real form, a cross-cutting
  # wrapper that calls `super.service(req, resp)` and declares `doGet`/`doPost`.
  # CP-9 rows 35-40 now measure that form on all three containers and BOTH
  # `service` signatures: GET 200, POST 200, **PUT 405**. `HttpServlet`'s own
  # dispatch still runs, the table describes such a class exactly, and
  # discarding it lost its WHOLE surface — address, verbs and handlers.
  #
  # **AND THE NON-DELEGATING OVERRIDE IS NOW MEASURED TOO** (round-1 review,
  # MAJOR 5). Rows 35-40 measured the DELEGATING wrapper, and the verdict was
  # then applied to every `service()` override declaring `doXxx` — §5.4's
  # failure with the arrow reversed. Rows 41-43 measure the same class with the
  # delegation removed: GET 200, POST 200, **PUT 200**, on all three
  # containers. `HttpServlet`'s dispatch never runs, the `doXxx` methods are
  # unreachable, and the table would have claimed GET and POST while denying a
  # PUT the container serves.
  #
  # So the bypass now asks the fact that separates them, and the fact stream
  # carries it: rows 44 and 46 read `invoke_kind: special` on an
  # `HttpServlet#service` target out of each delegating override, row 45 reads
  # ABSENT out of the non-delegating one. `call_site` is in `requires` above
  # for exactly this. No new key — `bypassed_by` names the members, and what
  # delegation means is `supertype_dispatch`'s own semantics.
  #
  # Both overloads, because they are two different methods (`HttpServlet`
  # declares `protected service(HttpServletRequest, HttpServletResponse)` and
  # inherits/overrides `public service(ServletRequest, ServletResponse)`), and
  # overriding either one bypasses dispatch just as completely.
  bypassed_by:
    - name: service
      parameters: [jakarta.servlet.http.HttpServletRequest, jakarta.servlet.http.HttpServletResponse]
    - name: service
      parameters: [jakarta.servlet.ServletRequest, jakarta.servlet.ServletResponse]

# THE RULING ON IMPLICIT DISPATCH (CP-9 verdict 5), recorded here because a
# reader of this file will ask why `doGet` alone does not also publish HEAD.
# It IS served — CP-9 rows 7-9: 200 on all three containers, `Allow: GET,
# HEAD, OPTIONS` — OPTIONS is served by every `HttpServlet` alive, and TRACE
# too wherever the connector permits the method (row 32). None of the three is
# derived: the code serving them lives in the container's own jar, which this
# workspace never scans, so the row would carry either no handler or the
# symbol of a DIFFERENT method the implicit path merely calls. This style
# publishes one row per handler the MODULE DECLARES. A stated under-report in
# docs/COVERAGE.md, matching the identical ruling 2O Task 6 made for Spring
# Data REST's own HEAD/OPTIONS; it is falsified the day an endpoint row can
# name a handler outside the module.

# THE ONE OVER-REPORT THIS FILE CANNOT SEE, stated here as well as in
# docs/COVERAGE.md. The annotation deployment scan above is switched off
# WHOLESALE for a module whose `WEB-INF/web.xml` declares
# `metadata-complete="true"` (or a `web-app` version below 3.0): the container
# then registers nothing from annotations, and every URL this file would
# derive for such a module is a 404. CP-9
# rows 33-34 measured it — the same classes, the same container, one
# descriptor, 404 on all three, beside a 200 for the servlet that same
# descriptor registers by hand, which is what says the context was serving
# rather than dead. Nothing in the fact stream reads a deployment descriptor,
# so every rule in this file applies unconditionally and such a module has its
# whole servlet surface fabricated. Closed by a deployment-descriptor reader,
# which would also close the `web.xml` registration route we under-report.

# No `wrappers`/`nullability`/`serialization`/`known_types` (grpc-java.yml's
# identical omission, and a sharper reason): this style's rows carry no
# payload at all. A dispatch method's declared parameters are the container's
# own request and response objects, and the payload is read off a stream at
# runtime — nothing static reaches a type these blocks could describe, so
# `request_shape`/`response_shape` stay NULL and `handler_signature` with them.
