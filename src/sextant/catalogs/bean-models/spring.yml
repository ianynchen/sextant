id: spring
displayName: The Spring dependency-injection model (@Bean, @Qualifier, the channel type)

# WHAT THIS FILE IS, and why it is not a catalog.
#
# D02 §1c. The dependency-injection vocabulary a catalog's `bean_via` resolves
# through (spec 2026-09-21 §3a): which annotation declares a factory method,
# which of its attributes name the bean, which annotation on a parameter names
# the bean it wants. `resolve/beans.py` reads these as data and spells none of
# them — the resolve layer names no framework, for the reason the shape models
# exist (D02 §1b): a second container (a .NET DI registration, Micronaut's
# `@Factory`/`@Named`) is a second file in this directory, not a second fold.
#
# This file is NOT a catalog and lives outside the `*.yml` glob that loads
# them: it declares no `style`, no `matches` and no boundary. A catalog names it
# with `bean_model: spring` and the loader hands the mapping through as
# `Catalog.bean_model`; a catalog naming an id no file here carries is refused
# by file, exactly as an unknown `shape_model` is.
#
# It also carries the container's REGISTRATION vocabulary (spec 2026-10-22
# conditional-beans §2a): which annotations make a class a bean, which one marks
# a configuration class, and the conditions Spring evaluates when it registers a
# bean (`conditions`, `presence` below). That knowledge belongs to the container,
# not to any one catalog, so EVERY catalog that detects a Spring artifact names
# this model (`tests/architecture/test_catalog_bean_model.py`).

# `@Bean` declares `value()` and `name()`, both `String[]` and aliases of each
# other (spring-context 6.1.6, `@AliasFor` — spec §0a F8; CP-27 row 14,
# `scripts/probes/cp27_spring_integration_wiring.md`). Either present names the
# bean: the first element of the array
# the scanner recorded. Neither present, the bean is named after the method.
declaring_annotation: org.springframework.context.annotation.Bean
name_attrs: [name, value]

# `@Qualifier` declares `value()` (spring-beans 6.1.6 — F8; CP-27 row 14). On an
# injected parameter it names the bean outright and is the
# first rung for every reference kind. The rungs after it, for a reference that
# is not a channel, are the container's own candidate order — a qualifier, else
# exactly one bean of the type, else the one of several marked `@Primary`, else
# the bean whose name is the parameter's
# (`DefaultListableBeanFactory.determineAutowireCandidate`, spring-beans 6.1.6;
# CP-27 row 15 — `determinePrimaryCandidate`, `determineHighestPriorityCandidate`,
# then `matchesBeanName` over the candidates, in that order: `javap -c -p` puts
# the three calls at offsets 8, 24 and 119 of the method). `@Primary` is read
# (below); two beans of the type both marked primary fail the injection
# (`determinePrimaryCandidate` throws `NoUniqueBeanDefinitionException` when
# both are the factory's own definitions), and the fold answers `ambiguous`.
# `@Priority` is NOT read: two candidates neither of which is primary go
# straight to the name rung, which is the container's own next step when no
# candidate carries `@Priority`; a module that ranks two beans of one type by
# `@Priority` AND names the parameter after the lower-ranked one gets the name
# match here where the container gives the higher-ranked bean — a stated
# boundary. `resolve/beans.py` implements that order and cites it here rather
# than spelling the class itself.
qualifier_annotation: org.springframework.beans.factory.annotation.Qualifier
primary_annotation: org.springframework.context.annotation.Primary

# A parameter of one of these erased types is a CHANNEL reference and is never
# resolved by type (spec §0b A2): Spring Integration auto-registers
# `errorChannel` (a `PublishSubscribeChannel`) and `nullChannel` (a
# `NullChannel`), so the module's single `@Bean` of a channel INTERFACE is never
# Spring's unique candidate for a parameter declared by that interface — Spring
# falls back to the parameter NAME, and so does the fold.
#
# The list is the INTERFACES the framework's own channel beans implement, not
# the channel CLASSES, and membership is exact (Task 1 fix round 1): a
# parameter declared as `MessageChannel`, `SubscribableChannel` (errorChannel
# implements it) or `PollableChannel` (nullChannel implements both) has the
# framework's beans among its candidates and must resolve by name; a parameter
# declared as a concrete class (`DirectChannel`, `QueueChannel`) has no
# framework bean of that class beside the module's own, so the module's single
# `@Bean DirectChannel` IS the unique candidate and the type rung is right for
# it. A framework release that registers a channel of a new interface adds that
# interface here — data, not code.
channel_types:
  - org.springframework.messaging.MessageChannel
  - org.springframework.messaging.SubscribableChannel
  - org.springframework.messaging.PollableChannel

# **Which classes are beans, and what Spring consults when it registers one** (spec
# 2026-10-22 conditional-beans §2a; CP-44, `scripts/probes/cp44_bean_registration_conditions.md`).
#
# `stereotypes` — the annotations component scanning registers a class under. Each
# reaches `@Component` itself or through the annotation it is built on (`@RestController`
# through `@Controller`, `@RestControllerAdvice` through `@ControllerAdvice`), which is
# what the scanner's default `AnnotationTypeFilter(Component)` matches (CP-44 row 5).
# `configuration_annotation` — the annotation that makes a class a configuration class:
# Spring skips every `@Bean` of a configuration class whose own condition fails (CP-44
# row 4: `loadBeanDefinitionsForConfigurationClass` returns before it reads the class's
# `@Bean` methods).
stereotypes:
  - org.springframework.stereotype.Component
  - org.springframework.stereotype.Service
  - org.springframework.stereotype.Repository
  - org.springframework.stereotype.Controller
  - org.springframework.web.bind.annotation.RestController
  - org.springframework.context.annotation.Configuration
  - org.springframework.web.bind.annotation.ControllerAdvice
  - org.springframework.web.bind.annotation.RestControllerAdvice
configuration_annotation: org.springframework.context.annotation.Configuration

# **A bean that exists in one environment only** (spec 2026-10-21 conditional-controllers,
# ruled 2026-10-22; generalized to every bean by 2026-10-22 conditional-beans).
# The conditions a bean's own annotations carry as DATA — stated on the row, structured,
# evaluated per environment the module resolves, never deciding whether a row exists.
# Each entry names the annotation, which of its members carry the condition, and the
# probe that read the framework's own rule off the jar (§5.4):
#   `profile`  — `@Profile(value)`: ANY listed expression matching accepts; `!p`
#                negates; `&`, `|` and parentheses are expressions this analysis does not
#                evaluate (CP-42 row 3) and reports `unresolved`.
#   `property` — `@ConditionalOnProperty`: `key` is `prefix` + `.` + each of `name`
#                (alias `value`); `having_value` compares case-insensitively, and EMPTY
#                means "any value but `false`"; an absent key matches exactly when
#                `match_if_missing` is true (CP-43 rows 2 and 3).
conditions:
  profile:  { annotation: org.springframework.context.annotation.Profile,
              expressions: value,
              by: scripts/probes/cp42_profile_condition.md }
  property: { annotation: org.springframework.boot.autoconfigure.condition.ConditionalOnProperty,
              prefix: prefix, names: [name, value], having_value: havingValue,
              match_if_missing: matchIfMissing,
              by: scripts/probes/cp43_on_property_condition.md }
  # Named, never evaluated (spec §4): each is a `Condition` CLASS — code, not
  # configuration (CP-42 row 4; the eighteen autoconfigure ones CP-43 row 5
  # enumerates, less `ConditionalOnProperty`, which is `property` above). A bean
  # under one writes its rows verbatim with `holds = unresolved`.
  other:
    by: scripts/probes/cp43_on_property_condition.md
    annotations:
      - org.springframework.context.annotation.Conditional
      - org.springframework.boot.autoconfigure.condition.ConditionalOnBean
      - org.springframework.boot.autoconfigure.condition.ConditionalOnBooleanProperties
      - org.springframework.boot.autoconfigure.condition.ConditionalOnBooleanProperty
      - org.springframework.boot.autoconfigure.condition.ConditionalOnClass
      - org.springframework.boot.autoconfigure.condition.ConditionalOnCloudPlatform
      - org.springframework.boot.autoconfigure.condition.ConditionalOnExpression
      - org.springframework.boot.autoconfigure.condition.ConditionalOnJava
      - org.springframework.boot.autoconfigure.condition.ConditionalOnJndi
      - org.springframework.boot.autoconfigure.condition.ConditionalOnMissingBean
      - org.springframework.boot.autoconfigure.condition.ConditionalOnMissingClass
      - org.springframework.boot.autoconfigure.condition.ConditionalOnNotWarDeployment
      - org.springframework.boot.autoconfigure.condition.ConditionalOnNotWebApplication
      - org.springframework.boot.autoconfigure.condition.ConditionalOnProperties
      - org.springframework.boot.autoconfigure.condition.ConditionalOnResource
      - org.springframework.boot.autoconfigure.condition.ConditionalOnSingleCandidate
      - org.springframework.boot.autoconfigure.condition.ConditionalOnThreading
      - org.springframework.boot.autoconfigure.condition.ConditionalOnWarDeployment
      - org.springframework.boot.autoconfigure.condition.ConditionalOnWebApplication

# **The bean-presence conditions** (spec 2026-10-22 conditional-beans §2c; CP-44 rows 1-3).
# `@ConditionalOnMissingBean` / `@ConditionalOnBean` check the beans registered SO FAR
# (row 3), so a verdict from one module's own beans is `partial`. `type_attrs` are the
# attributes naming the TYPE checked (`value` and `type` are one set, row 2); `name_attrs`
# the attribute naming a bean by name; a use with neither (and no `annotation`) on a
# `@Bean` method checks the method's own return type (row 1). Until the presence pass reads
# this block the two annotations are also listed under `other` above, so they stay
# `unresolved`, verbatim.
presence:
  missing: org.springframework.boot.autoconfigure.condition.ConditionalOnMissingBean
  present: org.springframework.boot.autoconfigure.condition.ConditionalOnBean
  type_attrs: [value, type]
  name_attrs: [name]
  by: scripts/probes/cp44_bean_registration_conditions.md
