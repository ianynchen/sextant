id: aws-sqs-sdk
displayName: AWS SDK for Java v2 (raw SqsClient)
style: fluent
protocol: sqs
direction: outbound

detect:
  coordinates: ["software.amazon.awssdk:sqs"]

requires: [call_site, string_constants, chain_reconstruction]

matches:
  # `SendMessageRequest.builder()` is a static factory, not a `<init>` — the
  # engine's own chain key (CP-3) already handles this: a non-`<init>` root's
  # key is its own `result` (the returned builder value id), exactly the
  # same rule every later step's `result` already feeds forward, so no
  # engine change was needed beyond the precondition's verbless support.
  # SQS has no HTTP-style verb, so this root captures none — a topic/queue
  # has no verb, mirroring single_call's own D02 §2 verbless row (2E-prep
  # Task 11 precondition).
  roots:
    - { owner: software.amazon.awssdk.services.sqs.model.SendMessageRequest, method: builder, captures: {} }
  # CHECKPOINT FACT: both steps genuinely live on the builder's own inner
  # class in real bytecode — `SendMessageRequest$Builder`, `$`-dotted
  # exactly as OkHttp's own `Request$Builder` already established.
  #
  # This file deliberately declares neither step with an `owner` filter,
  # though: fluent steps are owner-free by default (D02 §4) — the same
  # `spring-webclient.yml` precedent already ships `uri`/`bodyValue`/
  # `bodyToMono` undeclared — and `_validate_steps` only demands one where
  # two entries share a method NAME, which neither `queueUrl` nor
  # `messageBody` does anywhere in this file. Leaving them undeclared is
  # bounded, not open-ended: a step can only ever fold into a chain this
  # catalog's own root already matched (D02 §4's walk is chain-rooted, never
  # a bare method-name scan of the whole caller), so the worst an
  # owner-free `queueUrl`/`messageBody` could ever do is fold in a
  # same-named method reached later in THIS SAME already-rooted chain —
  # never one reached from a caller that never invoked
  # `SendMessageRequest.builder()` at all.
  #
  # 2F fix round 1 keeps that bound true where it would otherwise have
  # broken: chains now also fold their PRE-ROOT prefix (the `base` capture,
  # D02 §2's `fluent` style), and that half of the walk is NOT vouched for
  # by a root, so it consults owner-DECLARED steps only. An owner-free step
  # like these two is therefore still forward-only, exactly as this comment
  # describes.
  steps:
    - { method: queueUrl,    captures: { url: arg0 } }
    - { method: messageBody, captures: { body: arg0 } }
  # `Builder.build()` erases to `()Ljava/lang/Object;` (a generic builder
  # interface) — a `CHECKCAST` back to `SendMessageRequest` links the
  # erased result to `sendMessage`'s own argument (2C's CHECKCAST
  # transparency, verified live against the real fixture at this task's
  # checkpoint), through the same `terminal_via_argument` join OkHttp's own
  # `build()` → `newCall()` split already uses.
  terminal:
    - { method: build, terminal_via_argument: { owner: software.amazon.awssdk.services.sqs.SqsClient, method: sendMessage } }

# `queueUrl` captures the WHOLE queue URL, not a bare topic name — SQS's
# `SendMessageRequest.Builder#queueUrl` genuinely takes an absolute
# `https://sqs.<region>.amazonaws.com/<account>/<queue>` URL, an HTTP-style
# URL by AWS's own API design. The fluent engine's `url` capture always
# reads through `url_of` (never `channel_of`), so CP-2 splits it exactly as
# OkHttp's own absolute `Request.Builder#url` does — peer
# `sqs.<region>.amazonaws.com`, path `/<account>/<queue>` — a deliberate
# contrast with `single_call`'s `channel_arg` (spring-sqs-template.yml),
# which keeps a queue URL whole precisely BECAUSE it is a destination
# expression on that surface, never a URL to parse. Both are honest: this
# catalog declares `url`, never `channel` (fluent's own destination-shaped
# capture, added in 2E-prep Task 12 for `google-pubsub-publisher.yml`'s
# opaque topic identity) — `url` genuinely is what AWS's own builder API
# takes here, a real HTTP-style URL, not a destination expression.

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale). This catalog sorts first alphabetically among every shipped
# file, so it is the one that reaches most shared payload types first and its
# `wrappers` copy has to be self-sufficient (Task 10 fix round 1, finding 1).
# The nullability half of that finding is no longer this file's problem: the
# payload-type blocks are one declaration now (D02 §1b), so no catalog can
# reach a type first with rules of its own.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# D02's declared SLICE (F2 §3.8). Measured (`scripts/probes/w19_catalog_surface.md`):
# this catalog reads **1 of `SqsClient`'s 29** methods and **0 of `SqsAsyncClient`'s
# 28** at aws-sdk sqs 2.25.31.
#
# **The honest summary: one request type, in one direction, on one of the two clients.**
# `sendMessage(SendMessageRequest)` is the whole model. An SDK-level SQS consumer is
# invisible, and so is every module using the async client.
#
# These methods address the wire differently from every other catalog here: the queue
# URL is inside a `*Request` object rather than at an argument position, which is why
# the argument-0 test the enumeration applies to the Spring templates reports zero
# candidates for this file and a second, request-object test is what finds them.
#
# **One gap this slice CANNOT name, stated here because the list below would otherwise
# read as complete.** The enumeration decides read-versus-unread by method NAME, so an
# unread OVERLOAD of a name this catalog does read is invisible to it and cannot be
# declared below without failing the audit's staleness check. There is one that
# matters: every SQS operation ships a second form taking a builder lambda —
# `sendMessage(Consumer<SendMessageRequest.Builder>)`, descriptor
# `(Ljava/util/function/Consumer;)…` — and it is AWS's own documented idiom.
# `sqsClient.sendMessage(b -> b.queueUrl(q).messageBody(m))` derives NOTHING, because
# this catalog reaches `sendMessage` only as the terminal of a chain rooted at
# `SendMessageRequest.builder()` and a lambda is not that root. So the summary above
# is more precisely: one request type, in one direction, on one of the two clients,
# **built one particular way**.
slice:
  outside:
    - owner: software.amazon.awssdk.services.sqs.SqsClient
      method_names: [receiveMessage]
      why: >
        **The entire inbound direction**, and the largest single absence in this file.
        An SDK-level SQS consumer — `receiveMessage(ReceiveMessageRequest)` with the
        queue URL inside the request — derives nothing, so a module that only consumes
        looks like a module that does not touch SQS at all. G-43's headline.
    - owner: software.amazon.awssdk.services.sqs.SqsClient
      method_names: [sendMessageBatch]
      why: >
        The batch outbound form, a real send this catalog does not model. Its request
        carries MANY entries, so one call is many wire messages to one queue — a row
        shape this file's single-destination `sendMessage` rule does not express.
    - owner: software.amazon.awssdk.services.sqs.SqsClient
      method_names: [deleteMessage, deleteMessageBatch, changeMessageVisibility,
                changeMessageVisibilityBatch]
      why: >
        Consumption lifecycle: acknowledging, extending a lease, discarding. Real calls
        against a named queue, but each is only meaningful alongside a `receiveMessage`
        that is itself outside this slice. They would follow it in, not lead.
    - owner: software.amazon.awssdk.services.sqs.SqsClient
      method_names: [purgeQueue, createQueue, deleteQueue, getQueueUrl, getQueueAttributes,
                setQueueAttributes,
                listQueues, listQueuesPaginator, listQueueTags, tagQueue, untagQueue,
                addPermission, removePermission, listDeadLetterSourceQueues,
                listDeadLetterSourceQueuesPaginator, listMessageMoveTasks,
                startMessageMoveTask, cancelMessageMoveTask]
      why: >
        Control-plane administration — creating, describing, tagging and permissioning
        queues, and moving messages between them. These manage the wire rather than
        speak on it, so they are outside by design rather than by omission. Named
        individually anyway, so that a release adding a data-plane method to this
        client cannot arrive disguised as more administration.
    - owner: software.amazon.awssdk.services.sqs.SqsAsyncClient
      method_names: [sendMessage, sendMessageBatch, receiveMessage, deleteMessage,
                deleteMessageBatch, changeMessageVisibility, changeMessageVisibilityBatch,
                purgeQueue, createQueue, deleteQueue, getQueueUrl, getQueueAttributes,
                setQueueAttributes, listQueues, listQueuesPaginator, listQueueTags,
                tagQueue, untagQueue, addPermission, removePermission,
                listDeadLetterSourceQueues, listDeadLetterSourceQueuesPaginator,
                listMessageMoveTasks, startMessageMoveTask, cancelMessageMoveTask]
      why: >
        **The whole client, unread — including `sendMessage`, which this catalog DOES
        model on the synchronous client.** `SqsAsyncClient` is a second terminal owner
        that `matches.terminal` never names, so a module built on the async client
        derives nothing even for the one call this file exists to read. That asymmetry
        is the finding: the same code, written against the async client, is invisible.
