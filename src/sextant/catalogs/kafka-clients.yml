id: kafka-clients
displayName: Apache Kafka (raw KafkaProducer)
style: single_call
protocol: kafka
direction: outbound

# Its own detect coordinate, not the Spring starter's: the raw
# `org.apache.kafka.clients.producer.KafkaProducer` ships in `kafka-clients`
# itself, a dependency a Spring app pulls in transitively but a plain Kafka
# client app declares directly — this catalog must detect correctly either
# way, so it names its own artifact rather than `spring-kafka`'s.
detect:
  coordinates: ["org.apache.kafka:kafka-clients"]

measured:
  - { artifact: org.apache.kafka:kafka-clients, versions: ["3.6.2"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }

requires: [call_site, string_constants]

matches:
  # The interface a codebase declares its field as (§3.1). A call site's
  # owner is the DECLARED type, so a field typed by the interface carried
  # an owner this catalog did not name and matched nothing.
  # Measured: org.apache.kafka:kafka-clients 3.6.2 declares every method matched below
  # (scripts/probes/cp10_catalog_descriptors.md, which is the probe that ran).
  owner:
    - org.apache.kafka.clients.producer.KafkaProducer
    - org.apache.kafka.clients.producer.Producer
  # MEASURED, at kafka-clients 3.6.2 (CP-12 Q6,
  # `scripts/probes/cp12_sweep_round1b.md`): `KafkaProducer` declares exactly
  # TWO `send` overloads, `send(ProducerRecord)` and
  # `send(ProducerRecord, Callback)`.
  #
  # Only the first was declared here, on the checkpoint ruling "declare only
  # what is verified" applied to the FIXTURE's own call. That ruling is about
  # evidence and this was an application of it to the wrong evidence: the
  # framework's overload set is a fact about the framework, and
  # `producer.send(record, (m, e) -> …)` is the IDIOMATIC asynchronous producer
  # call, not an exotic one (`A-M6`). `_matching_method` filters candidates on
  # `row.get("arity") in (None, len(arguments))` BEFORE consulting descriptors,
  # so a two-argument call never saw the arity-1 row and derived NOTHING —
  # while `docs/COVERAGE.md` listed this catalog "✅ shipped" with no arity
  # qualification.
  #
  # Both rows read the destination the same way, because the callback overload
  # differs only in a TRAILING argument: the record is argument 0 in each.
  #
  # Each row states its own erased JVM `descriptor` (javap -p -s, kafka-clients
  # 3.6.2, recorded in `scripts/probes/cp10_catalog_descriptors.md`). Java
  # identifies a method by name and parameter types in order, never by argument
  # count (GUIDELINES §8.1's language rule), so a future sibling at either
  # arity derives NOTHING rather than being read through a `record_wrappers`
  # rule written for `ProducerRecord`. Re-running the CP-10 harness is the
  # check.
  methods:
    - { name: send, arity: 1,
        descriptor: "(Lorg/apache/kafka/clients/producer/ProducerRecord;)Ljava/util/concurrent/Future;",
        record_arg: 0 }
    - { name: send, arity: 2,
        descriptor: "(Lorg/apache/kafka/clients/producer/ProducerRecord;Lorg/apache/kafka/clients/producer/Callback;)Ljava/util/concurrent/Future;",
        record_arg: 0 }
  record_wrappers:
    - { type: org.apache.kafka.clients.producer.ProducerRecord,
        channel_ctor_arg: 0, payload_ctor_arg: last }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale).
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
