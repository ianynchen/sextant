id: spring-kafka
displayName: Spring Kafka (listeners)
style: annotation_driven
protocol: kafka
direction: inbound

detect:
  coordinates: ["org.springframework.kafka:spring-kafka"]

# `nested_annotation_args` (capability 9.16) because a REPEATED
# `@KafkaListener` reaches the class file only as the nested array inside
# its container (`OI-36`). Required rather than optional for
# `spring-scheduling.yml`'s reason: a scanner that cannot read a nested
# annotation must skip this catalog VISIBLY (M04, FR-17) instead of
# reporting the single-listener half of a module's surface and staying
# silent about the rest.
requires: [annotation_args, typed_signatures, nested_annotation_args]

matches:
  # No type-level gate: a listener method carries its own `@KafkaListener`
  # (or, on a class-level, polymorphic listener, `@KafkaHandler`) directly —
  # there is no marker interface or class annotation every listener shares.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [org.springframework.kafka.support.Acknowledgment] }
  mapping:
    # CHECKPOINT FACT: `@KafkaListener.topics` is always a `String[]` in
    # bytecode, even for a bare-string source declaration; `topicPattern` is
    # genuinely scalar. `topics`/`topicPattern` alias one another — a
    # listener declares only one — so first present wins.
    path_from: [topics, topicPattern]
    # CHECKPOINT FACT (class-level `@KafkaListener` + `@KafkaHandler`): a
    # class-level `@KafkaListener` carries no method of its own to map, so it
    # doubles as the `prefix_annotation` instead — its own `topics` value (the
    # known limitation: element 0 only, for a multi-topic class-level
    # listener) becomes the path prefix for every `@KafkaHandler` method the
    # class declares.
    prefix_from: [topics]
    # DELIBERATELY no `path_separator` (unlike every path-addressed catalog
    # here): the prefix above is a TOPIC NAME, and a topic name has no
    # segments to join. A `/` at this seam would invent a destination no
    # broker carries. The seam stays a bare concatenation, which for a
    # `@KafkaHandler` — carrying neither `topics` nor `topicPattern`, so an
    # empty suffix — is the class-level topic unchanged.
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    prefix_annotation: org.springframework.kafka.annotation.KafkaListener
    annotations:
      # A plain, method-level `@KafkaListener` — the ordinary listener shape.
      #
      # `container` names what javac writes when the annotation is used TWICE
      # on one declaration (`OI-36`). MEASURED, not remembered: CP-16 rows
      # 2a/2b read `@Repeatable(KafkaListeners.class)` off the annotation's own
      # class file at 3.1.4 and 4.1.1 alike, and rows 4a/4b show the
      # post-processor calling `KafkaListeners.value()` — so the framework
      # registers BOTH listeners while the class file carries no
      # `@KafkaListener` at all (JLS 9.7.5). Before this key both destinations
      # were dropped, silently, beside a single-listener neighbour that derived
      # normally.
      - { fqn: org.springframework.kafka.annotation.KafkaListener,
          container: org.springframework.kafka.annotation.KafkaListeners }
      # `@KafkaHandler` declares NO container, and the absence is a claim rather
      # than an omission: CP-16 row 2 measured `@Repeatable` on the listener
      # annotation only, and row 3 read `@KafkaHandler`'s whole declaration
      # (`isDefault(): boolean`, nothing else) without asking whether it is
      # repeatable. An unmeasured container is not one this file names (§8.1
      # rule 4); `docs/COVERAGE.md` carries the boundary.
      #
      # `@KafkaHandler` carries no path attribute of its own (path suffix
      # ''), and reaches a path only through the class-level prefix above —
      # the polymorphic, class-level `@KafkaListener` + `@KafkaHandler` shape.
      - { fqn: org.springframework.kafka.annotation.KafkaHandler }
  # D02 §2's `reply` block: `@SendTo` derives a second, OUTBOUND row per
  # listener whose handler carries it, and one path-NULL `unresolved` row for
  # a value-returning handler that declares no `@SendTo` at all (the reply
  # destination is resolved at runtime, off the record's own reply-topic
  # header — a `ReplyingKafkaTemplate` caller, say).
  reply:
    annotation: org.springframework.messaging.handler.annotation.SendTo
    destination_from: value
    payload: return

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order (Task 10
# fix round 1, finding 1). Endpoint-level ownership is a different question
# and is NOT this reason: `_owns` reads a row's own `catalog_id` (2E-prep
# design §1a), so a catalog's rules describe only the rows it derived
# itself.
# That finding was not hypothetical: it reproduced a `@NonNull` HTTP field
# silently reading as nullable once `spring-jms.yml` — sorted first among
# inbound catalogs — reached the same shared type with no nullability rules
# of its own. **Its nullability half is closed structurally** (D02 §1b): the
# rules are one declaration and no catalog holds a copy. It is quoted here
# because `wrappers` below is still a copy, and is still exposed to exactly
# the sort-order hazard it describes.
#
# The one broker envelope type below is added to this catalog only.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }
  - { type: org.apache.kafka.clients.consumer.ConsumerRecord, payload_arg: 1, semantics: envelope }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# CP-16 measured what this file's `CHECKPOINT FACT` comments above asserted
# without a version, and found them right: `topics()` is `String[]`,
# `topicPattern()` is `String`, `topicPartitions()` is `TopicPartition[]`, and
# the post-processor reads all three and feeds them to `setTopics`,
# `setTopicPattern` and `setTopicPartitions` — identically at 3.1.4 and 4.1.1.
# `@KafkaHandler` declares `isDefault(): boolean` and nothing else, so it
# really does reach a destination only through the class-level prefix.
#
# ONE THING CP-16 FOUND THAT THIS FILE DOES NOT HANDLE, both stated rather
# than encoded. `@KafkaListener` is `@Repeatable(KafkaListeners.class)` and the
# post-processor calls `KafkaListeners.value()`, so TWO listeners on one method
# are folded by javac into the container and this catalog — which names no
# container, a key `annotation_driven` does not have — sees no annotation at
# all and drops BOTH destinations (`OI-36`). And the post-processor finds the
# annotation through `AnnotatedElementUtils.findMergedAnnotation`, which
# carries no search-strategy constant, so what it searches is Spring's contract
# and stays unmeasured (`OI-37`'s boundary).
measured:
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4", "4.1.1"],
      identity: reported, by: scripts/probes/cp16_listener_destinations.md }
