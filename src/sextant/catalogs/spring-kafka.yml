id: spring-kafka
displayName: Spring Kafka (listeners)
style: annotation_driven
protocol: kafka
direction: inbound

detect:
  coordinates: ["org.springframework.kafka:spring-kafka"]

bean_model: spring

# `nested_annotation_args` (capability 9.16) because a REPEATED
# `@KafkaListener` reaches the class file only as the nested array inside
# its container (`OI-36`). Required rather than optional for
# `spring-scheduling.yml`'s reason: a scanner that cannot read a nested
# annotation must skip this catalog VISIBLY (M04, FR-17) instead of
# reporting the single-listener half of a module's surface and staying
# silent about the rest.
requires: [annotation_args, typed_signatures, nested_annotation_args]

matches:
  # No type-level gate: a listener method carries its own `@KafkaListener`
  # (or, on a class-level, polymorphic listener, `@KafkaHandler`) directly —
  # there is no marker interface or class annotation every listener shares.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [org.springframework.kafka.support.Acknowledgment] }
  # §2e's criterion applied to this framework: an attribute a PEER would care
  # about — whether and how a message reaches this handler — never a knob that
  # decides how this node runs once it has.
  #
  # MEASURED, CP-32 Q1a and Q6 (spring-kafka 3.1.4). `groupId()` is a `String`
  # defaulting to `""`, and `getEndpointGroupId` — the only method in the
  # post-processor that references it — takes it past `StringUtils.hasText`,
  # resolves it, and returns it as the endpoint's group. So `consumer_group`
  # names what the framework MEANS rather than what the attribute is called.
  # BEHAVIOURAL, not routing (§1f): every consumer group on a topic receives
  # every message, so the group qualifies the endpoint and never enters its
  # address.
  #
  # A `@KafkaHandler` row reads the CLASS-level `@KafkaListener`, which is the
  # registration that serves it — CP-32 Q1b: `@KafkaHandler` declares
  # `isDefault()` and nothing else, so it has no group of its own to state.
  # Where a method carries its own `@KafkaListener`, the handler's wins outright
  # and the class-level one is NOT unioned in
  # (`endpoint_attributes._uses_by_annotation`). That rule exists because of
  # this exact shape: `class_level: sibling` above says the two are independent
  # registrations, so a class on one group beside methods on another would
  # otherwise put both groups on one endpoint — one of them a group that
  # endpoint is not in.
  #
  # NO `absent_value`, and CP-32 Q6 is why that is right rather than merely
  # unmeasured: an absent `groupId` does not mean a measured default, it means
  # the resolved `id` (`idIsGroup()` defaults to `true`, offsets 28-54) or the
  # container factory's own group — a value that is not on this declaration at
  # all. Silence is the honest answer (D02 §2l).
  #
  # NOT RECORDED, and each is the criterion applied rather than an omission:
  # `concurrency`, `containerFactory`, `errorHandler`, `autoStartup`,
  # `clientIdPrefix`, `containerGroup`, `beanRef`, `batch`, `filter`,
  # `splitIterables`, `contentTypeConverter`, `info`, `containerPostProcessor`,
  # `properties` — 14 of the 20 elements CP-32 Q1a lists. Every one of them
  # decides how THIS node runs a listener a message has already reached, which
  # no peer can observe. `id` is not recorded either, for a different reason: it
  # names a container bean, not anything on the wire. That is 15; the remaining
  # five are each addressed elsewhere in this file rather than silently dropped
  # — `groupId` is the one recorded, `topics`, `topicPattern` and
  # `topicPartitions` are the ADDRESS's own question (`path_from` below, and the
  # CP-16 note at the foot of the file for the third), and `idIsGroup` is read
  # in the `absent_value` paragraph above.
  #
  # STATED BOUNDARY (CP-32 Q6): `resolveExpressionAsString` means a written
  # value may be a `${…}` placeholder — carried verbatim at `unresolved` — or a
  # `#{…}` SpEL expression, which this pass DROPS rather than publishes, because
  # a string carrying the symbol grammar's type marker reads as a symbol
  # reference (D02 §2l). A miss, never a wrong row.
  metadata_from:
    - { annotation: org.springframework.kafka.annotation.KafkaListener,
        attribute: groupId, kind: consumer_group }
  mapping:
    # CHECKPOINT FACT: `@KafkaListener.topics` is always a `String[]` in
    # bytecode, even for a bare-string source declaration; `topicPattern` is
    # genuinely scalar. `topics`/`topicPattern` alias one another — a
    # listener declares only one — so first present wins.
    path_from: [topics, topicPattern]
    # CHECKPOINT FACT (class-level `@KafkaListener` + `@KafkaHandler`): a
    # class-level `@KafkaListener` carries no method of its own to map, so it
    # doubles as the `prefix_annotation` instead — its own `topics` value (the
    # known limitation: element 0 only, for a multi-topic class-level
    # listener) becomes the path prefix for every `@KafkaHandler` method the
    # class declares.
    prefix_from: [topics]
    # DELIBERATELY no `path_separator` (unlike every path-addressed catalog
    # here): the prefix above is a TOPIC NAME, and a topic name has no
    # segments to join. A `/` at this seam would invent a destination no
    # broker carries. The seam stays a bare concatenation, which for a
    # `@KafkaHandler` — carrying neither `topics` nor `topicPattern`, so an
    # empty suffix — is the class-level topic unchanged.
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    # F2 §3.5's relationship conjunct. A class-level `@KafkaListener` and a
    # method-level one are TWO INDEPENDENT REGISTRATIONS, not a prefix and a
    # suffix — measured in `scripts/probes/w14_listener_registration.md`:
    # `@KafkaListener` is `@Target(TYPE, METHOD)`, declares `topics` at both
    # levels, and Kafka's registrar declares two paths (one taking a
    # `Class`, one a `Method`) with neither excluding the other. Composed, a
    # class on `orders` and a method on `payments` published `orderspayments` —
    # a destination no broker carries — at `resolved`.
    #
    # `@KafkaHandler` is unaffected and that is the point of the conjunct rather
    # than of a special case: it declares exactly one attribute, `isDefault()`,
    # and no destination, so it names none of its own and takes the class's
    # under either value. The rule distinguishes "this member names a
    # destination" from "this member names none", which is the distinction the
    # framework itself makes.
    class_level: sibling
    prefix_annotation: org.springframework.kafka.annotation.KafkaListener
    annotations:
      # A plain, method-level `@KafkaListener` — the ordinary listener shape.
      #
      # `container` names what javac writes when the annotation is used TWICE
      # on one declaration (`OI-36`). MEASURED, not remembered: CP-16 rows
      # 2a/2b read `@Repeatable(KafkaListeners.class)` off the annotation's own
      # class file at 3.1.4 and 4.1.1 alike, and rows 4a/4b show the
      # post-processor calling `KafkaListeners.value()` — so the framework
      # registers BOTH listeners while the class file carries no
      # `@KafkaListener` at all (JLS 9.7.5). Before this key both destinations
      # were dropped, silently, beside a single-listener neighbour that derived
      # normally.
      - { fqn: org.springframework.kafka.annotation.KafkaListener,
          container: org.springframework.kafka.annotation.KafkaListeners }
      # `@KafkaHandler` declares NO container, and that is now MEASURED rather
      # than an unmeasured silence. CP-16 row 2 asked `@Repeatable` of the
      # LISTENER annotation only and row 3 read `@KafkaHandler`'s declaration
      # without asking, so this entry deliberately claimed nothing (§8.1
      # rule 4); CP-17 rows 2i/2j then asked it directly and read
      # `@Target({METHOD, ANNOTATION_TYPE})` with NO `@Repeatable` at 3.1.4 and
      # 4.1.1 alike, and rows 3i/3j looked for an
      # `org.springframework.kafka.annotation.KafkaHandlers` in each jar and
      # found none. The absence below is a claim about the framework, and it is
      # the framework's own answer.
      #
      # `@KafkaHandler` carries no path attribute of its own (path suffix
      # ''), and reaches a path only through the class-level prefix above —
      # the polymorphic, class-level `@KafkaListener` + `@KafkaHandler` shape.
      - { fqn: org.springframework.kafka.annotation.KafkaHandler }
  # D02 §2's `reply` block: `@SendTo` derives a second, OUTBOUND row per
  # listener whose handler carries it, and one path-NULL `unresolved` row for
  # a value-returning handler that declares no `@SendTo` at all (the reply
  # destination is resolved at runtime, off the record's own reply-topic
  # header — a `ReplyingKafkaTemplate` caller, say).
  reply:
    annotation: org.springframework.messaging.handler.annotation.SendTo
    destination_from: value
    payload: return

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order (Task 10
# fix round 1, finding 1). Endpoint-level ownership is a different question
# and is NOT this reason: `_owns` reads a row's own `catalog_id` (2E-prep
# design §1a), so a catalog's rules describe only the rows it derived
# itself.
# That finding was not hypothetical: it reproduced a `@NonNull` HTTP field
# silently reading as nullable once `spring-jms.yml` — sorted first among
# inbound catalogs — reached the same shared type with no nullability rules
# of its own. **Its nullability half is closed structurally** (D02 §1b): the
# rules are one declaration and no catalog holds a copy. It is quoted here
# because `wrappers` below is still a copy, and is still exposed to exactly
# the sort-order hazard it describes.
#
# The one broker envelope type below is added to this catalog only.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }
  - { type: org.apache.kafka.clients.consumer.ConsumerRecord, payload_arg: 1, semantics: envelope }
  # `kafka-batch-generics` (spec 2026-09-18 §5a). CP-20 row 2: the post-processor reads
  # `batch()` through `StringUtils.hasText` as a gate and, only past it, through
  # `Boolean.parseBoolean` — case-insensitive, no placeholder resolution — before calling
  # `setBatchListener`; `parses_true` is exactly that predicate. CP-20 row 3: the batch
  # adapter's `List<ConsumerRecord<K,V>>` overload hands the handler one element PER
  # RECORD, so on a batch listener `List` is the container's envelope the same way
  # `ConsumerRecord` already is above, not the payload.
  #
  # `when`, not an unconditional row: `onBatch(List<OrderEvent> events)` above carries no
  # `batch` attribute at all and is an ordinary RECORD listener whose wire payload genuinely
  # IS the list — the shipped `test_a_batch_listeners_request_shape_is_an_array` pins that
  # row and would break if `List` unwrapped everywhere.
  #
  # Stated boundary, not built: `spring.kafka.listener.type=batch` is a container-factory
  # property (CP-20 row 4) that makes every listener under that factory a batch listener
  # with no annotation trace at all — a module relying on it publishes the array; COVERAGE
  # names the property rather than this file inventing a `config_join` read for it.
  #
  # `batch = "${listener.batch}"` (a placeholder) is NOT a boundary — it is AGREEMENT.
  # `StringUtils.hasText` sees a non-blank string and `Boolean.parseBoolean` of the literal
  # `"${listener.batch}"` is `false` exactly like ours (CP-20 row 2): Spring parses the same
  # unresolved text we do and reaches the same answer, a record listener either way.
  - { type: java.util.List, payload_arg: 0, semantics: envelope,
      when: { annotation_arg: { annotation: org.springframework.kafka.annotation.KafkaListener,
                                name: batch, parses_true: true } } }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# CP-16 measured what this file's `CHECKPOINT FACT` comments above asserted
# without a version, and found them right: `topics()` is `String[]`,
# `topicPattern()` is `String`, `topicPartitions()` is `TopicPartition[]`, and
# the post-processor reads all three and feeds them to `setTopics`,
# `setTopicPattern` and `setTopicPartitions` — identically at 3.1.4 and 4.1.1.
# `@KafkaHandler` declares `isDefault(): boolean` and nothing else, so it
# really does reach a destination only through the class-level prefix.
#
# ONE THING CP-16 FOUND THAT THIS FILE DOES NOT HANDLE, both stated rather
# than encoded. `@KafkaListener` is `@Repeatable(KafkaListeners.class)` and the
# post-processor calls `KafkaListeners.value()`, so TWO listeners on one method
# are folded by javac into the container and this catalog — which names no
# container, a key `annotation_driven` does not have — sees no annotation at
# all and drops BOTH destinations (`OI-36`). And the post-processor finds the
# annotation through `AnnotatedElementUtils.findMergedAnnotation`, which
# carries no search-strategy constant, so what it searches is Spring's contract
# and stays unmeasured (`OI-37`'s boundary).
measured:
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4", "4.1.1"],
      identity: reported, by: scripts/probes/cp16_listener_destinations.md }
  # A SECOND row rather than a widened first one: CP-16 measured the LISTENER
  # annotation and CP-17 measured the HANDLER, and a reader of a `by:` needs to
  # reach the probe that asked the question rather than the one that asked
  # another. Same artifact, same two versions, different question.
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4", "4.1.1"],
      identity: reported, by: scripts/probes/cp17_containers_and_class_level.md }
  # A THIRD row, same reason as the second: CP-20 asked the `batch` attribute's own
  # question (its type and default, the post-processor's parse, the batch adapter's
  # accepted shapes, the factory's independent config-driven trigger) — a reader chasing
  # the `wrappers` entry above needs to land on the probe that measured it, not on CP-16 or
  # CP-17, which never asked about `batch` at all.
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4", "4.1.1"],
      identity: reported, by: scripts/probes/cp20_spring_kafka_batch.md }
  # A FOURTH row, the same reason as the second and third: CP-32 asked what
  # `@KafkaListener` says ABOUT the endpoint rather than what names it — every
  # element with its own `AnnotationDefault`, and what `getEndpointGroupId` does
  # with `groupId`. A reader chasing the `metadata_from` entry above needs the
  # probe that asked that question. Bounded to 3.1.4: CP-32 opened one jar per
  # framework, so the upper version of the pair above is outside it.
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/cp32_listener_attributes.md }
