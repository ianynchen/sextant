id: spring-webclient
displayName: Spring WebClient
style: fluent
protocol: http
direction: outbound

detect:
  coordinates: ["org.springframework:spring-webflux"]

requires: [call_site, string_constants, chain_reconstruction]

matches:
  roots:
    - { owner: org.springframework.web.reactive.function.client.WebClient, method: get,    captures: { http_method: GET } }
    - { owner: org.springframework.web.reactive.function.client.WebClient, method: post,   captures: { http_method: POST } }
    - { owner: org.springframework.web.reactive.function.client.WebClient, method: put,    captures: { http_method: PUT } }
    - { owner: org.springframework.web.reactive.function.client.WebClient, method: delete, captures: { http_method: DELETE } }
    - { owner: org.springframework.web.reactive.function.client.WebClient, method: patch,  captures: { http_method: PATCH } }
  # `retrieve`/`exchange` mark the chain executable, not the walk's end:
  # `bodyToMono`/`bodyToFlux` follow `retrieve` in every real chain, so the
  # engine keeps folding step captures past a terminal (D02 §4, Task 11).
  steps:
    - { method: uri,        captures: { url: arg0 } }
    - { method: bodyValue,  captures: { body: arg0 } }
    - { method: body,       captures: { body: arg0 } }
    - { method: bodyToMono, captures: { response: arg0 } }
    - { method: bodyToFlux, captures: { response: arg0, response_is: array } }
  terminal: [retrieve, exchange]
  type_carriers: [org.springframework.core.ParameterizedTypeReference]

# Shared verbatim across every outbound catalog on purpose: the first catalog
# in sort order harvests+expands shape roots from every outbound row under
# its own serialization/known_types rules, so all four must describe wire
# shapes identically or the loser's routes get silently mis-described.
serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
