id: google-pubsub-subscriber
displayName: Google Cloud Pub/Sub (raw Subscriber/MessageReceiver)
style: interface_implementation
protocol: pubsub
direction: inbound

detect:
  coordinates: ["com.google.cloud:google-cloud-pubsub"]

requires: [call_site, string_constants, implemented_interfaces]

measured:
  - { artifact: com.google.cloud:google-cloud-pubsub, versions: ["1.127.3"],
      identity: reported, by: scripts/probes/w20_subscriber_activation.md }

matches:
  # D02 §2's `interface_implementation` style's own worked example, shipped
  # verbatim against the real fixture: `Subscriber.newBuilder(subscription,
  # receiver)` is the evidence — a `MessageReceiver` implementation never
  # handed to a matching registration derives nothing ("the registration is
  # the evidence"). *This sentence used to end "so this style needs no
  # execute-terminal". It did need one: construction subscribes to nothing, and
  # `started_by` below is the correction (`OI-64`).*
  interface: com.google.cloud.pubsub.v1.MessageReceiver
  handler_method: receiveMessage
  registration:
    owner: com.google.cloud.pubsub.v1.Subscriber
    method: newBuilder
    channel_arg: 0
    receiver_arg: 1
    # `OI-64`, and the comment above USED to say this style "needs no
    # execute-terminal". It did need one. `newBuilder(...).build()` is
    # CONSTRUCTION: `Subscriber` extends `AbstractApiService` and delivers nothing
    # until `startAsync()` runs (google-cloud-pubsub 1.127.3, measured by
    # `scripts/probes/w20_subscriber_activation/`). Without this conjunct a
    # subscriber built and never started derived a live inbound endpoint — and our
    # own fixture built two, started neither, and had both published as endpoints
    # the suite asserted were correct.
    #
    # **There is no `@Bean` exception, and GUIDELINES §8.6 used to claim one.** It
    # gave "a `@Bean` method returning a `Subscriber`" as a case where *Spring
    # starts a `Subscriber` bean* is a measured framework rule. Nobody had measured
    # it and it is false: `Subscriber` implements no Spring lifecycle interface
    # anywhere in its hierarchy, and spring-cloud-gcp-pubsub 5.1.2 ships no
    # `BeanPostProcessor` that starts one. Spring does not start arbitrary beans.
    #
    # A registration that is neither started here NOR returned derives nothing —
    # it provably subscribes to nothing. One that is RETURNED files a
    # `registration_activation` question instead, because chain reconstruction is
    # within-method only and a factory's caller may well start it.
    started_by:
      - { owner: com.google.cloud.pubsub.v1.Subscriber$Builder, method: build }
      - { owner: com.google.cloud.pubsub.v1.Subscriber, method: startAsync }
    # CHECKPOINT FACT: `ProjectSubscriptionName` (and its publisher-side
    # sibling `TopicName`) live in `com.google.pubsub.v1` — the generated
    # proto package, deliberately WITHOUT the `.cloud` segment the client
    # classes here (`Subscriber`, `MessageReceiver`) carry. `arg: 1` is the
    # subscription id; `arg: 0` (the project) is unread, same as
    # `google-pubsub-publisher.yml`'s own `TopicName.of` read.
    channel_via:
      - { owner: com.google.pubsub.v1.ProjectSubscriptionName, method: of, arg: 1 }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale). Neither rule
# actually applies to a row this style derives (`request_shape`/
# `response_shape` are always NULL, D02 §2's `interface_implementation` style
# — `PubsubMessage` is a declared no-shape envelope), carried only for the
# loader's own compatibility-block pin, the same discipline every shipped
# catalog keeps regardless of whether its own rows exercise every block.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
