id: pekko-pubsub-publish
displayName: Apache Pekko classic distributed pub-sub (Publish)
style: single_call
protocol: actor
direction: outbound

# Spec 2026-11-04 §3a. `Publish(topic, msg)` told to the mediator reaches every subscriber
# of the topic. The address is the topic, constructor argument 0. One file per message
# class (`pekko-pubsub-subscribe.yml` says why). A topic this module subscribes to itself
# is a hop, not an outbound row (§3d item 5, `resolve/self_calls.py`).
detect:
  coordinates: ["org.apache.pekko:pekko-cluster-tools_2.13", "org.apache.pekko:pekko-cluster-tools_3"]

# CP-57 read every descriptor below with `javap -c -p` on the jar the fixture resolves,
# and the jar's own manifest reports `Implementation-Version: 1.1.3`.
measured:
  - { artifact: org.apache.pekko:pekko-cluster-tools_2.13, versions: ["1.1.3"],
      identity: reported, by: scripts/probes/cp57_actors.md }

requires: [call_site, string_constants]

matches:
  owner: org.apache.pekko.cluster.pubsub.DistributedPubSubMediator$Publish
  methods:
    - { name: "<init>", arity: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;)V",
        channel_arg: 0 }
    # `sendOneMessageToEachGroup` at argument 2; the topic is still argument 0.
    - { name: "<init>", arity: 3,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Z)V",
        channel_arg: 0 }
