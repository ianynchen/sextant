id: spring-sqs-legacy
displayName: Spring Cloud AWS SQS (legacy listener spellings)
style: annotation_driven
protocol: sqs
direction: inbound

detect:
  coordinates: ["org.springframework.cloud:spring-cloud-aws-messaging",
                "io.awspring.cloud:spring-cloud-aws-messaging"]

# TWO rows, one per artifact, because this file is two generations of one
# annotation under two groupIds and a single row would file the evidence for
# both against whichever jar it named. Both versions are the ones the comment
# below already claimed; the difference is that a probe has now opened them.
measured:
  - { artifact: org.springframework.cloud:spring-cloud-aws-messaging,
      versions: ["2.2.6.RELEASE"],
      identity: reported, by: scripts/probes/cp17_containers_and_class_level.md }
  - { artifact: io.awspring.cloud:spring-cloud-aws-messaging, versions: ["2.4.4"],
      identity: reported, by: scripts/probes/cp17_containers_and_class_level.md }

bean_model: spring

requires: [annotation_args, typed_signatures]

matches:
  # No type-level gate: `@SqsListener` sits on the method directly — the
  # `spring-sqs.yml` shape, which this file is the older spellings of.
  #
  # A SEPARATE FILE rather than two more entries on `spring-sqs.yml`, because
  # the annotation moved package TWICE and each move came with its own
  # dependency coordinate: `detect.coordinates` names the module a catalog's
  # rule applies to, and the current and legacy artifacts are different
  # artifacts. Merging them would make one catalog claim to describe a
  # dependency it does not.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [org.springframework.cloud.aws.messaging.listener.Acknowledgment,
                             io.awspring.cloud.messaging.listener.Acknowledgment] }
  mapping:
    # MEASURED (CP-17 rows 1g/1h, 3g/3h and 5g/5h), replacing a `CHECKPOINT
    # FACT` comment that named both versions and cited no evidence: BOTH legacy
    # annotations declare exactly `value()` as `String[]` and a
    # `deletionPolicy()` of their own generation's enum type, and nothing else.
    # The queue names therefore arrive as an array on `value` in either
    # spelling — the same read `spring-sqs.yml` makes of the current
    # annotation, which is why this file is pure data and needs no engine word
    # of its own.
    #
    # Rows 5g/5h are the half that makes `value` the DESTINATION rather than
    # merely an attribute: `QueueMessageHandler` finds the annotation with
    # `AnnotationUtils.findAnnotation` and reads `value()` and
    # `deletionPolicy()` and no third attribute, in either generation. Rows
    # 3g/3h looked for a container-shaped sibling in each jar and found none,
    # and rows 2g/2h carry no `@Repeatable`, so this file's silence about a
    # container is a measured claim (§8.1 rule 4).
    #
    # The catalog was measured and found CORRECT. That is recorded rather than
    # passed over, because it is what makes the audit re-runnable instead of
    # repeated.
    path_from: [value]
    # No class-level listener shape in either legacy spelling — both are
    # `@Target(METHOD)` (CP-17 rows 2g/2h), so a type-level use is not merely
    # unmodelled but ILLEGAL, and there is no type-level annotation to prefix
    # from. Contrast `spring-sqs.yml`, whose 4.x annotation gained `TYPE` and a
    # handler sibling: this is the same framework's rule at a different
    # generation, not a different reading of one rule.
    prefix_from: []
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    prefix_annotation: null
    annotations:
      # Spring Cloud AWS 2.2 and earlier.
      - { fqn: org.springframework.cloud.aws.messaging.listener.annotation.SqsListener }
      # The awspring fork's 2.x line, before the 3.x `io.awspring.cloud.sqs`
      # rewrite that `spring-sqs.yml` describes.
      - { fqn: io.awspring.cloud.messaging.listener.annotation.SqsListener }

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order.
#
# No broker-specific wrapper is added here, `spring-sqs.yml`'s reason
# exactly: neither legacy `@SqsListener` declares an envelope-typed parameter
# the way Kafka's `ConsumerRecord<K, V>` does.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
