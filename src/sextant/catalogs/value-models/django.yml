# A READ OF A SETTING (ruling R3 of 2026-11-25, design note approved 2026-11-25; D02 §1f
# `key_reads`). `django.conf.settings` is one object, and an attribute read on it,
# `settings.X`, gives the value the selected settings module binds to its name `X` (probe,
# "Settings reads"). Which module is selected is the deployment's (`DJANGO_SETTINGS_MODULE`),
# so the read is the configuration key `X`, the expression `${X}`: the role of
# `@Value("${k}")` on the JVM and of a pydantic settings field. What each settings module of
# the repository sets for the key is `resolved_config`, per environment.
key_reads:
  - { owner: django.conf.settings, by: scripts/probes/django_rules.md }
