id: django
displayName: Django's view decorators, which hand the view on

# Each decorator below wraps a view and calls it with the request. The wrapped view keeps the
# function's allowed methods, so the decorated function is still the handler. Measured in
# `scripts/probes/django_rules.md`: "Function views" for the `require_*` decorators, `csrf_exempt`
# and `cache_page`, and "View decorators that hand the view on" for every entry. Each owner is
# the module that binds the name, as that section's table records it. A name that is a module
# variable (`csrf_protect`, `gzip_page`) names that module too, as `path` does.
#
# - Applied to the view (`d(view)`, the table's "decorator"): `result_calls: arg0`, calling the
#   result runs the view. `login_required(login_url=...)` and `staff_member_required(...)` with
#   keyword arguments alone write no argument 0, so they state nothing here and end the walk.
# - Called first, the result applied to the view (`d(args)(view)`, the table's "factory"):
#   `result_returns: arg0`, the decorator's result stands for the view.

returns_argument:
  - { owner: django.views.decorators.http, method: require_GET, result_calls: arg0, by: scripts/probes/django_rules.md }
