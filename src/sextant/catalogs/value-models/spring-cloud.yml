id: spring-cloud
displayName: Service discovery — a lookup's identity, and the calls that preserve it

# WHAT THIS FILE IS, and why these three entries are one claim.
#
# D02 §1f, and `OI-142`. A module that resolves its own peer addresses writes this:
#
#     discoveryClient.getInstances("customers-service").get(0).getUri() + "/owners"
#
# and its class file contains no URL at all — measured on
# `spring-petclinic-genai-service`, zero occurrences of `http://`. The real address is
# produced by a registry while the program runs, and it is not what an architecture
# document wants anyway: a service NAME is stable, while the host behind it changes every
# deployment.
#
# So the identity of the thing being called is readable, but it is three calls back from
# the position a catalog asks about. `getInstances` names it at argument 0 — the ordinary
# form. The two after it name it nowhere: `List.get(int)`'s argument is an INDEX, and
# `getUri()` takes nothing at all (CP-36 reads both descriptors). What both say instead is
# "I hand back something that is still about the same service", which is `from_receiver`.
#
# THE ONE ENTRY THAT NEEDS AN ARGUMENT, because it is read over every list in the estate:
# `java.util.List#get`. For a topic list it must NOT propagate — `List.of("orders",
# "audit").get(0)` would otherwise answer both topics for one element, a wrong answer at
# `resolved`, which is the single failure spec 2026-09-22 §7 says this whole family of work
# risks.
#
# What keeps it from doing that is not a special case for this file; it is a property the
# identity table already has, and the walk checks it at resolve time:
#
#   * a SINGLE-VALUED identity resolves to one answer and propagates. An element of a
#     collection identified as ONE thing is that thing.
#   * an ENUMERATING identity (`arg: all_strings`) resolves to several and is refused. An
#     element of a collection identified as MANY things is one of them, and which one is
#     not knowable from the facts.
#
# MEASURED over the shipped table, 23 entries: three are enumerating — `List.of`,
# `Arrays.asList`, `Subscriptions.topics`, which are exactly the topic lists — and of the
# twenty single-valued ones exactly ONE produces a collection, `Collections.singletonList`
# at `arg: 0`. And `singletonList("x").get(0)` IS `x`, so propagating is correct there too.
# The gate is the precise line between the entries that must not propagate and every other
# entry, rather than caution about a case nobody has.
#
# This file is NOT a catalog and lives outside the `*.yml` glob that loads them: it
# declares no `style`, no `matches` and no boundary.

identified_by:
  # The lookup itself: `getInstances(String)` returns `List<ServiceInstance>` (CP-36 row 1),
  # so the value it produces is the instances OF the service named at argument 0.
  - { owner: org.springframework.cloud.client.discovery.DiscoveryClient, method: getInstances,
      arg: 0, by: scripts/probes/cp36_discovery_client.md }

  # Element access. Every instance of a service IS that service, so an element of this list
  # stands for what the list stands for. `descriptor` pins the single-argument accessor
  # rather than matching any `get` on any owner.
  - { owner: java.util.List, method: get, from_receiver: true,
      descriptor: "(I)Ljava/lang/Object;",
      by: scripts/probes/cp36_discovery_client.md }

  # The accessor. `getUri()` takes nothing (CP-36 row 3), so no argument could name this.
  # The URI of an instance of a service addresses that service.
  #
  # CP-36 row 2 also measures what `createUri` BUILDS — `%s://%s:%s`, scheme/host/port and
  # no path — which is why the literal tail of a concatenation around this call is the whole
  # path rather than a suffix of one. Bounded to the default implementation: `getUri()` is
  # abstract on the interface, so a custom `ServiceInstance` may return something else.
  - { owner: org.springframework.cloud.client.ServiceInstance, method: getUri,
      from_receiver: true, by: scripts/probes/cp36_discovery_client.md }
