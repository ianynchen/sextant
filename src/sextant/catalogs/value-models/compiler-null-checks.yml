id: compiler-null-checks
displayName: Calls a compiler inserts that take a value without being a hand-off of it

# WHAT THIS FILE IS. The value walk's `escapes` window (spec 2026-11-02, rules 1-3) reads
# every call that takes a value as a HAND-OFF: code that might change it. A call into code
# this module does not have ends the path at `escapes`.
#
# `not_hand_offs` names the calls that are not hand-offs at all: an OWNER, every call to it,
# or — with `methods` (ruled 2026-11-03) — the named methods of that owner, every overload of
# each name. A call one names is read as taking the value without changing it.
#
# RULED BY THE USER, 2026-11-02 (per-path truth, fix round 1, review M2): Kotlin's
# compiler-inserted null checks are NOT a hand-off. `kotlin.jvm.internal.Intrinsics` is the
# class the Kotlin compiler calls — `checkNotNullParameter(p, "p")` at the top of every
# non-private function, `checkNotNullExpressionValue(v, "…")` after a platform call,
# `checkNotNull`, `checkParameterIsNotNull`, `checkExpressionValueIsNotNull`. The COMPILER
# writes these, not the author, and each only checks for null and throws; none can change
# the value it is handed. Read as hand-offs, every Kotlin function's parameters and every
# platform-typed local became `escapes`.
#
# Kept here rather than in the walk because it names a language (ARCHITECTURE §10): the
# walk reads the owners it is handed and names none.

not_hand_offs:
  - owner: kotlin.jvm.internal.Intrinsics
    by: docs/superpowers/specs/2026-11-02-per-path-truth-design.md
  # RULED BY THE USER, 2026-11-03 (per-path truth, item 2 fix round 1, C3; OI-262, option B):
  # the JDK's null checks are NOT a hand-off either. Each only tests its argument for null and
  # returns it, a default, or a boolean, or throws; none calls a method on the value. Measured
  # with `javap -public java.util.Objects` on JDK 21.0.13:
  #   public static <T> T requireNonNull(T);
  #   public static <T> T requireNonNull(T, java.lang.String);
  #   public static <T> T requireNonNull(T, java.util.function.Supplier<java.lang.String>);
  #   public static <T> T requireNonNullElse(T, T);
  #   public static boolean isNull(java.lang.Object);
  #   public static boolean nonNull(java.lang.Object);
  # The class's other methods are left out on purpose: `equals`, `deepEquals`, `hashCode`,
  # `hash`, `toString` and `compare` call the value's own methods (or a comparator), which may
  # be the module's code, and `requireNonNullElseGet` calls a supplier. No other JDK method with
  # this contract was found (`jdk.internal.util.Preconditions` is not callable from module code).
  - owner: java.util.Objects
    methods: [requireNonNull, requireNonNullElse, isNull, nonNull]
    by: docs/superpowers/specs/2026-11-02-per-path-truth-design.md
  # kotlinc 2.4's coroutine state machine: before a suspension point, a spilled variable the code
  # no longer needs is written back into its continuation slot as
  # `L$n = SpillingKt.nullOutSpilledVariable(x)` so the object can be collected. The COMPILER
  # writes the call, not the author; its body is `aconst_null; areturn` (CP-59 finding 21,
  # `javap -c` on kotlin-stdlib 2.4.20): it takes the value, never calls anything on it, and
  # hands back null. An instance of the 2026-11-02 ruling above (a compiler-inserted call that
  # cannot change the value it is handed). Read as a hand-off, every value spilled across a
  # suspension became `escapes`; read as where an object is made, the object walk named this
  # call as a coroutine's channel.
  - owner: kotlin.coroutines.jvm.internal.SpillingKt
    methods: [nullOutSpilledVariable]
    by: scripts/probes/cp59_dispatch.md
