id: spring-sqs
displayName: Spring Cloud AWS SQS (listeners)
style: annotation_driven
protocol: sqs
direction: inbound

detect:
  coordinates: ["io.awspring.cloud:spring-cloud-aws-sqs"]

measured:
  - { artifact: io.awspring.cloud:spring-cloud-aws-sqs, versions: ["3.1.1"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }
  # A SECOND row rather than a widened first one: CP-12 measured the `@AliasFor`
  # pair and CP-17 measured the class-level shape, and a reader of a `by:` needs
  # to reach the probe that asked the question, not the one that asked another.
  - { artifact: io.awspring.cloud:spring-cloud-aws-sqs, versions: ["3.1.1", "4.1.1"],
      identity: reported, by: scripts/probes/cp17_containers_and_class_level.md }

requires: [annotation_args, typed_signatures]

matches:
  # No type-level gate: a listener method carries its own `@SqsListener` (or, on
  # a class-level, polymorphic listener, `@SqsHandler`) directly — there is no
  # marker interface or class annotation every listener shares.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated,
                  excludes: [io.awspring.cloud.sqs.listener.acknowledgement.Acknowledgement] }
  mapping:
    # MEASURED, at spring-cloud-aws-sqs 3.1.1 (CP-12 Q10,
    # `scripts/probes/cp12_sweep_round1b.md`), replacing a checkpoint note:
    # `io.awspring.cloud.sqs.annotation.SqsListener` declares BOTH
    # `String[] value()` and `String[] queueNames()`, and `queueNames` carries
    # `RuntimeVisibleAnnotations:
    # org.springframework.core.annotation.AliasFor(value="value")`. They are one
    # attribute under two spellings — the same shape `jakarta-servlet.yml`
    # handles with `args: [urlPatterns, value]` and `spring-web.yml` with
    # `path_from: [value, path]` — and `queueNames` is the spelling AWS's own
    # documentation uses.
    #
    # This list held `value` alone (`A-M8`), so a `queueNames` listener read as
    # having no destination, the composed address was empty, and the
    # addresses-nothing gate withheld the row: the listener was ABSENT from the
    # export, not present with a blank address. Both attributes are still
    # `String[]` in bytecode even for a bare-string source declaration, which is
    # what the checkpoint note said and remains true.
    #
    # First-alias-wins is `value`, and that mirrors `@AliasFor`: Spring refuses
    # an annotation setting both to different values, so the two can never
    # disagree on a declaration the framework would accept.
    #
    # CP-17 rows 5e/5f and 6e/6f confirm the read at a SECOND version and show
    # why only one spelling appears in the disassembly: the post-processor calls
    # `SqsListener.value()` and never `queueNames()`, because the merge happens
    # inside `AnnotatedElementUtils.findMergedAnnotation` and `value` is the
    # spelling that survives it. That is the `@AliasFor` working, not a third
    # rule.
    path_from: [value, queueNames]
    # CLASS-LEVEL `@SqsListener` + `@SqsHandler`, the `spring-kafka.yml` shape
    # one framework over. This file said "No class-level listener shape for
    # SQS", which was true at 3.1.1 and FALSE at 4.1.1 (`OI-40`), and the
    # framework's own bytes are what say so — CP-17 rows 2e/2f read `@Target`
    # widening from `{METHOD}` to `{METHOD, TYPE}`, rows 4e/4f read
    # `io.awspring.cloud.sqs.annotation.SqsHandler` as ABSENT FROM THE JAR at
    # 3.1.1 and declaring `isDefault(): boolean` at 4.1.1, and row 6f is the
    # branch itself:
    #
    #   A classListener = findMergedAnnotation(targetClass, getAnnotationClass());
    #   if (hasClassLevelListeners) { Set<Method> handlerMethods = getHandlerMethods(targetClass);
    #     createAndConfigureMultiMethodEndpoint(bean, targetClass, classListener, …); }
    #
    # — against row 6e, the same method at 3.1.1, which has no `classListener`
    # at all. The endpoint takes its queue names from the CLASS-level
    # annotation's own `value()`, so the class-level listener doubles as the
    # prefix for every `@SqsHandler` the class declares (the known limitation
    # `spring-kafka.yml` states: element 0 only, for a multi-queue class-level
    # listener).
    #
    # NO version constraint, and the plan's rule is why: code built against
    # 3.1.1 cannot carry an annotation that artifact does not declare, and a
    # class-level `@SqsListener` is illegal there under `@Target(METHOD)`. The
    # entries below are inert against a 3.x module rather than wrong about one.
    prefix_from: [value, queueNames]
    # DELIBERATELY no `path_separator`, `spring-kafka.yml`'s reason exactly: the
    # prefix above is a QUEUE NAME, and a queue name has no segments to join. A
    # `/` at this seam would invent a destination no broker carries. An
    # `@SqsHandler` — carrying no queue attribute at all, so an empty suffix —
    # is then the class-level queue unchanged.
    method_from: method
    # Verbless (D02 §2, amended): a listener declares no HTTP-style verb.
    all_methods: []
    prefix_annotation: io.awspring.cloud.sqs.annotation.SqsListener
    annotations:
      # A plain, method-level `@SqsListener` — the ordinary listener shape.
      #
      # It declares NO container, and the absence is a measured claim rather
      # than an omission: CP-17 rows 2e/2f read no `@Repeatable` on it at either
      # version, and rows 3e/3f looked for an `io.awspring.cloud.sqs.annotation
      # .SqsListeners` and found none (§8.1 rule 4).
      - { fqn: io.awspring.cloud.sqs.annotation.SqsListener }
      # `@SqsHandler` carries no queue attribute of its own (path suffix ''),
      # and reaches a destination only through the class-level prefix above.
      # CP-17 rows 4f and 5f: it declares `isDefault(): boolean` and nothing
      # else — the `@KafkaHandler`/`@RabbitHandler` declaration exactly — and
      # the 4.1.1 post-processor references the class and calls `isDefault()`.
      #
      # It declares NO container, and that is its OWN measurement rather than
      # the listener's: rows 2n and 3n — added to CP-17 for exactly this
      # question — read `@Target(METHOD)` with no `@Repeatable` on it, and found
      # no `io.awspring.cloud.sqs.annotation.SqsHandlers` in the jar.
      - { fqn: io.awspring.cloud.sqs.annotation.SqsHandler }

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order (Task 10
# fix round 1, finding 1). Endpoint-level ownership is a different question
# and is NOT this reason: `_owns` reads a row's own `catalog_id` (2E-prep
# design §1a), so a catalog's rules describe only the rows it derived
# itself.
#
# No broker-specific wrapper is added here: `@SqsListener` never declares an
# envelope-typed parameter the way Kafka's `ConsumerRecord<K, V>` does.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
