id: pekko-cluster-sharding
displayName: Apache Pekko Cluster Sharding (typed entity types)
style: single_call
protocol: actor
direction: inbound
# Whose registrations serve this file's keys (spec 2026-11-05 §2): a key carries a class
# (`class_arg` on the producer's `channel_via` entries), and its inbound row's handlers are
# the registrations of the `pekko-actors` mechanism, declared by `pekko-actor-handlers.yml`.
dispatch: { mechanism: pekko-actors }

# Spec 2026-11-04 §3a. A sharded entity type is the name its entities are reached by across
# the cluster: `init` serves it, `entityRefFor` calls it. The address is the type key's
# name, `EntityTypeKey.create(Class, String)` argument 1.
detect:
  coordinates: ["org.apache.pekko:pekko-cluster-sharding-typed_2.13", "org.apache.pekko:pekko-cluster-sharding-typed_3"]

# CP-57 read every descriptor below with `javap -c -p` on the jars the fixture resolves,
# and each jar's own manifest reports `Implementation-Version: 1.1.3`.
measured:
  - { artifact: org.apache.pekko:pekko-cluster-sharding-typed_2.13, versions: ["1.1.3"],
      identity: reported, by: scripts/probes/cp57_actors.md }

requires: [call_site, string_constants]

matches:
  # MEASURED (CP-57 finding 8): `init(Entity)` and `entityRefFor(EntityTypeKey, String)`
  # are methods of the `javadsl.ClusterSharding` the module holds; `Entity.of` and
  # `EntityTypeKey.create` are static factories building a new object.
  owner: org.apache.pekko.cluster.sharding.typed.javadsl.ClusterSharding
  methods:
    # `init(Entity.of(KEY, factory))`: the name is two steps away. `Entity.of` argument 0
    # is the type key, which is read (through a static final field's `<clinit>` where it
    # is held in one) to `EntityTypeKey.create`, whose argument 1 is the name. Only the
    # first step is declared here: the type gate checks a row's IMMEDIATE producer against
    # its descriptor, and `EntityTypeKey.create` returns no `Entity`. The second step is
    # the `entityRefFor` rows' entry below, which the loader hoists into the one identity
    # table every row's walk reads. That entry also names `class_arg`: `EntityTypeKey.create`
    # argument 0, the class literal of the commands the entity takes, read from that same call
    # in the same walk (spec 2026-11-05 §2), names this row's handlers (spec 2026-11-04 §3d
    # item 6). A fact about the producer, so it sits on the producer's entry, hoisted.
    - { name: init, arity: 1,
        descriptor: "(Lorg/apache/pekko/cluster/sharding/typed/javadsl/Entity;)Lorg/apache/pekko/actor/typed/ActorRef;",
        channel_arg: 0,
        channel_via: [{ owner: org.apache.pekko.cluster.sharding.typed.javadsl.Entity, method: of, arg: 0 }] }
    # `entityRefFor` sends to an entity of the type: outbound. A type this module inits
    # itself is a hop, not an outbound row (§3d item 5, `resolve/self_calls.py`). The
    # 3-argument form names a data centre as well; the type is still argument 0.
    - { name: entityRefFor, arity: 2, direction: outbound,
        descriptor: "(Lorg/apache/pekko/cluster/sharding/typed/javadsl/EntityTypeKey;Ljava/lang/String;)Lorg/apache/pekko/cluster/sharding/typed/javadsl/EntityRef;",
        channel_arg: 0,
        channel_via: [{ owner: org.apache.pekko.cluster.sharding.typed.javadsl.EntityTypeKey, method: create, arg: 1, class_arg: 0 }] }
    - { name: entityRefFor, arity: 3, direction: outbound,
        descriptor: "(Lorg/apache/pekko/cluster/sharding/typed/javadsl/EntityTypeKey;Ljava/lang/String;Ljava/lang/String;)Lorg/apache/pekko/cluster/sharding/typed/javadsl/EntityRef;",
        channel_arg: 0,
        channel_via: [{ owner: org.apache.pekko.cluster.sharding.typed.javadsl.EntityTypeKey, method: create, arg: 1, class_arg: 0 }] }
