id: google-pubsub-client
displayName: Google Cloud Pub/Sub (field-held Publisher)
style: single_call
protocol: pubsub
direction: outbound

detect:
  coordinates: ["com.google.cloud:google-cloud-pubsub"]

measured:
  - { artifact: com.google.cloud:google-cloud-pubsub, versions: ["1.129.3"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }

requires: [call_site, string_constants]

matches:
  owner: com.google.cloud.pubsub.v1.Publisher
  # CHECKPOINT FACT / spec §4 ruling: NO channel is declared here — a
  # field-held `Publisher` was already bound to its topic wherever it was
  # constructed (config, a `@Bean`, or the co-located
  # `google-pubsub-publisher.yml` chain resolves that case), and `publish`'s
  # own call site here carries no destination argument at all. Declaring
  # this row anyway — rather than leaving `publish` unmatched — derives an
  # honest path-NULL unresolved row instead of silence: without it, a
  # config-built `Publisher` field would never appear as an endpoint at
  # all (a fluent chain that never reaches its own terminal derives
  # nothing, D02 §2's `fluent` style's own "the true answer", and a
  # field-held `Publisher`'s own construction is never itself a chain this
  # catalog's fluent sibling
  # could ever walk).
  #
  # EXPECTED DUPLICATE (spec §4's duplicate-row ruling — asserted
  # deliberately at freeze time, not a bug found later): the SAME
  # co-located `Publisher.newBuilder(...).build().publish(message)` call
  # `google-pubsub-publisher.yml` resolves ALSO matches this row — a
  # `single_call` catalog has no chain-reconstruction capability and cannot
  # know which specific call produced its own receiver. *This said "by
  # name+arity alone" until the 2O documentation sweep (`A-Mi14`); the row
  # carries a `descriptor` too, and the duplicate is unaffected by that,
  # because the descriptor pins WHICH overload matches and says nothing about
  # which receiver produced the call.* One resolved fluent row plus one
  # unresolved single_call row
  # stand side by side for that one call, exactly the pairing
  # `spring-kafka-message.yml`/`spring-kafka-template.yml`'s own
  # `record_arg` row keeps for `KafkaTemplate.send(Message)` — "unresolved
  # is an answer, never an omission" outranks tidiness, and cross-catalog
  # suppression is deliberately not this catalog's concern (spec §4).
  #
  # The row states its own erased JVM `descriptor` even though `publish` has
  # exactly ONE overload at this arity (javap -p -s, google-cloud-pubsub
  # 1.129.3, recorded in `scripts/probes/cp10_catalog_descriptors.md`). Java
  # identifies a method by name and parameter types in order, never by argument
  # count (GUIDELINES §8.1's language rule), and a unique overload's descriptor
  # can only ever equal what a matching call carries — so today's answer is
  # unchanged, and the day the library adds a second one-argument `publish` that
  # new overload derives NOTHING instead of silently reading this row's
  # `body_arg: 0`. Re-running the CP-10 harness is the check.
  methods:
    - { name: publish, arity: 1,
        descriptor: "(Lcom/google/pubsub/v1/PubsubMessage;)Lcom/google/api/core/ApiFuture;",
        body_arg: 0 }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale).
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
