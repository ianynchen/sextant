id: quartz
displayName: Quartz scheduler (triggers built in code)
style: scheduled_chain

# NO `protocol` AND NO `direction`, on the same terms as `spring-scheduling.yml`: this
# catalog derives into `scheduled_work`, and work started on a clock speaks no wire.
# `resolve/endpoints.py` refuses either key on a catalog that mints no endpoint rows.

detect:
  coordinates: ["org.quartz-scheduler:quartz"]

# Spring injects a `@Bean` method's parameters: `auditTrigger(JobDetail auditDetail)` is
# handed the declared `JobDetail` bean the container picks for that parameter (spec §3c,
# `forJob(JobDetail)` below), read by the bean model's own rungs (`resolve/beans.py`).
bean_model: spring

# The trigger chain is read off call sites, linked `result -> receiver` (D00 §5), with
# its constant arguments: the `fluent` style's own three.
requires: [call_site, string_constants, chain_reconstruction]

matches:
  # ONE ENTRY PER `newTrigger()` ROOT (spec 2026-10-28-quartz-design §3a, ruling 3), walked
  # by the chain walk every builder catalog uses (`shapes/chains.py`): `roots`, `steps` and
  # `terminal` are that walk's own words. `TriggerBuilder` has exactly one static factory
  # (CP-55 row 2). A trigger rebuilt from an existing one — `trigger.getTriggerBuilder()`,
  # an instance call for `rescheduleJob` — is the same trigger with a new schedule, and is
  # not a root here on purpose.
  roots:
    - { owner: org.quartz.TriggerBuilder, method: newTrigger }
  steps:
    # The trigger's key (ruling 5). `withIdentity(name)`, `withIdentity(name, group)` and
    # `withIdentity(TriggerKey)` all match; the third captures an object, which is no
    # constant, so its name stays NULL. Owner-gated: `JobBuilder` has a `withIdentity` too.
    - owner: org.quartz.TriggerBuilder
      method: withIdentity
      captures: { name: arg0, group: arg1 }
    # The schedule builder is the ARGUMENT of `withSchedule`, a nested chain of its own
    # (spec §2b), followed from here by the value walk.
    - owner: org.quartz.TriggerBuilder
      method: withSchedule
      captures: { schedule: arg0 }
  terminal: [build]

  # THE JOB A TRIGGER RUNS (spec §3c), found from whatever pairs them, as Quartz pairs them.
  #
  # The job's chain is the same chain walk: `newJob(Class)` is its root (CP-55 row 1), and
  # the class argument is the job class. A `JobBuilder` key step reads like the trigger's
  # own, owner-gated for the same reason, and a key written with no group is in
  # `default_group` as well (`JobKey` is a `Key`).
  job_root: { owner: org.quartz.JobBuilder, method: newJob, class_arg: arg0 }
  job_identity_step:
    owner: org.quartz.JobBuilder
    method: withIdentity
    captures: { name: arg0, group: arg1 }

  # `TriggerBuilder.forJob`, each overload a step of the trigger chain (by descriptor: the
  # four take different things). Every one sets the trigger's one `jobKey`:
  # - a `JobDetail`: the job is the value the walk finds there, a `@Bean` the container
  #   injects included;
  # - a name and a group, or a name alone in `default_group`: the `JobBuilder` chain
  #   anywhere in the module whose key is that key;
  # - a `JobKey`: the key the walk finds that key built from (`job_key` below).
  for_job:
    - owner: org.quartz.TriggerBuilder
      method: forJob
      descriptor: "(Lorg/quartz/JobDetail;)Lorg/quartz/TriggerBuilder;"
      captures: { job_detail: arg0 }
    - owner: org.quartz.TriggerBuilder
      method: forJob
      descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lorg/quartz/TriggerBuilder;"
      captures: { job_name: arg0, job_group: arg1 }
    - owner: org.quartz.TriggerBuilder
      method: forJob
      descriptor: "(Ljava/lang/String;)Lorg/quartz/TriggerBuilder;"
      captures: { job_name: arg0 }
    - owner: org.quartz.TriggerBuilder
      method: forJob
      descriptor: "(Lorg/quartz/JobKey;)Lorg/quartz/TriggerBuilder;"
      captures: { job_key: arg0 }

  # The calls a `JobKey` is built by, with the argument each half of the key is.
  job_key:
    - { owner: org.quartz.JobKey, method: jobKey, name: arg0, group: arg1 }
    - { owner: org.quartz.JobKey, method: <init>, name: arg0, group: arg1 }

  # The calls that pair a built job with a built trigger: the execute-join
  # (`terminal_via_argument`, D02), whose built value is the trigger, with the argument the
  # job is in. `scheduleJob(JobDetail, Trigger)` sets the trigger's job to that job. The
  # collection forms hand over SETS, and the walk reaches a trigger through one only where
  # it reaches the set's elements: a set made in a jar (`Set.of(trigger)`, dolphinscheduler's
  # `Sets.newHashSet`) is `external`, and no job is found from that call.
  pairing:
    - owner: org.quartz.Scheduler
      method: scheduleJob
      descriptor: "(Lorg/quartz/JobDetail;Lorg/quartz/Trigger;)Ljava/util/Date;"
      job: arg0
      trigger: arg1
    - owner: org.quartz.Scheduler
      method: scheduleJob
      descriptor: "(Lorg/quartz/JobDetail;Ljava/util/Set;Z)V"
      job: arg0
      trigger: arg1
    - owner: org.quartz.Scheduler
      method: scheduleJobs
      descriptor: "(Ljava/util/Map;Z)V"
      job: arg0
      trigger: arg0

  # THE HANDLER: what Quartz calls on an instance of the job class, `Job.execute`, and
  # whichever body the JVM's dispatch rule picks for that class (`resolve/dispatch.py`).
  # `returns` with `parameters`, because the JVM identifies a method by its whole descriptor.
  entry_method: { name: execute, parameters: [org.quartz.JobExecutionContext], returns: void }

  # A framework TEMPLATE in a jar that calls a subclass method, in the `supertype` +
  # `dispatch` vocabulary of `jakarta-servlet.yml`: where the body dispatch picks is
  # `QuartzJobBean.execute`, unread, it calls the subclass's `executeInternal`, which is
  # then the handler, resolved the same way. Any other unread body gives no handler.
  supertype_dispatch:
    - supertype: org.springframework.scheduling.quartz.QuartzJobBean
      calls: { name: executeInternal, parameters: [org.quartz.JobExecutionContext], returns: void }

  # The group a key written without one lands in: `Key.DEFAULT_GROUP`, declared once on
  # `org.quartz.utils.Key` and substituted by `Key`'s constructor for a null group
  # (CP-55 rows 10-18).
  default_group: DEFAULT

  # The schedule KIND, by the schedule builder's own type (spec §3b): the owner of the
  # builder chain's root, or — where the walk ends before a root — the type the call that
  # produced the builder is declared to return. The four builders and their factories are
  # CP-55 rows 3-6.
  kinds:
    org.quartz.CronScheduleBuilder: cron
    org.quartz.SimpleScheduleBuilder: simple
    org.quartz.CalendarIntervalScheduleBuilder: calendarInterval
    org.quartz.DailyTimeIntervalScheduleBuilder: dailyTimeInterval

  # The one root whose expression is its string argument, verbatim, as `@Scheduled(cron =
  # …)` is recorded. By descriptor (CP-55 row 3): `cronSchedule(CronExpression)` takes an
  # object, and is written as its chain like every other root.
  literal_expression:
    owner: org.quartz.CronScheduleBuilder
    method: cronSchedule
    descriptor: "(Ljava/lang/String;)Lorg/quartz/CronScheduleBuilder;"
    arg: 0

  # A cron handed in as a Spring `@Value` field or parameter reads as its `${…}` (the field
  # ladder, `shapes/arguments.py`), the way every outbound catalog reads a configured address.
  field_sources:
    value_annotation: org.springframework.beans.factory.annotation.Value
    properties_annotation: org.springframework.boot.context.properties.ConfigurationProperties
    prefix_from: prefix
    getter_prefixes: [get, is]

measured:
  - { artifact: org.quartz-scheduler:quartz, versions: ["2.5.1"],
      identity: reported, by: scripts/probes/cp55_quartz_shapes.md }
