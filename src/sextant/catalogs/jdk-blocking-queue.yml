    - { owner: *pbq, method: drainTo, descriptor: "(Ljava/util/Collection;)I", object: receiver, handler: enclosing }
    - { owner: *pbq, method: drainTo, descriptor: "(Ljava/util/Collection;I)I", object: receiver, handler: enclosing }
    - { owner: *pbq, method: remove, descriptor: "()Ljava/lang/Object;", object: receiver, handler: enclosing }
    - { owner: *lbd, method: drainTo, descriptor: "(Ljava/util/Collection;)I", object: receiver, handler: enclosing }
    - { owner: *lbd, method: drainTo, descriptor: "(Ljava/util/Collection;I)I", object: receiver, handler: enclosing }
