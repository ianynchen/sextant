    - { owner: *lbq, method: drainTo, descriptor: "(Ljava/util/Collection;I)I", object: receiver, handler: enclosing }
    - { owner: *lbq, method: remove, descriptor: "()Ljava/lang/Object;", object: receiver, handler: enclosing }
    - { owner: *abq, method: drainTo, descriptor: "(Ljava/util/Collection;)I", object: receiver, handler: enclosing }
