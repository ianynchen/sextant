id: spring-kafka-template
displayName: Spring Kafka (KafkaTemplate)
style: single_call
protocol: kafka
direction: outbound

detect:
  coordinates: ["org.springframework.kafka:spring-kafka"]

measured:
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }
  # The RECEIVE half (`G-44`): the one `receive` overload that names the topic at
  # argument 0.
  - { artifact: org.springframework.kafka:spring-kafka, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/w59_template_receive_halves.md }

requires: [call_site, string_constants]

matches:
  # The interface a codebase declares its field as (§3.1). A call site's
  # owner is the DECLARED type, so a field typed by the interface carried
  # an owner this catalog did not name and matched nothing.
  # Measured: org.springframework.kafka:spring-kafka 3.1.4 declares every method matched below
  # (scripts/probes/cp10_catalog_descriptors.md, which is the probe that ran).
  owner:
    - org.springframework.kafka.core.KafkaTemplate
    - org.springframework.kafka.core.KafkaOperations
  # CHECKPOINT FACT (real javap descriptors, spring-kafka 3.1.4):
  # `send(String, V)` arity 2, `send(String, K, V)` arity 3 — the payload
  # moves from arg 1 to arg 2 once the key joins the call, so `arity` tells
  # the two overloads apart (Task 6). `send(ProducerRecord<K, V>)` carries
  # both identity and payload in the record's own constructor — Task 7's
  # `record_arg` / `record_wrappers` below.
  #
  # `send(Message<?>)` is ALSO arity 1, and it now has ITS OWN ROW (descriptor
  # sweep R3). **The note that stood here said a second `send arity: 1` row
  # "would simply never be reached (dead catalog data)" — that was true of
  # arity matching and is false now**: each row declares its own erased JVM
  # `descriptor`, so each overload reaches its own row. That row declares NO
  # capture keys at all, following `spring-sqs-template.yml`'s own precedent,
  # and the reason is that it preserves today's answer EXACTLY. Before the
  # split, a `Message` call reached the `record_arg` row and `_record_arguments`
  # degraded honestly to `(None, None)` — `path` NULL, `resolution:
  # unresolved` — because a `Message` symbol names no `record_wrappers` entry.
  # A capture-less row derives the same honest empty row. Without it, the
  # `ProducerRecord` descriptor would claim arity 1 and a `Message` call would
  # derive NOTHING, which is a recall loss this sweep has no reason to take:
  # `spring-kafka-message.yml`'s fluent chain resolves that call's TOPIC and
  # this row's sibling stands beside it carrying a NULL path — two honestly
  # different facts about one call, which is that file's own documented
  # duplicate-row ruling and is verified end-to-end over real bytecode by
  # `test_the_messagebuilder_kafka_chain_resolves_its_topic_but_not_its_bare_payload`.
  # `sendDefault(V)` targets the
  # config-borne default topic: no channel argument at the call site at all,
  # so no `channel_arg` is declared for it — `path` NULL, `resolution:
  # unresolved` (I1), verified live.
  #
  # MEASURED, at spring-kafka 3.1.4 (CP-12 Q8,
  # `scripts/probes/cp12_sweep_round1b.md`): `KafkaTemplate` declares TEN
  # `send`/`sendDefault` overloads and this list held FIVE. The five that were
  # missing are the partition-carrying forms — `send(String, Integer, K, V)`,
  # `send(String, Integer, Long, K, V)` — and three of `sendDefault`'s four,
  # and the note that stood here said of them "the fixture never calls; only
  # the exercised arity is declared" (`A-M6`). That is the fixture's own
  # vocabulary encoded as the framework's, §8.1 rule 1's shape: a call to any
  # of them derived NOTHING, because `_matching_method` filters on arity before
  # descriptors, while COVERAGE listed this catalog "✅ shipped" with no arity
  # qualification.
  #
  # Every `send` overload takes its topic at argument 0 and its payload LAST,
  # which is what makes the four new rows a mirror rather than a guess: the
  # partition and timestamp arguments sit between them and are read by nothing.
  # The three new `sendDefault` rows keep their sibling's rule — no
  # `channel_arg`, because the destination is config-borne — so each derives an
  # honest `path: NULL` at `unresolved` rather than vanishing.
  # Every row states its own erased JVM `descriptor` (descriptor sweep R2/R3),
  # because Java identifies a method by name and parameter types in order and
  # never by argument count (GUIDELINES §8.1's language rule). Arities 2 and 3
  # are each a single overload here, so their claims cost nothing today and buy
  # silence rather than a misread position the day spring-kafka adds a sibling;
  # arity 1 is genuinely two overloads and is two rows. `sendDefault`'s three
  # further overloads are arities 2, 3 and 4 and are declared BELOW, in this
  # same commit — the sentence that stood here said they "remain undeclared, so
  # they match no row at all", which the rows underneath it contradicted.
  # Re-running `scripts/probes/cp10_catalog_descriptors/run.sh` is the check on
  # all ten.
  methods:
    - { name: send, arity: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        channel_arg: 0, body_arg: 1 }
    - { name: send, arity: 3,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        channel_arg: 0, body_arg: 2 }
    - { name: send, arity: 1,
        descriptor: "(Lorg/apache/kafka/clients/producer/ProducerRecord;)Ljava/util/concurrent/CompletableFuture;",
        record_arg: 0 }
    - { name: send, arity: 1,
        descriptor: "(Lorg/springframework/messaging/Message;)Ljava/util/concurrent/CompletableFuture;" }
    - { name: send, arity: 4,
        descriptor: "(Ljava/lang/String;Ljava/lang/Integer;Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        channel_arg: 0, body_arg: 3 }
    - { name: send, arity: 5,
        descriptor: "(Ljava/lang/String;Ljava/lang/Integer;Ljava/lang/Long;Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        channel_arg: 0, body_arg: 4 }
    - { name: sendDefault, arity: 1,
        descriptor: "(Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        body_arg: 0 }
    - { name: sendDefault, arity: 2,
        descriptor: "(Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        body_arg: 1 }
    - { name: sendDefault, arity: 3,
        descriptor: "(Ljava/lang/Integer;Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        body_arg: 2 }
    - { name: sendDefault, arity: 4,
        descriptor: "(Ljava/lang/Integer;Ljava/lang/Long;Ljava/lang/Object;Ljava/lang/Object;)Ljava/util/concurrent/CompletableFuture;",
        body_arg: 3 }
    # `G-44`, the RECEIVE half. MEASURED spring-kafka 3.1.4 (w59): `KafkaTemplate`
    # declares TWO `receive` overloads and only this one puts the topic at argument 0
    # as a plain `String` — a synchronous read of one record. The other,
    # `receive(Collection<TopicPartitionOffset>, Duration)`, takes addresses built
    # elsewhere (each `TopicPartitionOffset` constructed from a topic, partition and
    # offset the caller already assembled), stated in prose rather than as a
    # `slice.outside` entry, for two reasons: it shares the `receive` NAME with the row
    # below (that key is keyed on name alone, so a released fix cannot name `receive`
    # both read and outside on the same owner — Task 2's `spring-jms-template.yml` hit
    # the identical shape and made the same call), and `KafkaTemplate`/`KafkaOperations`
    # are not owners `scripts/probes/w19_catalog_surface/sweep.py` enumerates at all
    # (spring-kafka is not in that probe's artifact list), so no `slice:` block is
    # mechanically required here in the first place. A `channel_via` on
    # `TopicPartitionOffset.<init>(String, int, long)` would read the outside overload,
    # but constructor `channel_via` is not a form `single_call` has
    # (`kafka-consumer.yml`'s `channel_via` rows are all static factories) — so it
    # derives nothing, verified by the declining test in
    # `tests/application/test_call_engines.py`.
    - { name: receive, arity: 4,
        descriptor: "(Ljava/lang/String;IJLjava/time/Duration;)Lorg/apache/kafka/clients/consumer/ConsumerRecord;",
        channel_arg: 0, direction: inbound }
  # `ReplyingKafkaTemplate.sendAndReceive` gets its own file
  # (`spring-kafka-replying.yml`). The reason used to be that `matches.owner` is
  # single-valued; W9 made that false, so the real one: it is a DIFFERENT
  # request/reply shape, not another name for this one. An alternate names one
  # library reachable under two names and derives the same row; `sendAndReceive`
  # derives a different row, so it stays a separate file (checkpoint ruling).
  # CP-34 (`scripts/probes/cp34_producer_record_ctors.md`), measured at kafka-clients
  # 3.6.2: `ProducerRecord` declares SIX constructors and `payload_ctor_arg: last` is the
  # value on four of them. On the two whose final parameter is `Iterable<Header>` the last
  # argument is the record's HEADERS, and `last` published those as the payload — a
  # fabricated payload on ordinary input, not a miss. The two are named here by
  # `descriptor`, first-match-wins, each with the value's own measured index; the
  # undiscriminated `last` row below them still answers the other four, whose whole set the
  # probe enumerates. Arity cannot tell them apart: the two five-argument overloads
  # disagree, which is why this is a descriptor and not an `arity`.
  record_wrappers:
    - { type: org.apache.kafka.clients.producer.ProducerRecord,
        descriptor: "(Ljava/lang/String;Ljava/lang/Integer;Ljava/lang/Long;Ljava/lang/Object;Ljava/lang/Object;Ljava/lang/Iterable;)V",
        channel_ctor_arg: 0, payload_ctor_arg: 4 }
    - { type: org.apache.kafka.clients.producer.ProducerRecord,
        descriptor: "(Ljava/lang/String;Ljava/lang/Integer;Ljava/lang/Object;Ljava/lang/Object;Ljava/lang/Iterable;)V",
        channel_ctor_arg: 0, payload_ctor_arg: 3 }
    - { type: org.apache.kafka.clients.producer.ProducerRecord,
        channel_ctor_arg: 0, payload_ctor_arg: last }

# Copied verbatim from spring-resttemplate.yml: shape (type) expansion is a
# *global*, insert-if-absent pass keyed on the type symbol alone
# (`derive_shapes`), so the FIRST catalog to reach a shared payload type is
# the one that expands it, and every later catalog finds it already there.
# Whichever catalog that turns out to be, ITS `wrappers` are the rules that
# describe the type for everyone, regardless of protocol or direction — so a
# file whose copy disagreed would make the answer depend on catalog sort order (Task 10
# fix round 1, finding 1). Endpoint-level ownership is a different question
# and is NOT this reason: `_owns` reads a row's own `catalog_id` (2E-prep
# design §1a), so a catalog's rules describe only the rows it derived
# itself.
#
# No broker-specific wrapper is added: a `send`/`sendDefault` call's own
# payload argument is read directly off its declared position, never through
# an envelope type a `wrappers` rule would need to unwrap.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
