id: jakarta-jws-client
displayName: Jakarta XML Web Services (generated client stubs)
style: annotation_driven
protocol: soap
direction: outbound

detect:
  coordinates: ["jakarta.jws:jakarta.jws-api", "javax.jws:javax.jws-api"]

requires: [annotation_args, typed_signatures]

# The 2B Feign pattern: a client whose whole declaration is an ANNOTATED
# INTERFACE, with no call site anywhere to read — `spring-cloud-openfeign.yml`
# derives an outbound row per mapped interface method, and so does this. What
# is generated by `wsimport` rather than written by hand changes nothing about
# the derivation: the interface states the operations, and the module calling
# through it calls exactly those.
#
# A SECOND FILE beside `jakarta-jws.yml` for `spring-ws-template.yml`'s reason:
# one file declares one `style` and one `direction`, and this is the same style
# in the opposite direction.
matches:
  # 2I design §4 — THE WHOLE REASON THIS FILE CAN EXIST. `@WebService` marks
  # both a service implementation and the generated stub of one, and the two
  # are opposite directions of the same wire identity. Without a construct
  # gate, this file would derive an OUTBOUND row for every `@WebService` CLASS
  # `jakarta-jws.yml` already derives an INBOUND row for — the two would then
  # merge (D02 §3) and every served operation would be published as one the
  # module also calls. `jakarta-jws.yml` carries the mirror-image
  # `declared_on: class`, so the two files partition the annotation between
  # them and neither can reach the other's declarations.
  #
  # Interface-versus-class is the right axis and not merely a convenient one:
  # a JAX-WS service endpoint INTERFACE is what a client is generated against,
  # and an implementation class is what a container publishes.
  #
  # AND THE FENCE THAT COMPLETES IT. A hand-written service endpoint interface
  # implemented IN THIS SAME MODULE by a `@WebService` class (`@WebService
  # interface BillingPort` + `@WebService class BillingImpl implements
  # BillingPort`) is a SERVER-side declaration through and through, and it
  # carries exactly the annotations a generated stub does. What tells the two
  # apart is a fact rather than an annotation: a stub is implemented by nothing
  # in the module. So an outbound interface-gated derivation SUBTRACTS every
  # interface the module's own classes implement (D00 §5a's
  # `implemented_interfaces`, `derive_endpoints.sql`'s own SEI-fence comment).
  # That is not extra vocabulary — it is what `declared_on: interface` on an
  # outbound catalog already means — and it leaves the operation derived
  # exactly once, from `jakarta-jws.yml`'s row on the implementing class.
  declared_on: interface
  #
  # Deliberately NO `request_body` block, for `jakarta-jws.yml`'s reason
  # restated: a JAX-WS operation's request payload is the generated wrapper
  # element, whose type exists in no source file this scanner reads, and the
  # method's own parameters are that wrapper's children rather than the body.
  mapping:
    # Every naming word below is `jakarta-jws.yml`'s, verbatim and for its
    # reasons: an operation is `{targetNamespace}operationName`, the namespace
    # is stated once on the type, `operationName` defaults to the method's own
    # name, and a `@WebService` naming no namespace gets the spec's own
    # reversed-package default (checkpoint item 2, verified against both
    # reference implementations). The identity a stub derives is the identity
    # the service derives — that agreement is what lets a caller's row and a
    # handler's row meet.
    path_from: [operationName]
    prefix_from: []
    prefix_annotation: null
    path_fallback: construct_name
    qualifier_from: [targetNamespace]
    qualifier_format: qname
    namespace_default: reversed_package
    method_from: method
    # Verbless (D02 §2, amended): a SOAP operation declares no HTTP-style verb.
    all_methods: []
    # DELIBERATELY NO `members: public_methods`, and this is the one place this
    # file diverges from `jakarta-jws.yml` in more than direction.
    #
    # DR-6's argument for the member rule is about what a framework EXPOSES: a
    # public method of a `@WebService` class is an operation whether or not
    # `@WebMethod` marks it, so a catalog deriving only the annotated ones
    # would report a service missing its own operations. On the client side
    # the same rule would derive a row for every public method of every
    # `@WebService` interface — including the accessors and helpers a
    # hand-written SEI may declare — as CALLS the module makes, which is a
    # stronger claim than the annotations support.
    #
    # `wsimport`-generated stubs carry `@WebMethod` on every operation, so
    # nothing is lost for the case this file exists to serve. That is
    # secondhand knowledge rather than something probed here: no JAX-WS RI,
    # CXF, Axis or Metro artifact exists on this machine and this JDK removed
    # `wsimport` entirely (Phase 2I Task 2, checkpoint item 2's own search), so
    # a HAND-WRITTEN `@WebService` interface whose methods carry no `@WebMethod`
    # is a stated boundary: its operations stay underivable here.
    annotations:
      # Both spellings of the gate, `jakarta-jws.yml`'s reason unchanged: the
      # Jakarta EE 9 rename left two distinct fqns in the wild, `mapping.
      # annotations` is a list and `type_annotation` is not, and the type-level
      # join is what `qualifier_scopes` reads a class-level namespace through.
      - { fqn: jakarta.jws.WebService }
      - { fqn: javax.jws.WebService }
      # `requires_qualifier` on the OPERATION entries only: an operation with
      # no namespace declared, none stated by its interface and none derivable
      # from its package has no address at all, and a bare local name would
      # read as a top-level identity — a different endpoint from the one the
      # stub declares.
      #
      # `unless` withdraws exactly what JAX-WS withdraws. `@WebMethod(exclude =
      # true)` cannot legally appear on an SEI, but the pair costs nothing and
      # says the same thing both files say: a declaration the framework itself
      # removes derives no row, never a row marked somehow.
      - { fqn: jakarta.jws.WebMethod, requires_qualifier: true,
          unless: { attribute: exclude, equals: true } }
      - { fqn: javax.jws.WebMethod, requires_qualifier: true,
          unless: { attribute: exclude, equals: true } }

# NO `peer_from` above, and no `prefix_annotation` to read one off: unlike
# `@FeignClient(name = …)`, `@WebService` names no service and carries no
# address. `wsdlLocation` names where the CONTRACT was read from, which is not
# where the service answers, so reading it as a peer would publish a document
# URL as a participant. The peer stays NULL — an honest absence.

# 2G design §7, rung 1: identical to `spring-ws.yml`/`jakarta-jws.yml`/
# `spring-ws-template.yml` by contract — the ladder refuses a contradiction
# between two catalogs rather than picking one.
format_fixed:
  soap: xml

# Deliberately NO `wrappers` block, for `jakarta-jws.yml`'s reason: a JAX-WS
# runtime marshals what the operation returns through JAXB and unwraps neither
# an HTTP envelope nor an `Optional`.

nullability:
  nullable: [org.jspecify.annotations.Nullable, org.springframework.lang.Nullable,
             javax.annotation.Nullable, jakarta.annotation.Nullable,
             org.jetbrains.annotations.Nullable]
  not_null: [org.jspecify.annotations.NonNull, org.springframework.lang.NonNull,
             org.jetbrains.annotations.NotNull]
  scope:
    - { annotation: org.jspecify.annotations.NullMarked, means: not_null_by_default }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
