id: netflix-dgs
displayName: Netflix DGS
style: annotation_driven
protocol: graphql
direction: inbound

detect:
  coordinates: ["com.netflix.graphql.dgs:graphql-dgs"]

requires: [annotation_args, type_annotations]

matches:
  type_annotation: com.netflix.graphql.dgs.DgsComponent
  request_body: { annotation: com.netflix.graphql.dgs.InputArgument,
                  fallback: sole_unannotated }
  mapping:
    # CHECKPOINT FACT: the three shorthands declare `field()` and NOTHING
    # else — there is no `value` to alias, unlike Spring's pair — and
    # `@DgsData` adds `parentType()`. All arrive SCALAR.
    path_from: [field]
    # CHECKPOINT FACT: `@DgsQuery.field()` is declared `default ""`, which
    # never reaches the class file — the same absent-means-method-name shape
    # Spring GraphQL and MicroProfile both have. This catalog rides the form
    # `spring-graphql.yml` introduced with no engine change of its own, which
    # is 2H design §1's amended acceptance test.
    path_fallback: construct_name
    # `@DgsData(parentType = "Order", field = "lines")` — the parent type sits
    # on the same annotation as the field, exactly like Spring's `typeName`.
    qualifier_from: [parentType]
    qualifier_separator: "."
    prefix_from: []
    peer_from: []
    method_from: method
    all_methods: []
    prefix_annotation: null
    annotations:
      - { fqn: com.netflix.graphql.dgs.DgsQuery,        method: [query] }
      - { fqn: com.netflix.graphql.dgs.DgsMutation,     method: [mutation] }
      - { fqn: com.netflix.graphql.dgs.DgsSubscription, method: [subscription] }
      # The long form. It pre-sets no operation, so it derives the verbless
      # `Parent.field` identity every non-root resolver has, and it names a
      # field OF a type — so `requires_qualifier`, for the reason
      # `spring-graphql.yml` states on its own two resolver annotations.
      #
      # KNOWN LIMITATION, stated rather than guessed: `@DgsData(parentType =
      # "Query")` is the long spelling of `@DgsQuery`, and this row renders it
      # `Query.field` verbless instead of `(query, field)`. Expressing "this
      # parent type IS a root operation" needs a fourth vocabulary form
      # nobody has asked for, and the honest verbless row is a visible,
      # correctly-addressed identity rather than a wrong one. Recorded in
      # COVERAGE by Task 7.
      - { fqn: com.netflix.graphql.dgs.DgsData, requires_qualifier: true }

format_fixed:
  graphql: json

# Copied verbatim from spring-graphql.yml — see the block comment there for
# why every catalog reaching a shared payload type must agree, and why these
# three files in particular are the ones that reach `OrderView` first.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,             payload_arg: 0, semantics: async }
  - { type: reactor.core.publisher.Flux,             payload_arg: 0, semantics: streaming }
  # 2H Task 6 fix round 1. `ServerSentEvent<T>` is the per-EVENT envelope an
  # SSE stream carries — `id`/`event`/`retry` metadata wrapped around `data:
  # T` — so the payload on that wire is `T`, exactly as `ResponseEntity`'s is.
  # Without this line `Flux<ServerSentEvent<OrderView>>` peeled its outer
  # `Flux` and then stopped, publishing the envelope TYPE as the contract;
  # `rooting.py` peels recursively, so one entry is the whole remedy.
  # `http_envelope`, not `streaming`: the stream is the `Flux` around it, and
  # `semantics` only ever gates `optional`, so the value is a label for a
  # reader rather than a branch.
  - { type: org.springframework.http.codec.ServerSentEvent,
      payload_arg: 0, semantics: http_envelope }
  - { type: java.util.concurrent.CompletableFuture,  payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                      payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# F2 §3.8, G-41 — a STATED BOUNDARY rather than a `slice.outside` entry, and the
# outcome is real even though the mechanism first recorded for it was not.
#
# **What is true.** A fetcher declared on a SUPERCLASS method registers on every
# subclass bean, and this analysis does not see it. Measured
# (`scripts/probes/w19b_type_and_annotation_surface.md` §3): DGS builds its bean list
# in `DgsSchemaProvider$Companion$DgsBean`, which calls
# `ReflectionUtils.getUniqueDeclaredMethods(clazz, USER_DECLARED_METHODS)`, and
# `ReflectionUtils.doWithMethods` walks `Class.getSuperclass()` and
# `Class.getInterfaces()` (`javap -c`, spring-core 6.1.6). So the framework enumerates
# the whole hierarchy's methods; we read annotations only where they are written. A
# codebase with an abstract base fetcher and ten thin subclasses derives one fetcher's
# worth of rows instead of ten, and nothing says a row is missing. It is `OI-37`'s
# shape in a third framework, and it is `OI-67`.
#
# **What was recorded and is FALSE.** The gap analysis says `@DgsData` and `@DgsQuery`
# are `@Inherited`, and an earlier draft of this comment concluded that "an
# `@Inherited` annotation on a superclass METHOD registers a fetcher the subclass never
# declares". They ARE `@Inherited` — all five are, measured at 8.7.1, which is three
# more than the gap analysis recorded — but that bit does nothing here.
# `java.lang.annotation.Inherited`'s own contract is that it "has no effect if the
# annotated type is used to annotate anything other than a class", and it inherits from
# SUPERCLASSES, never through methods. `@DgsData`, `@DgsQuery`, `@DgsMutation` and
# `@DgsSubscription` all declare `@Target(METHOD)`, so on four of the five the
# `@Inherited` bit is inert. The right measurement was the framework's own registration
# code, not the annotation's meta-annotations.
#
# **This changes the fix.** Resolving `@Inherited` through `type_hierarchy` — the
# remediation the earlier draft named — would close nothing for four of these five.
# What is needed is a superclass METHOD walk: the annotations sit on methods the
# subclass does not declare at all.
#
# **Why this is not `slice.outside`.** That key means "names this catalog does not
# read", and this catalog reads every name — all five annotations are declared above.
# The gap is a USE SITE: the same annotation, written somewhere we do not look. Filing
# it as a slice entry would make the key mean two different things and would let a
# reader conclude the annotations themselves are unhandled, which is the opposite of
# true. **Falsified by** a DGS codebase with no inheritance among its fetchers, for
# which today's rows are already complete.
