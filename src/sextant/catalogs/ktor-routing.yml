id: ktor-routing
displayName: Ktor (routing DSL)
style: combinator
protocol: http
direction: inbound

detect:
  coordinates: ["io.ktor:ktor-server-core-jvm", "io.ktor:ktor-server-core"]

measured:
  - { artifact: io.ktor:ktor-server-core-jvm, versions: ["3.0.3"],
      identity: reported, by: scripts/probes/w19_catalog_surface.md }
  - { artifact: io.ktor:ktor-http-jvm, versions: ["3.6.0"],
      identity: reported, by: scripts/probes/cp54_ktor_client_ws_sse.md }
  - { artifact: io.ktor:ktor-server-websockets-jvm, versions: ["3.6.0"],
      identity: reported, by: scripts/probes/cp54_ktor_client_ws_sse.md }
  - { artifact: io.ktor:ktor-server-sse-jvm, versions: ["3.6.0"],
      identity: reported, by: scripts/probes/cp54_ktor_client_ws_sse.md }

requires: [call_site, string_constants, chain_reconstruction]

# Ktor's routing DSL: `routing { route("/api") { get("/orders") { … } } }`. Every name
# below is a STATIC extension function on `Route` — the receiver the enclosing block was
# handed is argument 0 in the bytecode — and every block is a `Function1<Route, Unit>`
# the Kotlin compiler (2.x, `-Xlambdas=indy` by default) emits as an `invokedynamic`
# body the extractor links as a `lambda`-kind argument. The entry is on the file facade
# `RoutingRootKt`, the vocabulary on `RoutingBuilderKt`: two owners for one tree, as
# every `combinator` catalog declares.
#
# MEASURED, `javap -p -s -c -cp ~/.m2/repository/io/ktor/ktor-server-core-jvm/3.0.3/
# ktor-server-core-jvm-3.0.3.jar` (A2 Task 5, 2026-09-13):
#   RoutingRootKt.routing(Application, Function1<Routing, Unit>) → RoutingRoot
#   RoutingBuilderKt:
#     route(Route, String, Function1)                the nesting primitive
#     route(Route, String, HttpMethod, Function1)     a prefix carrying a verb (`verb_arg`)
#     method(Route, HttpMethod, Function1)            a verb block with no path (`verb_arg`)
#     get/post/put/patch/delete/head/options, each in TWO overloads:
#       (Route, String, Function2)   (Route, Function2)
#     postTyped/putTyped/patchTyped(Route, Function3), postTypedPath/putTypedPath/
#       patchTypedPath(Route, String, Function3)      the `@JvmName` spellings of the
#       reified `post<R>`/`put<R>`/`patch<R>` overloads; reified needs `inline`, so a
#       caller's bytecode holds the inlined body, which calls the plain overload above —
#       these names never appear at a user's call site
#     param, optionalParam, header, accept, contentType (Route, …, Function1)
#                                                     selector blocks, no path — prefixes
#                                                     that set something else (below)
#     createRouteFromPath(Route, String)              the plumbing every prefix calls
#
# The path-less overload, read off `javap -c`: `get(Route, Function2)` is
# `method(this, Get) { handle(body) }` — an `HttpMethodRouteSelector` child of the
# RECEIVER itself — so `get { }` under `route("/api") { }` serves exactly `/api`, the
# prefix, and the rule says so with `path: ""` (the same word Javalin's `get(Handler)`
# carries), never the catch-all `/api/**`.
#
# Ktor JOINS segments itself: `route(Route, String, Function1)` is
# `createRouteFromPath(this, path)`, which is `RoutingPath.parse(path).parts` — a split
# on `/` that DROPS the empty parts (`parse$lambda$0` keeps `length > 0`) — one child
# selector per part. So `route("api")` and `route("/api")` are the same registration, and
# `route("/api") { get("orders") { } }` serves `/api/orders`: `path_join: leading_slash`
# is that rule, applied to every literal this catalog reads. Without it the slashless
# spelling read back as `/apiorders`, resolved — a wrong row (the Javalin lesson, Task 3
# fix round 1). One WRONG-ROW boundary of the join, stated: `leading_slash` leaves the
# bare `*` unprefixed (Javalin's exception, where `*` is the whole pattern), so
# `route("/api") { get("*") { } }` publishes `/api*`, resolved — where Ktor's parse
# makes `*` one wildcard segment and serves `/api/<one segment>`. A resolved wrong
# row, not a missing one; rare real input (Ktor's documented wildcard forms are `*`
# and `{...}` INSIDE a longer path, which read correctly). Logged: `path_join` needs a
# per-catalog exception list before this reads right.
#
# Handlers are `suspend RoutingContext.() -> Unit` — a `Function2` the compiler emits as
# a `SuspendLambda` CLASS, `new`ed at the call site, not an `invokedynamic`. The
# extractor marks that class with the `invokeSuspend` holding its body (`lambda_body`)
# and `effective_call_sites` hands every engine the instance as that lambda (spec
# 2026-09-19 §3b), so `handler_arg` reads the body's own symbol (`kotlin-null-handler`,
# closed).
#
# THE SELECTOR BLOCKS (spec 2026-09-19 §4b; `ktor-selector-blocks`, `ktor-route-with-verb`;
# every signature CP-24 row 1a). A selector is a PREFIX that sets something other than a
# path, and the scope it opens applies to every route beneath it as a path prefix does:
#   * `method(Route, HttpMethod, Function1)` and the four-argument `route(Route, String,
#     HttpMethod, Function1)` set the VERB (`verb_arg`). `HttpMethod.Get` is a GETTER
#     call on the companion object — `HttpMethod$Companion.getGet()`, never a `GETSTATIC`
#     of a constant (CP-24 row 3) — so the argument reaches the facts as the getter's
#     RESULT, and `verb_values.getters` below maps each getter to the literal its field
#     was built from. A getter the table does not name poisons `method`: the verb was
#     written and is unreadable, an unresolved row and not a phantom.
#     On Ktor 3.x the verb is a STATIC FIELD instead — a `getstatic`, no getter call — read
#     through `verb_values.fields` the same way (spec 2026-10-26 §3a).
#   * `accept(Route, ContentType[], Function1)` fills `produces` and `contentType(Route,
#     ContentType, Function1)` fills `consumes` (`media_arg` + `fills`; `accept` is a
#     VARARG, one array slot whose elements the media reader already walks). `ContentType.
#     Application.Json` is `ContentType$Application.getJson()`, a getter on the nested
#     object (CP-24 row 4), read through `media_values.getters`; an unknown getter leaves
#     the media column NULL and the row resolved, as an undeclared enum member does.
#   * `header(Route, String, String, Function1)`, `param(Route, String, Function1)`,
#     `param(Route, String, String, Function1)` and `optionalParam(Route, String,
#     Function1)` are REQUIREMENTS (`request_requirement`): the routing tree refuses a
#     request without the header, or the query parameter — with the value, where one is
#     given — so those three are `required`; `optionalParam` registers the route whether
#     or not the parameter is present, `optional`. Each reaches `endpoint_metadata` on
#     every row beneath it (`caller` = the row's handler).
#   * VERB CONFLICT → SILENCE (A2). `method(HttpMethod.Post) { get("/never") { } }` is a
#     node Ktor registers and can never dispatch: `HttpMethodRouteSelector.evaluate`
#     compares the request's method to the selector's own and returns the failure
#     constant on a mismatch (CP-24 row 7, read off the bytecode), so every request the
#     outer selector passes the inner one refuses. A row of either verb would be an
#     endpoint that is not on the wire, and an unresolved row a phantom: the engine drops
#     the subtree route before the verbs are merged and publishes NOTHING for it — stated
#     here and in COVERAGE.
#
# `handle { }` — THE VERB-LESS TERMINAL (spec 2026-09-19 §4c; CP-24 row 1b). `Route` is an
# INTERFACE and `handle(Function2)V` its abstract member, not an extension on
# `RoutingBuilderKt`: a call site is `invokeinterface Route.handle` on the block's own
# parameter, so the rule is declared on owner `io.ktor.server.routing.Route` with NO
# `receiver_arg` — the receiver is the site's own, tested against the origin as every
# member verb is — and no `verb`: it takes the scope's. Under `method(Get) { handle { } }`
# it is `GET`; under a bare `route("/health2") { handle { } }` no verb is in scope, and the
# route expands through `all_methods` — `HttpMethod.DefaultMethods`, the seven members the
# static initialiser lists in this order (CP-24 row 2; Ktor has no `TRACE`, so seven and
# not Spring's eight) — one row per member. `path: ""`, as the path-less `get { }` carries:
# `handle` registers on the receiver node ITSELF and serves exactly the prefix chain
# (`RoutingResolveContext` succeeds at a node with handlers only when every segment is
# consumed), so at the routing root it is `/` — `RoutingPath.parse("")` has no parts and
# the empty literal canonicalises to `/` — and never `/**`.
#
# A Route-extension HELPER — `fun Route.api() { get("/x") { } }` called from `routing {
# api() }`, Ktor's own recommended way to split a large routing tree — IS followed (spec
# 2026-09-19 §4a, `ktor-route-extensions`): the extension receiver is argument 0 of the
# static call, that argument is the block's own parameter (the origin `origin_param: 0`
# names), so the walk enters `api`'s body with ITS parameter 0 as the origin and
# `get("/x")` derives under whatever prefix reached the call — `route("/api") { api() }`
# gives `/api/x`, a second-level helper chains the same way, and a module-local DSL
# function whose path arrives as a PARAMETER (`fun Route.mount(path, build) = route(path,
# build)`) is one unresolved row per call, honestly: the path is unreadable there. The
# catalog declares nothing for this; it is the engine's word. Two stated boundaries of
# the following: a chain deeper than sixteen helper calls stops and files a
# `routing_depth` open question, never a row; and a routing block held in a `val` and
# invoked later (`val b: Route.() -> Unit = { }; b()`) is `Function1.invoke` on a local,
# not a module-local call, and is not followed.
#
# WEBSOCKET AND SSE ROUTES (spec 2026-10-26 §3b, §3g item 5; CP-54 row (c), rows 16-27).
# `webSocket`, `webSocketRaw` and `sse` are static extensions on `Route` like every verb
# here — receiver at argument 0, written inside the same blocks — so they are VERBS of this
# catalog, nesting through the same `entries` and `prefixes` as `get`, and each rule names
# the `protocol` its rows carry instead of the catalog's `http`. One prefix list for all
# three protocols; a sibling catalog would have needed a copy of it.
#   * WebSocket rows are VERBLESS (`verb: none`), as every shipped WebSocket catalog's are
#     (`all_methods: []`). The general rule, the engine's: a route from a `verb: none` rule
#     never takes the verb of the scope it is written in, is never dropped as disagreeing
#     with it (`method(HttpMethod.Post) { webSocket("/ws") { } }` is one verbless row), and
#     is never expanded through `all_methods` (a `webSocket` under a bare `route` is one
#     row, not seven).
#   * SSE rows carry GET where Ktor registers GET: `sse(path, …)` is `route(path,
#     HttpMethod.Get) { … }`, read off the 3.6.0 jar (`javap -c io.ktor.server.sse.
#     RoutingKt`). The path-less `sse { }` is NOT — it is `processSSE`, which installs the
#     plugin and calls `handle { }` on the receiver itself, no verb — so it is declared as
#     `handle` is, a `terminal` with no `verb`: the scope's verb, or one row per
#     `all_methods` member.
#   * WHICH ARGUMENT IS THE PATH (CP-54 rows 16-18). In the three-argument `webSocket(Route,
#     String, Function2)` argument 1 is the PROTOCOL, never a path; a call with a path always
#     lands on the four-argument form (`webSocket("/x") { }` is `webSocket$default`, mask 2;
#     `webSocket("/x", "chat") { }` the plain one; rows 19-20). `webSocketRaw` has a path at
#     1 only where argument 2 is a `String` too; `(Route, String, boolean, Function2)` is a
#     protocol and `negotiateExtensions`, told apart from `(Route, String, String,
#     Function2)` by `arg_types`. `sse`'s two arity-3 overloads are told apart by argument
#     1's type alone: `String` a path, `Function2` a serializer. Path-less forms serve the
#     receiver node itself, `path: ""`, as the path-less `get { }` does.
#   * Both JVM names are declared: the plain function and its `$default` bridge, which
#     appends the `int` mask and an `Object` marker (two more arguments, so its own
#     arities). `sse` has no bridge (row 18). The hidden old binary forms (`void` return,
#     rows 16-17) share each current form's parameter types, so the same rule reads them.
#   One stated boundary of the verbless rule: Ktor wraps a path-carrying `webSocket` in
#   `route(path, HttpMethod.Get)` as it does `sse(path)`, so under a non-GET `method` scope
#   it is a node the framework never dispatches — the A2 silence above — and this catalog
#   publishes the verbless row there anyway (spec §3g item 5 as ruled).
matches:
  path_join: leading_slash
  # HANDLER-BODY READS (spec 2026-09-19 §5d, mechanism 3). What a handler reads off the
  # request is one `endpoint_metadata` row per read, `requirement` NULL unless the API
  # itself refuses the request (A3). The three containers — `call.request.headers`,
  # `call.request.queryParameters`, `call.parameters` — all end in ONE read,
  # `StringValues.get(String)` (CP-24 row 6: `Headers` and `Parameters` both extend
  # `StringValues`), so the read's own owner and name say nothing about WHICH value is
  # read; the call that PRODUCED the receiver does, and each entry names it as `via`
  # (one `_producing_site` step). The `via` owners are what a 3.0.3 handler body's
  # bytecode NAMES, measured on `fixtures/orders-ktor`'s `KtorRoutesKt$reads$1$1.
  # invokeSuspend` (`javap -c -p`, 2026-09-20): the body's `call` is
  # `RoutingContext.getCall()`, a `RoutingCall`, so `call.parameters` is `invokevirtual
  # RoutingCall.getParameters` and `call.request.headers` is `RoutingCall.getRequest` →
  # `invokevirtual RoutingRequest.getHeaders` — the CLASS overrides, never the
  # `ApplicationCall`/`ApplicationRequest` interface methods CP-24 row 6 lists; the
  # `get` itself is `invokeinterface Parameters.get`/`Headers.get` on the static receiver
  # type, which is why `via` matches on name and arity and never on the read's owner.
  # `call.parameters` merges path and query: a name that is one of the row's own path
  # variables (`{id}`, `{id?}`, `{rest...}` — A6) is the path variable and gets no row
  # (`skip_path_variables`); every other name there is a query parameter.
  #
  # `getOrFail` (CP-24 row 5): `ParametersKt.getOrFail(Parameters, String)` reads the
  # container and throws `MissingRequestParameterException` on an absent name — the
  # framework refuses the request, so the `owner` entry declares `requirement: required`.
  # BUT THE FUNCTION IS `inline`: a caller compiled from the same language carries its
  # BODY, not a call to it. Measured on the fixture's `KtorRoutesKt$reads$1$1.invokeSuspend`:
  # `Parameters.get("cursor") ; ifnonnull ; new MissingRequestParameterException ; athrow`
  # and no `invokestatic ParametersKt.getOrFail` anywhere — so that spelling reaches this
  # catalog as a plain `get` on `getParameters`, and the `owner` entry matches only a
  # caller that emits the call (a language without inlining). `required_when_thrown` on
  # the two `Parameters` entries reads the inlined shape instead: the read is `required`
  # when the SAME body constructs `MissingRequestParameterException` with the read's OWN
  # name as its first argument — the extractor hands that `<init>` site the literal
  # (`{kind: string, value: "cursor"}`, the `ldc` carried through the local; measured on
  # the analyzed workspace, 2026-09-20). A body that throws it for another name marks
  # nothing; a bare `get` with a handler's own `?: throw SomethingElse` stays NULL (A3).
  # Only `Parameters` has a `getOrFail` (both overloads take `Parameters`; no facade in the
  # jar declares one for `Headers`), so the headers entry carries no such key.
  #
  # Two boundaries more, both A3's line: a `?: throw` in the handler after a bare `get`
  # is the handler's word, not the framework's, and stays NULL; and only the handler
  # body is read — a `suspend fun ApplicationCall.x()` helper it delegates to is not.
  request_reads:
    - { via: { owner: io.ktor.server.routing.RoutingRequest, method: getHeaders },         method: get, arity: 1, name_arg: 0, kind: header }
    - { via: { owner: io.ktor.server.routing.RoutingRequest, method: getQueryParameters }, method: get, arity: 1, name_arg: 0, kind: query,
        required_when_thrown: io.ktor.server.plugins.MissingRequestParameterException }
    - { via: { owner: io.ktor.server.routing.RoutingCall,    method: getParameters },      method: get, arity: 1, name_arg: 0, kind: query, skip_path_variables: true,
        required_when_thrown: io.ktor.server.plugins.MissingRequestParameterException }
    - { owner: io.ktor.server.util.ParametersKt, method: getOrFail, arity: 2, name_arg: 1, kind: query, requirement: required }
  # `HttpMethod.DefaultMethods` at 3.0.3, in the static initialiser's order (CP-24 row 2):
  # what a verb-less `handle { }` under no `method` selector expands to.
  all_methods: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
  entries:
    # `routing(Application, Function1<Routing, Unit>)` — the block's parameter is the
    # root `Routing` (a `Route`), and every verb inside is called on it: `origin_param: 0`.
    - owner: io.ktor.server.routing.RoutingRootKt
      method: routing
      body_arg: 1
      origin_param: 0
  vocabulary:
    prefixes:
      # `route(Route, String, Function1<Route, Unit>)`: the receiver is argument 0 (must be
      # the enclosing block's Route), the path argument 1, the block argument 2 — whose own
      # parameter is the new Route.
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: route, arity: 3,
          receiver_arg: 0, path_arg: 1, body_arg: 2, origin_param: 0 }
      # The selector blocks (spec 2026-09-19 §4b, CP-24 row 1a): the receiver at 0 and the
      # block last on every one, exactly as `route` above.
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: route,  arity: 4, receiver_arg: 0, path_arg: 1, verb_arg: 2, body_arg: 3, origin_param: 0 }   # ktor-route-with-verb
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: method, arity: 3, receiver_arg: 0, verb_arg: 1, body_arg: 2, origin_param: 0 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: accept,      arity: 3, receiver_arg: 0, media_arg: 1, fills: produces, body_arg: 2, origin_param: 0 }   # ContentType[] vararg
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: contentType, arity: 3, receiver_arg: 0, media_arg: 1, fills: consumes, body_arg: 2, origin_param: 0 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: header,        arity: 4, receiver_arg: 0, body_arg: 3, origin_param: 0,
          request_requirement: { kind: header, name_arg: 1, value_arg: 2, requirement: required } }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: param,         arity: 3, receiver_arg: 0, body_arg: 2, origin_param: 0,
          request_requirement: { kind: query, name_arg: 1, requirement: required } }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: param,         arity: 4, receiver_arg: 0, body_arg: 3, origin_param: 0,
          request_requirement: { kind: query, name_arg: 1, value_arg: 2, requirement: required } }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: optionalParam, arity: 3, receiver_arg: 0, body_arg: 2, origin_param: 0,
          request_requirement: { kind: query, name_arg: 1, requirement: optional } }
    # The getter forms of the two value tables (spec 2026-09-19 §4b, F5). Each key is the
    # getter a Kotlin call site invokes — `HttpMethod.Get` is `getstatic HttpMethod.Companion;
    # invokevirtual HttpMethod$Companion.getGet()` — and each value the string literal the
    # static initialiser built the field from, read off the bytecode: CP-24 row 3 for the
    # seven `HttpMethod` members (`DefaultMethods`, row 2), CP-24 row 4 for the four
    # `ContentType$Application` members declared here. One measured member at a time, as the
    # Spring `media_values` table is: a getter this table does not name reads as nothing —
    # NULL media, a poisoned verb — never as its own name.
    #
    # `fields` is the other spelling of the same verbs (spec 2026-10-26 §2d, §3a): Ktor 3.6.0
    # declares `Get … Query` as public static fields of `HttpMethod`, and user code reads one
    # with a `getstatic` — no getter call — so the verb reaches the call site as a `field`-kind
    # argument carrying the field's symbol. Both forms stay: 3.0.3 code calls the getters. All
    # NINE fields, each built from the upper-case word of its name (CP-54 row (a), rows 1–2).
    # `Trace` and `Query` are fields only — the Companion has no `getQuery`, and `DefaultMethods`
    # (the seven `all_methods` lists) holds neither — and a verb is a plain word the rows carry.
    verb_values:
      fields:
        "io.ktor.http.HttpMethod#Get": GET
        "io.ktor.http.HttpMethod#Post": POST
        "io.ktor.http.HttpMethod#Put": PUT
        "io.ktor.http.HttpMethod#Patch": PATCH
        "io.ktor.http.HttpMethod#Delete": DELETE
        "io.ktor.http.HttpMethod#Head": HEAD
        "io.ktor.http.HttpMethod#Options": OPTIONS
        "io.ktor.http.HttpMethod#Trace": TRACE
        "io.ktor.http.HttpMethod#Query": QUERY
      getters:
        "io.ktor.http.HttpMethod$Companion#getGet": GET
        "io.ktor.http.HttpMethod$Companion#getPost": POST
        "io.ktor.http.HttpMethod$Companion#getPut": PUT
        "io.ktor.http.HttpMethod$Companion#getPatch": PATCH
        "io.ktor.http.HttpMethod$Companion#getDelete": DELETE
        "io.ktor.http.HttpMethod$Companion#getHead": HEAD
        "io.ktor.http.HttpMethod$Companion#getOptions": OPTIONS
    media_values:
      getters:
        "io.ktor.http.ContentType$Application#getJson": application/json
        "io.ktor.http.ContentType$Application#getXml": application/xml
        "io.ktor.http.ContentType$Application#getOctetStream": application/octet-stream
        "io.ktor.http.ContentType$Application#getFormUrlEncoded": application/x-www-form-urlencoded
    verbs:
      # Per verb: (Route, String, Function2) and (Route, Function2) — the second serves the
      # receiver route itself (the empty literal path). `receiver_arg: 0` on every rule:
      # `other.get("/stray") { }` inside `route("/api") { }` is `get(other, "/stray", …)`,
      # registered on `other`, and the row is `unresolved` without the prefix (spec §14
      # test 13) rather than `/api/stray` resolved on a route this block never touched.
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: get, verb: GET, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: get, verb: GET, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: post, verb: POST, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: post, verb: POST, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: put, verb: PUT, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: put, verb: PUT, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: patch, verb: PATCH, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: patch, verb: PATCH, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: delete, verb: DELETE, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: delete, verb: DELETE, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: head, verb: HEAD, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: head, verb: HEAD, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: options, verb: OPTIONS, arity: 3, receiver_arg: 0, path_arg: 1, handler_arg: 2 }
      - { owner: io.ktor.server.routing.RoutingBuilderKt, method: options, verb: OPTIONS, arity: 2, receiver_arg: 0, path: "", handler_arg: 1 }
      # `Route.handle(Function2)` — the verb-less terminal (spec 2026-09-19 §4c, CP-24 row 1b):
      # a MEMBER of the `Route` interface, so no `receiver_arg`; no `verb` — the scope's, or
