id: spring-mvc
displayName: Spring MVC (server-rendered controllers)
style: annotation_driven
protocol: http
direction: inbound

detect:
  coordinates: ["org.springframework:spring-webmvc"]

requires: [annotation_args, type_annotations]

matches:
  type_annotation: org.springframework.stereotype.Controller
  request_body: { annotation: org.springframework.web.bind.annotation.RequestBody, fallback: none }
  mapping:
    # `value` and `path` are @AliasFor each other, so only the one the author
    # typed reaches the bytecode. First present wins, in this order.
    path_from: [value, path]
    prefix_from: [value, path]
    # Declared media types (2E Task 5, evidence kind (a)): each mapping
    # annotation's own `consumes`/`produces` attribute, read scalar-or-array
    # like `path_from`. Neither has an alias to worry about here.
    consumes_from: [consumes]
    produces_from: [produces]
    method_from: method
    all_methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, TRACE]
    prefix_annotation: org.springframework.web.bind.annotation.RequestMapping
    annotations:
      # @RequestMapping carries no pre-set method: it takes one from its own
      # `method` attribute, and means every method when that is absent.
      - { fqn: org.springframework.web.bind.annotation.RequestMapping }
      - { fqn: org.springframework.web.bind.annotation.GetMapping,    method: [GET] }
      - { fqn: org.springframework.web.bind.annotation.PostMapping,   method: [POST] }
      - { fqn: org.springframework.web.bind.annotation.PutMapping,    method: [PUT] }
      - { fqn: org.springframework.web.bind.annotation.DeleteMapping, method: [DELETE] }
      - { fqn: org.springframework.web.bind.annotation.PatchMapping,  method: [PATCH] }

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,             payload_arg: 0, semantics: async }
  - { type: reactor.core.publisher.Flux,             payload_arg: 0, semantics: streaming }
  - { type: java.util.concurrent.CompletableFuture,  payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                      payload_arg: 0, semantics: optional }

nullability:
  nullable: [org.jspecify.annotations.Nullable, org.springframework.lang.Nullable,
             javax.annotation.Nullable, jakarta.annotation.Nullable,
             org.jetbrains.annotations.Nullable]
  not_null: [org.jspecify.annotations.NonNull, org.springframework.lang.NonNull,
             org.jetbrains.annotations.NotNull]
  scope:
    - { annotation: org.jspecify.annotations.NullMarked, means: not_null_by_default }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.time.LocalDate,  wire: string, format: date }
  - { type: java.math.BigDecimal, wire: number }
  - { type: java.util.UUID,       wire: string, format: uuid }

# 2H design §6 — see `spring-web.yml`'s own block for the full rule. `protocol`
# and `hint_media` are the duplicated half (an HTTP media declaration, carried
# on both catalogs of the family for the reason `media_formats` below is
# carried on both); `hint_returns` names the one SSE marker type THIS
# artifact declares. `SseEmitter` is spring-webmvc's own servlet-side stream
# handle and appears nowhere in spring-web, so it is declared here and only
# here — the `parse_calls` ownership rule, not the `media_formats` copy rule.
#
# It is also the shape that makes the "marker anywhere in the chain" rule
# necessary from BOTH ends: `SseEmitter` is a flat return with no type
# arguments at all, so the outer symbol IS the marker — while spring-web's
# `ServerSentEvent` is only ever reached through a wrapper's arguments.
protocol_hint:
  protocol: sse
  hint_media: [text/event-stream]
  hint_returns:
    - org.springframework.web.servlet.mvc.method.annotation.SseEmitter

# 2G design §7, rungs 2 and 5 — the same two tables spring-web.yml carries,
# for the same reason it carries them: this catalog owns the HTTP protocol
# too, and a module that pulls in only one of the two must still get the
# vocabulary. Identical by construction; the ladder refuses a contradiction
# between two catalogs rather than picking one, so the duplication cannot
# drift silently.
#
# **`text/event-stream` is deliberately absent from both copies**, and
# spring-web.yml's own table says at length why: it is the envelope, not the
# payload. `protocol_hint` above reads that MIME string to name a protocol;
# nothing may read it to name a format.
media_formats:
  application/json: json
  application/x-protobuf: protobuf
  application/protobuf: protobuf
  avro/binary: avro
  application/xml: xml
  text/xml: xml

json_default_markers:
  - com.fasterxml.jackson
  - tools.jackson
