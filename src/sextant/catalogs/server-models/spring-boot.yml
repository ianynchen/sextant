# The SERVER's own path prefix, as configuration keys (spec 2026-10-18 §3).
#
# **Why this is not on a catalog.** A context path is a property of the embedded container,
# not of `@RestController`: a Boot app that sets one serves every controller under it,
# including the rows `spring-data-rest` and `spring-actuator` derive, and catalogs are flat
# with no `family:` key. Declaring it per catalog would put the same block in ten files, each
# holding a fact none of them owns, and the eleventh catalog written next year would forget it
# and publish unprefixed paths with nothing failing.
#
# **Why the key carries a framework and a version.** Both narrower gates rot. The build
# COORDINATE rots because Boot 4 renamed `spring-boot-starter-web` to
# `spring-boot-starter-webmvc`, so a gate naming the old spelling is inert on
# `spring-petclinic-rest` — the one corpus that sets a prefix at all. The bare KEY rots too:
# `server.context-path` became `server.servlet.context-path` in Boot 2. Recording the key WITH
# its framework and version range, and picking by what the module actually uses, is the only
# shape that stays correct across versions instead of merely going quiet. Ruled by the user
# 2026-10-18.
id: spring-boot

# **What serves a row, and which stack the module runs on** (ruling 3 of the 2026-10-30
# object-identity design). Both are framework words, so both are declared here rather than
# in code.
#
# `dispatchers` is the closed set a catalog's `dispatcher:` names and a key's `applies_to`
# lists: `spring` is Spring's own dispatcher (the DispatcherServlet, or the DispatcherHandler
# on the reactive stack), `servlet` a `@WebServlet` the container registers itself, and
# `jaxrs` Jersey. A catalog naming none takes no configured prefix.
dispatchers: [spring, servlet, jaxrs]

# The stack a module runs on, read IN ORDER off its dependency coordinates: the first entry
# whose coordinates it carries. It is Spring Boot's own `WebApplicationType
# .deduceFromClasspath`, which answers SERVLET where `DispatcherServlet` or Jersey's
# `ServletContainer` is on the classpath and REACTIVE where only `DispatcherHandler` is —
# so a servlet app that also carries WebFlux for its `WebClient` is a servlet app. A module
# carrying none of these runs no web stack, and no `prefixes` entry applies to it.
stacks:
  - stack: servlet
    coordinates:
      - org.springframework:spring-webmvc
      - org.glassfish.jersey.containers:jersey-container-servlet-core
  - stack: reactive
    coordinates: [org.springframework:spring-webflux]

prefixes:
  # **MEASURED, from the framework's own bytes** — `scripts/probes/cp38_boot_prefix_keys.md`
  # reads `META-INF/spring-configuration-metadata.json` out of the Boot jars, which names
  # every property Boot binds and records deprecations with their replacements. The context
  # path and the servlet path are declared and undeprecated at 2.7.18, 3.5.14 and 4.1.1; what
  # moved between those versions is the ARTIFACT that declares them
  # (`spring-boot-autoconfigure` to `spring-boot-web-server`/`spring-boot-webmvc`), never the
  # names.
  #
  # **Each key names the dispatchers it reaches** (ruling 3 of the 2026-10-30 object-identity
  # design). One servlet container can hold three dispatchers, and probe CP-57
  # (`scripts/probes/cp57-dispatcher-prefixes/RESULT.md`, Boot 3.5.14) requested every
  # handler under every combination of the three keys below:
  #
  #   * `spring` — the DispatcherServlet: MVC controllers, functional routes, Actuator on the
  #     main port, and Spring Data REST. Context path, then `spring.mvc.servlet.path`.
  #   * `servlet` — a `@WebServlet` the container registers itself, beside the
  #     DispatcherServlet. Context path only.
  #   * `jaxrs` — Jersey. Context path, then `spring.jersey.application-path`.
  #
  # `keys` is ORDERED and composes left to right over the keys that apply to a row's
  # dispatcher: `server.servlet.context-path=/petclinic` with `spring.mvc.servlet.path=/api`
  # serves `@GetMapping("/owners")` at `/petclinic/api/owners`, and a `@WebServlet("/legacy")`
  # beside it at `/petclinic/legacy`.
  #
  # **Two servlet entries, and the split is the Jersey key's.** CP-38's own method (the
  # metadata JSON) finds `spring.jersey.application-path` declared and undeprecated in
  # `spring-boot-autoconfigure` 2.7.18 and 3.5.14; at Boot 4 Jersey moved to its own module,
  # which no local repository holds, so the key is declared only below 4.0 — the reason the
  # reactive entry further down stops there too. The first entry a module's version admits
  # wins per dispatcher, so a module whose Boot version is unrecorded reads the first.
  - framework: org.springframework.boot
    versions: ">=2.0 <4.0"
    measured: ["2.7.18", "3.5.14"]
    stack: servlet
    keys:
      - { key: server.servlet.context-path, applies_to: [spring, servlet, jaxrs] }
      - { key: spring.mvc.servlet.path, applies_to: [spring] }
      - { key: spring.jersey.application-path, applies_to: [jaxrs] }
    # The protocols this container serves, and the two it is measured for. SSE is an HTTP
    # response from the same dispatcher, so it carries the same prefix.
    #
    # **`websocket` is deliberately ABSENT.** A handshake URL is very probably under the
    # context path too, and "very probably" is not a measurement — no probe has opened a
    # Boot websocket app, and a wrong prefix on a handshake path is a wrong row. A websocket
    # row therefore keeps its unprefixed path, which is what it published before this file
    # existed.
    protocols: [http, sse]

  # Boot 4 on the servlet stack: the same two keys, measured at 4.1.1 by CP-38, and the
  # dispatchers CP-57 measured them reaching at 3.5.14. No Jersey key, for the reason above;
  # a Jersey row on Boot 4 takes the context path alone.
  - framework: org.springframework.boot
    versions: ">=4.0"
    measured: ["4.1.1"]
    stack: servlet
    keys:
      - { key: server.servlet.context-path, applies_to: [spring, servlet, jaxrs] }
      - { key: spring.mvc.servlet.path, applies_to: [spring] }
    protocols: [http, sse]

  # The reactive stack, bounded to where it was measured. `spring.webflux.base-path` is
  # declared at 2.7.18 and 3.5.14; at 4.1.1 it is absent from the 37 metadata-carrying
  # artifacts this repository holds, and `spring-boot-webflux` is not among them — so Boot 4
  # reactive is OUTSIDE this row rather than covered by it (CP-38's own "what it does not
  # settle"). A `>=2.0` range here would claim a version nobody opened.
  #
  # CP-57's reactive variant (3.5.14) served the WebFlux controller, the functional route,
  # Actuator and a Spring Cloud Gateway route all under the base path, and none of them under
  # a leftover `server.servlet.context-path` — which is why the entries are split by `stack`
  # rather than composed: a reactive app has no servlet container for the context path to
  # belong to.
  - framework: org.springframework.boot
    versions: ">=2.0 <4.0"
    measured: ["2.7.18", "3.5.14"]
    stack: reactive
    keys:
      - { key: spring.webflux.base-path, applies_to: [spring] }
    protocols: [http, sse]

# NOT DECLARED, and the absences are the point:
#
# * Boot 1's `server.context-path` / `server.servlet-path`. No Boot 1 jar was opened, and §5.4
#   does not let a version scope be written from recollection. A Boot 1 module publishes
#   unprefixed paths exactly as today until someone measures and adds the row.
# * `management.endpoints.web.base-path`, which prefixes the ACTUATOR surface alone rather
#   than the module's. It composes after the keys above when management shares the main port
#   and does not when `management.server.port` moves it — an interaction CP-5 measured on one
#   port only, and CP-57 did not measure at all. Declaring it here would apply it to every
#   row the `spring` dispatcher serves.

# **A prefix installed PER CONTROLLER PACKAGE** (spec 2026-10-18 §4, `OI-148`), which is how
# `YunaiV/ruoyi-vue-pro` serves every one of its 480 endpoints under `/admin-api` or
# `/app-api` with nothing in any controller saying so:
#
#     prefixes.put(api.getPrefix(), clazz -> matcher.match(api.getController(),
#                                                          clazz.getPackage().getName()));
#     mapping.setPathPrefixes(prefixes);
#
# SIX framework symbols, and the pass holds the shape rather than a grammar nobody else
# would use. `resolve/path_prefix.py` states what it does with each: the installer names
# WHICH MAP carries prefixes, the `match`-on-a-package-name pair is what tells a prefix
# declaration from any other map of strings to predicates, and the annotation test is the
# predicate's other half — the framework asks it only about classes carrying that
# annotation, so a row whose handler does not is not a row this mapping serves.
class_path_prefixes:
  # Which library the symbols belong to. Documentation here rather than a gate — unlike the
  # key entries above, nothing is selected by it, because the symbols below already name the
  # library they come from.
  framework: org.springframework
  # `javap`, spring-webmvc 7.0.9: `setPathPrefixes(Map<String, Predicate<Class<?>>>)` on
  # `RequestMappingHandlerMapping`, and `AntPathMatcher.match(String, String)`. The same
  # symbols exist in 6.x, which no probe here has opened — so the row is bounded to what was
  # read, as every `measured:` block in this directory is.
  measured: ["7.0.9"]
  # **No `versions:` range, unlike the key entries above, and that is a difference in KIND.**
  # A configuration key rots silently: a module on a version that spells it differently is
  # read as not declaring it, so the range is the only thing that stops a prefix measured on
  # one generation from being applied to another. A SYMBOL cannot rot that way — a version
  # without `setPathPrefixes` has no call site to match, so the gate enforces itself and a
  # range would be an unmeasured claim doing no work.
  protocols: [http, sse]
  # Every symbol as a DOTTED type and a method name, which is the one notation a catalog
  # writes (`tests/architecture/test_source_rules.py::test_catalogs_use_one_fqn_notation`);
  # the loader converts them through `domain.symbols.type_descriptor`, the same seam every
  # other catalog type goes through.
  # **Two installers, one per stack.** The servlet and reactive `RequestMappingHandlerMapping`
  # are unrelated classes carrying the same method (`javap`: both declare
  # `private final Map pathPrefixes` and `setPathPrefixes`, at 5.3.39, 6.1.6 and 7.0.x), and
  # naming one would silently skip the other. A SUBCLASS of either counts too — extending
  # the mapping to customise it is ordinary Spring — which the pass resolves through the
  # module's own type hierarchy.
  installer:
    type:
      - org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping
      - org.springframework.web.reactive.result.method.annotation.RequestMappingHandlerMapping
    method: setPathPrefixes
  # **No type, deliberately.** javac emits `put` against whatever the variable was DECLARED
  # as — `Map` in `ruoyi`, `LinkedHashMap` wherever the author skipped the interface — and
  # the author's choice of static type is not what identifies the call. What identifies it is
  # the map it writes into: the pass accepts an entry only where that map is the one an
  # installer above receives, which is a stronger test than any owner and the one that keeps
  # an unrelated string-to-predicate map out.
  entry:
    method: put
  matcher:
    type: org.springframework.util.AntPathMatcher
    method: match
  # What makes the lambda a PACKAGE predicate rather than any other two-string match.
  package_of:
    type: java.lang.Class
    method: getPackage
  package_name:
    type: java.lang.Package
    method: getName
  # The predicate's OTHER half, and the reason a prefix does not reach every row in a
  # matching package: `clazz.isAnnotationPresent(RestController.class)`. The annotation is
  # read off the lambda rather than assumed, and a row whose handler class does not carry it
  # keeps the path it had. Read as the framework reads it — `Class#isAnnotationPresent` is
  # the class's OWN annotations, not a meta-annotation search, so a `@MyRestController`
  # composed from `@RestController` answers false here exactly as it does in Spring.
  annotation_test:
    type: java.lang.Class
    method: isAnnotationPresent
