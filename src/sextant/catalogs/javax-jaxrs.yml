id: javax-jaxrs
displayName: JAX-RS (javax.ws.rs) — pre-Jakarta (2.1.x)
style: annotation_driven
protocol: http
direction: inbound

# THE SAME RULE UNDER THE OTHER PACKAGE SPELLING, the `javax-servlet.yml` /
# `jakarta-servlet.yml` precedent: `jakarta-jaxrs.yml` is where every rule
# below is explained; this file records only what is different, which is the
# package name and nothing else. CP-18 measured the `javax.ws.rs` 2.1.1 jar
# directly (not mirrored): rows 1a-1c/2a-2c confirm the seven verb annotations
# still declare zero attributes and `@Path`/`@Produces`/`@Consumes` still
# carry the same `@Target`/`value()` shapes on that side of the rename — "the
# byte-identical shape, only the package name differing on the javax run".
#
# **Not `jakarta.ws.rs:jakarta.ws.rs-api:2.1.6`.** That coordinate is still
# `javax`-packaged (Jakarta EE 8), which would make this catalog's
# `detect.coordinates` list it too — but CP-18's environment resolved
# `javax.ws.rs:javax.ws.rs-api` 2.1.1 for the `javax` rows and never opened
# `jakarta.ws.rs-api:2.1.6` at all, so that specific coordinate's packaging is
# unmeasured here and is not added on the strength of a sibling artifact's
# reading (§5.4).
#
# `detect.superseded_by` mirrors `jakarta-jaxrs.yml`'s own (B/C Task 10 fix
# round 1): Quarkus REST is a `jakarta.ws.rs` implementation, never a
# `javax.ws.rs` one, so this list is defensive symmetry with the jakarta
# spelling's own reasoning rather than a case CP-18 or CP-19 measured — a
# module declaring both a `javax.ws.rs-api` and a Quarkus REST facet directly
# is not one either probe's fixture exercises.
detect:
  coordinates: ["javax.ws.rs:javax.ws.rs-api"]
  superseded_by:
    - io.quarkus:quarkus-rest
    - io.quarkus:quarkus-rest-jackson
    - io.quarkus:quarkus-rest-jsonb
    - io.quarkus:quarkus-rest-jaxb
    - io.quarkus:quarkus-rest-kotlin
    - io.quarkus:quarkus-rest-kotlin-serialization
    - io.quarkus:quarkus-rest-qute
    - io.quarkus:quarkus-resteasy-reactive
    - io.quarkus:quarkus-resteasy-reactive-jackson
    - io.quarkus:quarkus-resteasy-reactive-jsonb
    - io.quarkus:quarkus-resteasy-reactive-jaxb
    - io.quarkus:quarkus-resteasy-reactive-kotlin
    - io.quarkus:quarkus-resteasy-reactive-kotlin-serialization
    - io.quarkus:quarkus-resteasy-reactive-qute

measured:
  - { artifact: javax.ws.rs:javax.ws.rs-api, versions: ["2.1.1"],
      identity: reported, by: scripts/probes/cp18_jaxrs_api_and_implementations.md }

requires: [annotation_args, typed_signatures]

matches:
  type_annotation: javax.ws.rs.Path
  declared_on: class
  request_body:
    fallback: sole_unbound
    bound_by: [javax.ws.rs.PathParam, javax.ws.rs.QueryParam, javax.ws.rs.HeaderParam,
               javax.ws.rs.CookieParam, javax.ws.rs.FormParam, javax.ws.rs.MatrixParam,
               javax.ws.rs.BeanParam, javax.ws.rs.DefaultValue, javax.ws.rs.core.Context,
               javax.ws.rs.container.Suspended]
    excludes: [javax.ws.rs.sse.SseEventSink, javax.ws.rs.sse.Sse, javax.ws.rs.core.UriInfo,
               javax.ws.rs.core.HttpHeaders, javax.ws.rs.core.Request,
               javax.ws.rs.core.SecurityContext, javax.ws.rs.ext.Providers,
               javax.ws.rs.container.ResourceContext, javax.ws.rs.core.Configuration,
               javax.ws.rs.core.Application]
  # Spec 2026-09-19 §5b, mechanism 1. JAX-RS's rule is `requirement: optional` for every
  # entry: `@QueryParam`/`@HeaderParam`/`@CookieParam` declare `value` only (CP-25 row 9)
  # and an absent value is null — or `@DefaultValue`, a SEPARATE annotation carried on
  # `default_annotation` as information, never a 400 (RESTEasy Reactive's extractors and
  # `ParameterHandler.handleResult`, CP-25 row 10, the one implementation measured; the
  # specification's own text says the same of every implementation and no other was
  # opened here). The `value` alias defaults to the parameter's own name.
  request_params:
    - { annotation: javax.ws.rs.QueryParam,  kind: query,  name_attrs: [value], requirement: optional, default_annotation: javax.ws.rs.DefaultValue }
    - { annotation: javax.ws.rs.HeaderParam, kind: header, name_attrs: [value], requirement: optional, default_annotation: javax.ws.rs.DefaultValue }
    - { annotation: javax.ws.rs.CookieParam, kind: cookie, name_attrs: [value], requirement: optional, default_annotation: javax.ws.rs.DefaultValue }
  mapping:
    prefix_annotation: javax.ws.rs.Path
    prefix_from: [value]
    path_separator: "/"
    path_from: []
    path_from_siblings: [{ annotation: javax.ws.rs.Path, arg: value }]
    produces_from_siblings: [{ annotation: javax.ws.rs.Produces, arg: value }]
    consumes_from_siblings: [{ annotation: javax.ws.rs.Consumes, arg: value }]
    type_media_from_siblings:
      produces: [{ annotation: javax.ws.rs.Produces, arg: value }]
      consumes: [{ annotation: javax.ws.rs.Consumes, arg: value }]
    # Spec §3b word 3, opt-in (amended after the final review): the
    # inheritance walk carries the sibling lists above along with an inherited
    # verb, all or nothing — JAX-RS §3.6, CP-18 row 8.
    inherit_siblings: all_or_nothing
    method_from: method
    all_methods: []
    annotations:
      - { fqn: javax.ws.rs.GET,     method: [GET] }
      - { fqn: javax.ws.rs.POST,    method: [POST] }
      - { fqn: javax.ws.rs.PUT,     method: [PUT] }
      - { fqn: javax.ws.rs.DELETE,  method: [DELETE] }
      - { fqn: javax.ws.rs.PATCH,   method: [PATCH] }
      - { fqn: javax.ws.rs.HEAD,    method: [HEAD] }
      - { fqn: javax.ws.rs.OPTIONS, method: [OPTIONS] }

protocol_hint:
  protocol: sse
  hint_media: [text/event-stream]

# Identical to `jakarta-jaxrs.yml`'s own copy of `spring-web.yml`'s table —
# the ladder unions every catalog's `media_formats` rather than picking one.
media_formats:
  application/json: json
  application/x-protobuf: protobuf
  application/protobuf: protobuf
  avro/binary: avro
  application/xml: xml
  text/xml: xml

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# Every boundary `jakarta-jaxrs.yml` states (spec §3d) applies here unchanged;
# `docs/COVERAGE.md` states them once, for both.
