id: spring-rabbit-template
displayName: Spring AMQP (RabbitTemplate)
style: single_call
protocol: amqp
direction: outbound

detect:
  coordinates: ["org.springframework.amqp:spring-rabbit"]

measured:
  - { artifact: org.springframework.amqp:spring-rabbit, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }
  # `AmqpTemplate`, the interface a codebase declares its field as, is in
  # spring-amqp rather than spring-rabbit where the template class lives — so it
  # is a second artifact and needs its own row. CP-10's harness ABORTED until its
  # coordinate was added, which is how the wrong artifact was caught.
  - { artifact: org.springframework.amqp:spring-amqp, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }
  # The RECEIVE half (`G-44`): the nine `receive`/`receiveAndConvert`/`receiveAndReply`
  # overloads that name the queue at argument 0.
  - { artifact: org.springframework.amqp:spring-rabbit, versions: ["3.1.4"],
      identity: reported, by: scripts/probes/w59_template_receive_halves.md }

bean_model: spring

requires: [call_site, string_constants]

matches:
  # The interface a codebase more often declares its field as (§3.1). A call
  # site's owner is the DECLARED type, so a field typed by the interface
  # carried an owner this catalog did not name and matched nothing.
  # Measured: org.springframework.amqp:spring-amqp 3.1.4 declares every method matched below
  # (scripts/probes/cp10_catalog_descriptors.md, which is the probe that ran).
  owner:
    - org.springframework.amqp.rabbit.core.RabbitTemplate
    - org.springframework.amqp.core.AmqpTemplate
  # `receiveAndConvert(String, PTR)` carries a `ParameterizedTypeReference` at the position
  # `body_arg` reads (spring-resttemplate.yml:25 precedent) — the file had no
  # `type_carriers` before the RECEIVE half needed one.
  type_carriers: [org.springframework.core.ParameterizedTypeReference]
  # AMQP's wire identity is the exchange AND the routing key: a broker routes
  # on the pair, and either half alone names a different destination — the
  # exchange alone names everything bound to it, the routing key alone
  # names whatever the DEFAULT exchange routes it to. `address_separator`
  # is what renders the pair as one identity.
  address_separator: "/"
  # CHECKPOINT FACT (real javap descriptors, spring-rabbit 3.1.4). The three
  # declared rows and what each is:
  #   * `convertAndSend(Object)` arity 1 — both halves of the identity come
  #     from the template's own configuration, so there is no address
  #     argument at the call site at all and no capture is declared: `path`
  #     NULL, `resolution: unresolved` (I1). The `spring-jms-template.yml`
  #     `convertAndSend(Object)` precedent exactly.
  #   * `convertAndSend(String routingKey, Object message)` arity 2 — the
  #     DEFAULT-EXCHANGE overload. There is no exchange at the call, so the
  #     identity is the routing key alone rather than a routing key joined to
  #     an exchange this pass would be inventing. That is the framework's own
  #     rule and not a simplification: the default exchange routes a message
  #     to the queue whose name equals the routing key, so the routing key IS
  #     the destination. It stops being right if a future overload at this
  #     arity puts an exchange first.
  #   * `convertAndSend(String exchange, String routingKey, Object message)`
  #     arity 3 — the pair, rendered `exchange/routingKey`. An explicitly
  #     EMPTY exchange is the default exchange spelled out, and
  #     `_paired_destination` renders it as the routing key alone, so the two
  #     spellings of one wire destination stay ONE identity.
  #
  # THE OVERLOAD COLLISION, CLOSED (2O Task 7 review, Critical 1) rather than
  # stated. `convertAndSend` overloads on argument TYPE at both arities that
  # carry an address here (javap, spring-rabbit 3.1.4):
  #   arity 2 — `(String, Object)` and `(Object, MessagePostProcessor)`
  #   arity 3 — `(String, String, Object)`, `(String, Object, CorrelationData)`,
  #             `(String, Object, MessagePostProcessor)` and
  #             `(Object, MessagePostProcessor, CorrelationData)`
  # Matching on name+arity alone handed a sibling's PAYLOAD to `channel_arg`,
  # and a payload argument that itself READS — an ordinary lambda-free
  # `MessagePostProcessor` passed as a `class`/`instance` literal — published
  # a message body as a destination at `resolved`/`compiler`, indistinguishable
  # from an observation (§8: the failure mode is fabrication). So each address-
  # carrying row states its own erased JVM `descriptor`, which
  # `_matching_method` compares verbatim against the call site's own
  # `target.descriptor`.
  #
  # THE CONSEQUENCE, which is the boundary that replaces the old one: once ANY
  # row for a name+arity declares a descriptor, that arity is claimed, so a
  # call to an UNDECLARED arity-2 or arity-3 overload now derives NOTHING where
  # it used to derive an `unresolved` row. Under-reporting a stated boundary is
  # honest; publishing a payload as a destination is not. Recorded in
  # docs/COVERAGE.md, and it stops being right if a future spring-rabbit
  # release changes either declared descriptor — a re-typed parameter
  # falsifies it, and the check is `javap -s RabbitTemplate`.
  #
  # NOT declared, and each therefore deriving no row at all: `send(...)` (the
  # pre-converted `Message` form, at four arities), `convertSendAndReceive`
  # (request/reply), and every `convertAndSend` overload carrying a
  # `MessagePostProcessor` and/or a `CorrelationData` (arities 2 through 5).
  # Each is a COVERAGE boundary rather than a silent miss.
  methods:
    - { name: convertAndSend, arity: 3, descriptor: "(Ljava/lang/String;Ljava/lang/String;Ljava/lang/Object;)V",
        channel_arg: 0, address_arg_2: 1, body_arg: 2 }
    - { name: convertAndSend, arity: 2, descriptor: "(Ljava/lang/String;Ljava/lang/Object;)V",
        channel_arg: 0, body_arg: 1 }
    # Arity 1 is `convertAndSend(Object)` and nothing else, and it declares its
    # descriptor all the same (descriptor sweep R2). The earlier note here said
    # a unique overload needs none; true of THIS jar, and it made the file's
    # correctness depend on a fact no test could see. Java identifies a method
    # by name and parameter types in order, never by argument count (GUIDELINES
    # §8.1's language rule), so the rule the row mirrors is the descriptor
    # either way — and a unique overload's descriptor can only ever equal what
    # a matching call carries, so nothing derived today changes. What changes is
    # the day spring-rabbit adds a second one-argument `convertAndSend`: that
    # overload derives NOTHING rather than having its own argument 0 read as a
    # payload. Re-running `scripts/probes/cp10_catalog_descriptors/run.sh` is
    # the check.
    - { name: convertAndSend, arity: 1, descriptor: "(Ljava/lang/Object;)V", body_arg: 0 }

    # `G-44`, the RECEIVE half. MEASURED spring-rabbit 3.1.4 (`javap -s`, pasted in
    # scripts/probes/w59_template_receive_halves.md): nine overloads take the queue name at
    # argument 0. The destination-less ones read the configured default queue and stay
    # outside, on the line `convertAndSend(Object)` already sits on.
    - { name: receive, arity: 1, descriptor: "(Ljava/lang/String;)Lorg/springframework/amqp/core/Message;",
        channel_arg: 0, direction: inbound }
    - { name: receive, arity: 2, descriptor: "(Ljava/lang/String;J)Lorg/springframework/amqp/core/Message;",
        channel_arg: 0, direction: inbound }
    - { name: receiveAndConvert, arity: 1, descriptor: "(Ljava/lang/String;)Ljava/lang/Object;",
        channel_arg: 0, direction: inbound }
    - { name: receiveAndConvert, arity: 2, descriptor: "(Ljava/lang/String;J)Ljava/lang/Object;",
        channel_arg: 0, direction: inbound }
    - { name: receiveAndConvert, arity: 2,
        descriptor: "(Ljava/lang/String;Lorg/springframework/core/ParameterizedTypeReference;)Ljava/lang/Object;",
        channel_arg: 0, body_arg: 1, direction: inbound }
    - { name: receiveAndConvert, arity: 3,
        descriptor: "(Ljava/lang/String;JLorg/springframework/core/ParameterizedTypeReference;)Ljava/lang/Object;",
        channel_arg: 0, body_arg: 2, direction: inbound }
    # `receiveAndReply` is a receive whose reply goes to the message's OWN `replyTo`: one
    # inbound row on the queue and no outbound row, because no argument names the reply
    # address and publishing the receive queue as it would be a wrong row.
    - { name: receiveAndReply, arity: 2,
        descriptor: "(Ljava/lang/String;Lorg/springframework/amqp/core/ReceiveAndReplyCallback;)Z",
        channel_arg: 0, direction: inbound }
    - { name: receiveAndReply, arity: 4,
        descriptor: "(Ljava/lang/String;Lorg/springframework/amqp/core/ReceiveAndReplyCallback;Ljava/lang/String;Ljava/lang/String;)Z",
        channel_arg: 0, direction: inbound }
    - { name: receiveAndReply, arity: 3,
        descriptor: "(Ljava/lang/String;Lorg/springframework/amqp/core/ReceiveAndReplyCallback;Lorg/springframework/amqp/core/ReplyToAddressCallback;)Z",
        channel_arg: 0, direction: inbound }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale).
#
# No broker-specific wrapper is added: a `convertAndSend` call's payload
# argument is read directly off its declared position, never through an
# envelope type a `wrappers` rule would need to unwrap.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json

# D02's declared SLICE (F2 §3.8). `RabbitTemplate` declares 88 public methods at
# spring-amqp/spring-rabbit 3.1.4 and this catalog reads FOUR method names — `4 of 88`,
# `scripts/probes/w19_catalog_surface.md` — `convertAndSend` (three overloads, the send
# half) plus `receive`, `receiveAndConvert` and `receiveAndReply` (the nine `G-44`
# receive rows above). Of the 84 still unread, 17 take a `String` at argument 0; that
# test admits setters, so the list below separates the ones that address a wire from
# the ones that configure a default address.
#
# **The honest summary: this catalog models `convertAndSend` (send) and the nine
# queue-naming `receive`/`receiveAndConvert`/`receiveAndReply` overloads (`G-44`'s
# receive half). A module doing request/reply through `*SendAndReceive*` derives
# nothing here.**
slice:
  # `receive`, `receiveAndConvert` and `receiveAndReply` are no longer named here.
  # `test_catalog_slice_coverage.py` keys `slice.outside` on the method NAME alone
  # (`scripts/probes/w19_catalog_surface.md`'s enumeration does too — `read_names`
  # asks "does this catalog read this NAME on this owner", not "every overload of
  # it"), and `methods:` above now declares a row for each of the three names — so
  # the enumeration no longer lists any of them as an unread candidate, on EITHER
  # owner, and a `slice.outside` entry for them would be stale the moment it was
  # written (confirmed by running the check: `test_no_slice_names_a_method_the_-
  # enumeration_does_not_list` fails on exactly these six rows if they stay).
  #
  # The destination-less overloads this catalog still does not read — `receive()`,
  # `receive(long)`, `receiveAndConvert()`, `receiveAndConvert(long)`,
  # `receiveAndConvert(PTR)`, `receiveAndConvert(long, PTR)`, and every
  # `receiveAndReply` overload WITHOUT a queue name — read the template's
  # CONFIGURED DEFAULT queue, which is configuration this catalog does not join.
  # That gap is real and is recorded in `docs/COVERAGE.md` §5.9 rather than in this
  # block, because the block has no way to name "some overloads of a read name"
  # without the mechanical check reading it as stale prose.
  outside:
    - owner: org.springframework.amqp.rabbit.core.RabbitTemplate
      method_names: [send, sendAndReceive, convertSendAndReceive, convertSendAndReceiveAsType]
      why: >
        Outbound boundaries this catalog does NOT model. AMQP's wire identity is the
        exchange AND the routing key, which this file already composes for
        `convertAndSend`; these overloads take the same pair, so the gap is a fixture
        and a descriptor sweep rather than a design question. The `*SendAndReceive*`
        forms are request/reply and derive an outbound and an inbound row from one call.
    - owner: org.springframework.amqp.rabbit.core.RabbitTemplate
      method_names: [setExchange, setRoutingKey, setDefaultReceiveQueue, setReplyAddress]
      why: >
        Configuration, and the reason it matters: these set the DEFAULT address that a
        destination-less `send(Message)` or `receive()` then uses. A module configuring
        its template once and sending without an address everywhere is invisible to
        this catalog, and no row here says so — the same shape D02 §2's
        `configured address` form exists for, unread by this file.
    - owner: org.springframework.amqp.rabbit.core.RabbitTemplate
      method_names: [setBeanName, setEncoding, setCorrelationKey, setMandatoryExpressionString,
                setUserIdExpressionString, addConsumerArg, removeConsumerArg]
      why: >
        Configuration that names no destination. Not boundaries, and not candidates for
        one — they appear in the enumeration only because the argument-0 test admits any
        method whose first parameter is a `String`.
    - owner: org.springframework.amqp.rabbit.core.RabbitTemplate
      method_names: [nullSafeExchange, nullSafeRoutingKey]
      why: >
        Internal helpers that substitute the configured default when an argument is
        null. They are public on this class but they address nothing themselves.
    - owner: org.springframework.amqp.core.AmqpTemplate
      method_names: [convertSendAndReceive, convertSendAndReceiveAsType, send, sendAndReceive]
      why: >
        The interface `RabbitTemplate` implements, carried as an owner alternate since
        W10. Its slice is its implementation's slice: each method is outside for the
        reason given above for the same name on `RabbitTemplate`. (`receive`,
        `receiveAndConvert` and `receiveAndReply` are read on this owner too — `G-44`'s
        `methods:` rows above name `AmqpTemplate` beside `RabbitTemplate` implicitly,
        through the shared `owner:` list at the top of this file.)
