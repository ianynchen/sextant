        captures: { http_method: arg0, url: arg1 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: requestAbs, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, url: arg1 }, url_via: *template }
    # The forms naming a `RequestOptions`: its object read for the address (`options`), no row
    # unless its `setURI` or a later `uri(…)` names one. `request(RequestOptions)` (5.2.1) names
    # no verb either. The `serves` capture means "this chain derives a row", in either direction.
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/http/RequestOptions;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, options: arg1, serves: false } }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/RequestOptions;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { options: arg0, serves: false } }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Lio/vertx/core/http/RequestOptions;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, options: arg2, serves: false, destination: unread } }
    # The forms naming a `SocketAddress` (row 56): the request is SENT to that address, which
    # is not read here. At send time the request hands it to `RequestOptions.setServer` (row
    # 325), and the core client builds the address from the request's host and port only when
    # no server is set (row 326). So the row has no peer (`destination: unread`), whatever an
    # absolute URL's authority or a later `host(…)`/`port(…)` names: those are the request's
    # `Host`, not where it goes. The uri string is the path, read as any uri is.
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
