    - { owner: io.vertx.ext.web.client.WebClient, method: putAbs, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 }, url_via: *template }

    - { owner: io.vertx.ext.web.client.WebClient, method: delete, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: delete, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
