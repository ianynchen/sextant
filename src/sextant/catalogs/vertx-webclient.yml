        captures: { http_method: arg0, destination: unread, url: arg2 }, url_via: *mutiny_template }

  # THE STEPS: every method the `HttpRequest` INTERFACE declares to return `HttpRequest` and
  # answers with its receiver (row 111, the interface a call site names, row group (b)), per
  # version:
  #   * 4.5.10, 28: 24 abstract (every abstract one but `copy()`, which `HttpRequestImpl`
  #     answers with a new request) and 4 defaults, each answering a self-returning call
  #     (`basicAuthentication` ×2, `bearerTokenAuthentication`, `expect(Function)`);
  #   * 5.0.0, 27: `expect` gone, `routingKey` added, 3 defaults;
  #   * 5.2.1, 29: 5.0.0's, plus the defaults `putHeader(CharSequence, CharSequence)` and
  #     `putHeader(CharSequence, Iterable)`.
  # Every one is `returns_receiver: true`, so a statement-style request stays one chain, and
  # one returned through `as(…)` is the request it was called on. Owner-gated, because the
  # names are generic. `copy()` is not a step: it answers another request.
  steps:
    # The address parts a request may change after it was made: Vert.x applies the request's
    # own `host`, `port` (≥ 0) and `uri` at send time over what the root stored or an absolute
    # URL parsed (rows 129-130), so the last call wins, as a capture does. A `uri(…)` names
    # an address on a chain whose root read none (`serves: true`).
    - { owner: &requests [io.vertx.ext.web.client.HttpRequest, io.vertx.rxjava3.ext.web.client.HttpRequest, io.vertx.mutiny.ext.web.client.HttpRequest], method: method, descriptor: "(Lio/vertx/core/http/HttpMethod;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0 }, returns_receiver: true }
    - { owner: *requests, method: uri, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { url: arg0, serves: true }, returns_receiver: true }
    - { owner: *requests, method: host, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { host: arg0 }, returns_receiver: true }
    - { owner: *requests, method: port, descriptor: "(I)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { port: arg0 }, returns_receiver: true }
    # Headers and query parameters accumulate, one `endpoint_metadata` entry per call, as
    # `spring-webclient.yml`'s `header` and `queryParam` do. `putHeader` is matched by name:
    # every overload (two at 4.5.10 and 5.0.0, four at 5.2.1, row 63) takes the name at
    # argument 0 and the value at argument 1. `putHeaders(MultiMap)` sets many at once from a
    # map whose entries are not read here.
    - { owner: *requests, method: putHeader,
        collects: { kind: header, name: arg0, value: arg1 }, returns_receiver: true }
    - { owner: *requests, method: addQueryParam, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        collects: { kind: query, name: arg0, value: arg1 }, returns_receiver: true }
    - { owner: *requests, method: setQueryParam, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        collects: { kind: query, name: arg0, value: arg1 }, returns_receiver: true }
    # THE BODY-CARRYING TERMINALS, named again in `terminal` below: the body a request sends
    # (rows 74-76). `sendForm`, `sendMultipartForm` and `sendStream` carry no body shape: a
    # form or a stream has no contract type to publish (spec §3d).
    - { owner: *requests, method: sendJson, captures: { body: arg0 } }
    - { owner: *requests, method: sendJsonObject, captures: { body: arg0 } }
    - { owner: *requests, method: sendBuffer, captures: { body: arg0 } }
    # The wrappers' own sends that carry a body (rows 298, 302; the three lists are `javap`
    # measured, each taking the body at argument 0 like the core's): RxJava 3's `rxSend…`
    # (`send…` answers a `Single` too, and is the entries above), and Mutiny's `…AndAwait`
    # and `…AndForget` beside its `Uni`-returning `send…`.
    - { owner: io.vertx.rxjava3.ext.web.client.HttpRequest, method: rxSendJson, captures: { body: arg0 } }
    - { owner: io.vertx.rxjava3.ext.web.client.HttpRequest, method: rxSendJsonObject, captures: { body: arg0 } }
    - { owner: io.vertx.rxjava3.ext.web.client.HttpRequest, method: rxSendBuffer, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendJsonAndAwait, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendJsonAndForget, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendJsonObjectAndAwait, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendJsonObjectAndForget, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendBufferAndAwait, captures: { body: arg0 } }
    - { owner: io.vertx.mutiny.ext.web.client.HttpRequest, method: sendBufferAndForget, captures: { body: arg0 } }
    # Self-returning and carrying nothing a row reads.
    # The wrappers' `as` takes their own `BodyCodec` (rows 205, 284) and answers a new wrapper
    # around the SAME core request (`javap`: `newInstance(delegate.as(…))`). It has no entry for
    # them: an unmatched step passes through uncaptured, and no row changes (the test
    # `test_a_wrapper_request_typed_by_as_and_then_configured_by_statements_keeps_them`).
    - { owner: io.vertx.ext.web.client.HttpRequest, method: as, descriptor: "(Lio/vertx/ext/web/codec/BodyCodec;)Lio/vertx/ext/web/client/HttpRequest;", returns_receiver: true }
    - { owner: *requests, method: authentication, returns_receiver: true }
    - { owner: *requests, method: basicAuthentication, returns_receiver: true }
    - { owner: *requests, method: bearerTokenAuthentication, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;", returns_receiver: true }
    - { owner: *requests, method: connectTimeout, returns_receiver: true }
    - { owner: *requests, method: expect, returns_receiver: true }
    - { owner: *requests, method: followRedirects, descriptor: "(Z)Lio/vertx/ext/web/client/HttpRequest;", returns_receiver: true }
    - { owner: *requests, method: idleTimeout, returns_receiver: true }
    - { owner: *requests, method: multipartMixed, returns_receiver: true }
    - { owner: *requests, method: proxy, returns_receiver: true }
    - { owner: *requests, method: putHeaders, returns_receiver: true }
    - { owner: *requests, method: routingKey, returns_receiver: true }
    - { owner: *requests, method: setTemplateParam, returns_receiver: true }
    - { owner: *requests, method: ssl, descriptor: "(Ljava/lang/Boolean;)Lio/vertx/ext/web/client/HttpRequest;", returns_receiver: true }
    - { owner: *requests, method: timeout, descriptor: "(J)Lio/vertx/ext/web/client/HttpRequest;", returns_receiver: true }
    - { owner: *requests, method: traceOperation, returns_receiver: true }
    - { owner: *requests, method: virtualHost, returns_receiver: true }
  # Every `send*` sends the request (rows 73-79): with and without a trailing callback at
  # 4.5.10, the `Future` form alone at 5.0.0 and 5.2.1. A request never sent derives nothing.
  # The wrappers add their own: RxJava 3's `rxSend…` family (row 298) beside `send…` (which
  # answers a `Single`, row 206), and Mutiny's `…AndAwait` and `…AndForget` (row 302) beside
  # `send…` (which answers a `Uni`, row 285). A `Single` or `Uni` is sent when subscribed; the
  # row is the call that builds the request to send, as for any asynchronous client.
  terminal: [send, sendJson, sendJsonObject, sendBuffer, sendForm, sendMultipartForm, sendStream,
             rxSend, rxSendJson, rxSendJsonObject, rxSendBuffer, rxSendForm, rxSendMultipartForm, rxSendStream,
             sendAndAwait, sendAndForget, sendJsonAndAwait, sendJsonAndForget,
             sendJsonObjectAndAwait, sendJsonObjectAndForget, sendBufferAndAwait, sendBufferAndForget,
             sendFormAndAwait, sendFormAndForget, sendMultipartFormAndAwait, sendMultipartFormAndForget,
             sendStreamAndAwait, sendStreamAndForget]

# Shared verbatim across every outbound catalog on purpose — `okhttp.yml` carries the
# reason: shape expansion is a global insert-if-absent pass keyed on the type symbol
# alone, so every outbound catalog's `wrappers` must agree.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,              payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                       payload_arg: 0, semantics: optional }
  - { type: retrofit2.Call,                           payload_arg: 0, semantics: async }

# D02 §1b — the payload-type blocks, declared once in `shape-models/json.yml`.
shape_model: json

# BOUNDARIES, stated rather than discovered:
#   * THE CLIENT'S DEFAULT HOST AND PORT where its options object is not reached (a client
#     built in another jar, an options object handed to code whose body is not read): the
#     row keeps its path with no peer. A `Properties.getProperty("key")` host is not read as
#     a configuration key (no configuration-read table exists).
#   * A request sent to a `SocketAddress`: the address is not read, so the row has no peer.
#   * `setTemplateParam`: a template hole filled per request stays a hole.
#   * A CALL TO THE MODULE'S OWN SERVER (`localhost` in the module that serves it) is an
#     outbound row: the self-call rule covers gRPC only (OI-198).
#   * THE RXJAVA 3 AND MUTINY WRAPPERS (`io.vertx.rxjava3.ext.web.client.*`,
#     `io.vertx.mutiny.ext.web.client.*`, row group (g)) are owners of every root and step
#     above, with their own descriptors where a parameter is the wrapper's own type
#     (`UriTemplate`, RxJava 3 4.5.10's `SocketAddress`, `BodyCodec`), and their own sends
#     among the terminals. A wrapper client's defaults are read by `client-models/vertx-web.yml`,
#     which names the wrappers' factories (`create`, `wrap`) beside the core's. Their response
#     types (`Single`, `Uni`) are not payload `wrappers` here: that list is shared verbatim by
#     every outbound catalog, and this one derives no response shape.
#   * VERT.X 3.x, unmeasured and unmatched by every descriptor above.
