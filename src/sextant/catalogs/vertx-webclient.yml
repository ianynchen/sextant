    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Ljava/lang/String;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 } }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Ljava/lang/String;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg3 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Ljava/lang/String;Ljava/lang/String;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg3 } }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, url: arg1 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, host: arg1, url: arg2 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;ILjava/lang/String;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg4 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Ljava/lang/String;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg3 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: requestAbs, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Lio/vertx/mutiny/uritemplate/UriTemplate;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 }, url_via: *mutiny_template }
    - { owner: io.vertx.mutiny.ext.web.client.WebClient, method: requestAbs, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/mutiny/core/net/SocketAddress;Ljava/lang/String;)Lio/vertx/mutiny/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 } }
