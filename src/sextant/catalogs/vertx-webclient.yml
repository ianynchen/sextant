        captures: { http_method: HEAD, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: headAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
