    - { owner: io.vertx.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg2 }, url_via: *template }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg3 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg3 }, url_via: *template }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/core/net/SocketAddress;ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, destination: unread, url: arg4 } }
