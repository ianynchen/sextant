    - { owner: *clients, method: head, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: HEAD, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: head, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: HEAD, url: arg0 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: head, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
