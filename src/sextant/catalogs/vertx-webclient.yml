id: vertx-webclient
displayName: Vert.x WebClient
style: fluent
protocol: http
direction: outbound

# A Vert.x WebClient call is a chain on a `WebClient` (spec 2026-10-30 §3d): a root that
# names the verb and the address (`client.get(8080, "inventory", "/stock")`), steps on the
# `HttpRequest` it returns that refine it (`putHeader`, `addQueryParam`, `timeout`), and a
# `send*` call that sends it. Read by the engine `vertx-web.yml` and `spring-webclient.yml`
# share.
#
# What javac writes, measured (CP-56 row group (h), rows 317-322,
# `scripts/probes/cp56_vertx_web.md`): every call is `invokeinterface` on the interface
# (`WebClient`, `HttpRequest`), the root's result the receiver of the next call, an `int`
# port pushed as a literal (row 317). The statement style, `HttpRequest r = client.post(q);
# r.addQueryParam(…); r.send();`, calls each later method on the local and pops the result
# (row 322): every self-returning call is flagged `returns_receiver` below, so those
# statements are one chain and not a fork per call, and a request a helper builds and
# returns is reached from the caller's `send()` by the walk back along receivers.

detect:
  coordinates: ["io.vertx:vertx-web-client"]

# Three lines, each as its jars' own manifests state it (CP-56's version scope). The RxJava 3
# wrappers ship in `vertx-rx-java3` at the same three versions, and the Mutiny wrappers in
# `smallrye-mutiny-vertx-web-client` at 3.23.1 (over Vert.x 4.5) and 4.0.2 (over Vert.x 5):
# their owners are cited in row group (g), and the few methods that group does not list are
# the ones `javap` measured, named where they appear.
measured:
  - { artifact: io.vertx:vertx-web-client, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.vertx:vertx-core, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.vertx:vertx-rx-java3, versions: ["4.5.10", "5.0.0", "5.2.1"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }
  - { artifact: io.smallrye.reactive:smallrye-mutiny-vertx-web-client, versions: ["3.23.1", "4.0.2"],
      identity: reported, by: scripts/probes/cp56_vertx_web.md }

requires: [call_site, string_constants, chain_reconstruction]

# The client's default host and port, set on the options object handed to `WebClient.create`
# (spec §3d): declared once in `client-models/vertx-web.yml`. The client is the receiver of the
# root call (`client.get(…)`).
client_model: vertx-web

matches:
  client_base: { client_arg: receiver }

  # The verb a `getstatic HttpMethod.X` names (row 133), the table `vertx-web.yml` declares,
  # spelled again because a `fluent` catalog keeps it here. `request(HttpMethod, …)` and the
  # `method(HttpMethod)` step read it.
  verb_values:
    fields:
      "io.vertx.core.http.HttpMethod#OPTIONS": OPTIONS
      "io.vertx.core.http.HttpMethod#GET": GET
      "io.vertx.core.http.HttpMethod#HEAD": HEAD
      "io.vertx.core.http.HttpMethod#POST": POST
      "io.vertx.core.http.HttpMethod#PUT": PUT
      "io.vertx.core.http.HttpMethod#DELETE": DELETE
      "io.vertx.core.http.HttpMethod#TRACE": TRACE
      "io.vertx.core.http.HttpMethod#CONNECT": CONNECT
      "io.vertx.core.http.HttpMethod#PATCH": PATCH
      "io.vertx.core.http.HttpMethod#QUERY": QUERY
      "io.vertx.core.http.HttpMethod#PROPFIND": PROPFIND
      "io.vertx.core.http.HttpMethod#PROPPATCH": PROPPATCH
      "io.vertx.core.http.HttpMethod#MKCOL": MKCOL
      "io.vertx.core.http.HttpMethod#COPY": COPY
      "io.vertx.core.http.HttpMethod#MOVE": MOVE
      "io.vertx.core.http.HttpMethod#LOCK": LOCK
      "io.vertx.core.http.HttpMethod#UNLOCK": UNLOCK
      "io.vertx.core.http.HttpMethod#MKCALENDAR": MKCALENDAR
      "io.vertx.core.http.HttpMethod#REPORT": REPORT
      "io.vertx.core.http.HttpMethod#CHECKOUT": CHECKOUT
      "io.vertx.core.http.HttpMethod#CHECKIN": CHECKIN
      "io.vertx.core.http.HttpMethod#UNCHECKOUT": UNCHECKOUT
      "io.vertx.core.http.HttpMethod#MKWORKSPACE": MKWORKSPACE
      "io.vertx.core.http.HttpMethod#UPDATE": UPDATE
      "io.vertx.core.http.HttpMethod#LABEL": LABEL
      "io.vertx.core.http.HttpMethod#MERGE": MERGE
      "io.vertx.core.http.HttpMethod#MKACTIVITY": MKACTIVITY
      "io.vertx.core.http.HttpMethod#ORDERPATCH": ORDERPATCH
      "io.vertx.core.http.HttpMethod#ACL": ACL
      "io.vertx.core.http.HttpMethod#SEARCH": SEARCH

  # THE ROOTS, every `WebClient` method that makes a request (rows 44-57), each by its erased
  # descriptor, the same at all three versions except `request(RequestOptions)` (5.2.1 only,
  # row 56). Each form captures the address parts it names, and the engine composes them into
  # one peer, `host` or `host:port`, which is what an absolute URL's authority splits into
  # (`getAbs("http://inventory:8080/…")` → `inventory:8080`):
  #   * `x(uri)` → `url`, the host and port left to the client's defaults (row 124);
  #   * `x(host, uri)` → `host` and `url`, the port left to the client's default;
  #   * `x(port, host, uri)` → `port`, `host` and `url`;
  #   * `xAbs(url)` → the whole address, split by CP-2.
  # The defaults are the client's (`client_model: vertx-web`): read off its options object, they
  # fill the parts a request names none of, one row per path the client's options are read on;
  # unset (`localhost` and `80`, rows 131-132) they are published only where the path proves
  # them unset (the client model's `unset`, spec 2026-11-02-per-path-truth rule 5).
  #
  # A `UriTemplate` form reads its template off `UriTemplate.of(String)`, the one factory the
  # type declares (`url_via`; measured with `javap -s` on vertx-uri-template 4.5.10, 5.0.0 and
  # 5.2.1, each as its manifest states it: `public static UriTemplate of(String)`, descriptor
  # `(Ljava/lang/String;)Lio/vertx/uritemplate/UriTemplate;`). Its `{var}` holes stay holes;
  # `setTemplateParam` fills them per request, which is not read (spec §4).
  #
  # A `RequestOptions` form reads its options object (`options: argN`) with the client model's
  # setters: `setURI` the address, `setHost`/`setPort` the request's own parts. It derives
  # nothing (`serves: false`) unless that uri, or a later `uri(…)`, names one (spec §3d). A
  # `SocketAddress` form reads its uri string as the path, with no peer (rows 325-326).
  roots:
    - { owner: &clients [io.vertx.ext.web.client.WebClient, io.vertx.rxjava3.ext.web.client.WebClient, io.vertx.mutiny.ext.web.client.WebClient], method: get, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, url: arg0 } }
    - { owner: *clients, method: get, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, host: arg0, url: arg1 } }
    - { owner: *clients, method: get, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: get, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, url: arg0 }, url_via: &template [{ owner: io.vertx.uritemplate.UriTemplate, method: of, arg: 0 }] }
    - { owner: io.vertx.ext.web.client.WebClient, method: get, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, host: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: get, descriptor: "(ILjava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: getAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: getAbs, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: GET, url: arg0 }, url_via: *template }

    - { owner: *clients, method: post, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, url: arg0 } }
    - { owner: *clients, method: post, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, host: arg0, url: arg1 } }
    - { owner: *clients, method: post, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: post, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, url: arg0 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: post, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, host: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: post, descriptor: "(ILjava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: postAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: postAbs, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: POST, url: arg0 }, url_via: *template }

    - { owner: *clients, method: put, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 } }
    - { owner: *clients, method: put, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, host: arg0, url: arg1 } }
    - { owner: *clients, method: put, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: put, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: put, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, host: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: put, descriptor: "(ILjava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: putAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: putAbs, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 }, url_via: *template }

    - { owner: *clients, method: delete, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, url: arg0 } }
    - { owner: *clients, method: delete, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, host: arg0, url: arg1 } }
    - { owner: *clients, method: delete, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: delete, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, url: arg0 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: delete, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, host: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: delete, descriptor: "(ILjava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: deleteAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: deleteAbs, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: DELETE, url: arg0 }, url_via: *template }

    - { owner: *clients, method: patch, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, url: arg0 } }
    - { owner: *clients, method: patch, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, host: arg0, url: arg1 } }
    - { owner: *clients, method: patch, descriptor: "(ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, port: arg0, host: arg1, url: arg2 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: patch, descriptor: "(Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, url: arg0 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: patch, descriptor: "(Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, host: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: patch, descriptor: "(ILjava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PATCH, port: arg0, host: arg1, url: arg2 }, url_via: *template }
    - { owner: *clients, method: patchAbs, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
