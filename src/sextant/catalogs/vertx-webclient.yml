    # `request(HttpMethod, …)` (row 56) and `requestAbs(HttpMethod, …)` (row 57): the same
    # address forms one argument along, the verb read off the constant (`verb_values`).
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, url: arg1 } }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, host: arg1, url: arg2 } }
    - { owner: *clients, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;ILjava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, port: arg1, host: arg2, url: arg3 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, url: arg1 }, url_via: *template }
    - { owner: io.vertx.ext.web.client.WebClient, method: request, descriptor: "(Lio/vertx/core/http/HttpMethod;Ljava/lang/String;Lio/vertx/uritemplate/UriTemplate;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: arg0, host: arg1, url: arg2 }, url_via: *template }
