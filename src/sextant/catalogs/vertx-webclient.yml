    - { owner: io.vertx.ext.web.client.WebClient, method: put, descriptor: "(Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
        captures: { http_method: PUT, url: arg0 } }
    - { owner: io.vertx.ext.web.client.WebClient, method: put, descriptor: "(Ljava/lang/String;Ljava/lang/String;)Lio/vertx/ext/web/client/HttpRequest;",
