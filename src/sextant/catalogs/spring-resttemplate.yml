id: spring-resttemplate
displayName: Spring RestTemplate
style: single_call
protocol: http
direction: outbound

detect:
  coordinates: ["org.springframework:spring-web"]

measured:
  - { artifact: org.springframework:spring-web, versions: ["6.1.6"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }

requires: [call_site, string_constants]

matches:
  owner: org.springframework.web.client.RestTemplate
  type_carriers: [org.springframework.core.ParameterizedTypeReference]
  call_wrappers:
    - { type: org.springframework.http.HttpEntity, payload_ctor_arg: 0 }
  # CONVERTED WHOLESALE (descriptor sweep R4), from seven rows carrying NEITHER
  # `arity` NOR `descriptor` to one row per overload carrying BOTH — twenty-six
  # rows, which is every `getForObject`, `getForEntity`, `postForObject`,
  # `postForEntity`, `put`, `delete` and `exchange` overload `RestTemplate`
  # declares (javap -p -s, spring-web 6.1.6, recorded in
  # `scripts/probes/cp10_catalog_descriptors.md`).
  #
  # THE FILE WAS BENIGN AS IT STOOD, and that is stated plainly rather than
  # dressed up as a bug fix: position 0 is the URL in every overload that can
  # carry a string there, so no call could reach a row that read the wrong
  # position as an address. Two `exchange` overloads put a `RequestEntity` at
  # position 0, and a `RequestEntity` parameter cannot accept a `String`
  # constant, so `url_of` read them as unresolved and nothing wrong was
  # derived. What is closed here is the SHAPE that produced the AMQP, JMS and
  # SOAP fabrications elsewhere: a row matching on a rule Java does not have.
  #
  # WHY IT HAD TO BE ALL OR NOTHING, and the single most dangerous edit anyone
  # could make to this file: an arity-less row is a candidate at EVERY argument
  # count (`_matching_method`), and the claim a descriptor makes is computed
  # over that candidate set. So adding ONE descriptor to ONE arity-less row here
  # would have claimed every argument count for that name and made every other
  # overload of it derive NOTHING — silently, since a claimed arity has no error
  # path. A half-conversion of this file is strictly worse than no conversion.
  #
  # THE TWO `RequestEntity` ROWS DECLARE NO CAPTURES AT ALL —
  # `spring-sqs-template.yml`'s precedent, and the same honest-empty shape the
  # `Message` rows in the Kafka templates keep. `exchange(RequestEntity, Class)`
  # carries its url, its verb and its body INSIDE the `RequestEntity`, which no
  # capture this style has can reach; declaring `url_arg: 0` for them would read
  # an argument that is not an address, and declaring nothing at all would make
  # them derive no row where they used to derive an unresolved one. A matching
  # row with no captures preserves exactly what they derived before.
  #
  # `[Ljava/lang/Object;` and `Ljava/util/Map;` are the two uri-variable
  # spellings of one method, and both are declared: a varargs call site records
  # ONE trailing `array` argument, so the arity is the same for either, and the
  # declared positions this row reads are all ahead of it (`_arg_at` answers
  # None past the end, which is how the `URI` overloads' shorter argument lists
  # already work). Re-running `scripts/probes/cp10_catalog_descriptors/run.sh`
  # is the check on all twenty-six.
  methods:
    - { name: getForObject, arity: 3, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Class;[Ljava/lang/Object;)Ljava/lang/Object;" }
    - { name: getForObject, arity: 3, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Class;Ljava/util/Map;)Ljava/lang/Object;" }
    - { name: getForObject, arity: 2, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/net/URI;Ljava/lang/Class;)Ljava/lang/Object;" }
    - { name: getForEntity, arity: 3, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Class;[Ljava/lang/Object;)Lorg/springframework/http/ResponseEntity;" }
    - { name: getForEntity, arity: 3, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Class;Ljava/util/Map;)Lorg/springframework/http/ResponseEntity;" }
    - { name: getForEntity, arity: 2, http_method: GET, url_arg: 0, response_arg: 1,
        descriptor: "(Ljava/net/URI;Ljava/lang/Class;)Lorg/springframework/http/ResponseEntity;" }
    - { name: postForObject, arity: 4, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/lang/Class;[Ljava/lang/Object;)Ljava/lang/Object;" }
    - { name: postForObject, arity: 4, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/lang/Class;Ljava/util/Map;)Ljava/lang/Object;" }
    - { name: postForObject, arity: 3, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/net/URI;Ljava/lang/Object;Ljava/lang/Class;)Ljava/lang/Object;" }
    - { name: postForEntity, arity: 4, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/lang/Class;[Ljava/lang/Object;)Lorg/springframework/http/ResponseEntity;" }
    - { name: postForEntity, arity: 4, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/lang/Class;Ljava/util/Map;)Lorg/springframework/http/ResponseEntity;" }
    - { name: postForEntity, arity: 3, http_method: POST, url_arg: 0, body_arg: 1, response_arg: 2,
        descriptor: "(Ljava/net/URI;Ljava/lang/Object;Ljava/lang/Class;)Lorg/springframework/http/ResponseEntity;" }
    - { name: put, arity: 3, http_method: PUT, url_arg: 0, body_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;[Ljava/lang/Object;)V" }
    - { name: put, arity: 3, http_method: PUT, url_arg: 0, body_arg: 1,
        descriptor: "(Ljava/lang/String;Ljava/lang/Object;Ljava/util/Map;)V" }
    - { name: put, arity: 2, http_method: PUT, url_arg: 0, body_arg: 1,
        descriptor: "(Ljava/net/URI;Ljava/lang/Object;)V" }
    - { name: delete, arity: 2, http_method: DELETE, url_arg: 0,
        descriptor: "(Ljava/lang/String;[Ljava/lang/Object;)V" }
    - { name: delete, arity: 2, http_method: DELETE, url_arg: 0,
        descriptor: "(Ljava/lang/String;Ljava/util/Map;)V" }
    - { name: delete, arity: 1, http_method: DELETE, url_arg: 0,
        descriptor: "(Ljava/net/URI;)V" }
    - { name: exchange, arity: 5, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/lang/String;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Ljava/lang/Class;[Ljava/lang/Object;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 5, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/lang/String;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Ljava/lang/Class;Ljava/util/Map;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 4, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/net/URI;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Ljava/lang/Class;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 5, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/lang/String;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Lorg/springframework/core/ParameterizedTypeReference;[Ljava/lang/Object;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 5, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/lang/String;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Lorg/springframework/core/ParameterizedTypeReference;Ljava/util/Map;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 4, method_arg: 1, url_arg: 0, body_arg: 2, response_arg: 3,
        descriptor: "(Ljava/net/URI;Lorg/springframework/http/HttpMethod;Lorg/springframework/http/HttpEntity;Lorg/springframework/core/ParameterizedTypeReference;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 2,
        descriptor: "(Lorg/springframework/http/RequestEntity;Ljava/lang/Class;)Lorg/springframework/http/ResponseEntity;" }
    - { name: exchange, arity: 2,
        descriptor: "(Lorg/springframework/http/RequestEntity;Lorg/springframework/core/ParameterizedTypeReference;)Lorg/springframework/http/ResponseEntity;" }
  # Which annotations carry configuration onto a field, a constructor
  # parameter or a whole properties type — the field ladder's own vocabulary
  # (2F design §4), so no framework name reaches the engine. A `url_arg` that
  # reads a `@Value`-annotated field rather than a literal resolves to the
  # expression behind it; `getter_prefixes` is the accessor convention the
  # properties rung de-prefixes with (`getUrl` → `url`) before relaxed-binding
  # the name against the type's own declared fields.
  field_sources:
    value_annotation: org.springframework.beans.factory.annotation.Value
    properties_annotation: org.springframework.boot.context.properties.ConfigurationProperties
    prefix_from: prefix
    getter_prefixes: [get, is]

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  # A `class` literal or a constructed `instance` reaches payload rooting as a
  # bare symbol: the extractor's own wire projection travels on a type
  # reference (D00 §5a), and a call argument carries none. So the types that
  # projection already flattens — the boxes and String — are declared here
  # too, with exactly the `wire`/`format` it emits for each, so a captured
  # `String.class` and a scanned `String` field can never disagree. `Void`
  # reaches no wire type at all: the empty `wire` a `void` return already
  # carries reads as "no payload", never as a shape nobody can expand.
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
