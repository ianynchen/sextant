id: spring-stomp
displayName: Spring STOMP messaging (@MessageMapping)
style: annotation_driven
protocol: websocket
direction: inbound

detect:
  coordinates: ["org.springframework:spring-messaging"]

requires: [annotation_args, typed_signatures]

matches:
  # `@Payload`'s the same `org.springframework.messaging.handler.annotation`
  # package spring-kafka.yml/spring-jms.yml already read a `@Payload` off —
  # one library, one attribute, regardless of which transport carries it.
  # `place(OrderView order)`'s one bare parameter reaches this through the
  # `sole_unannotated` fallback exactly as an unannotated Kafka listener
  # parameter does; `board()` declares no parameter at all, so neither rung
  # ever fires for it and it derives no request shape.
  request_body: { annotation: org.springframework.messaging.handler.annotation.Payload,
                  fallback: sole_unannotated }
  mapping:
    # CHECKPOINT FACT (Phase 2H Task 2, checkpoint answer 5): class-level
    # `@MessageMapping("/orders")`, method-level `@MessageMapping("/place")`
    # and `@SubscribeMapping("/board")` are ALL array-valued in bytecode
    # (`{"value": ["/orders"]}` etc.) — unlike jakarta WebSocket's scalar
    # `@ServerEndpoint`, but the same scalar-or-array read already handles
    # either shape with no new vocabulary.
    path_from: [value]
    prefix_from: [value]
    # Neither mapping annotation declares a `method` attribute; the name is
    # borrowed and never populated (spring-jms.yml/spring-kafka.yml
    # precedent), which is what keeps every row verbless below.
    method_from: method
    # Verbless (D02 §2, amended): a STOMP destination declares no
    # HTTP-style verb.
    all_methods: []
    # `@MessageMapping` plays both roles in this one catalog — the
    # `prefix_annotation` role at class level (`OrderStompController`'s own
    # `@MessageMapping("/orders")`) and an ordinary `mapping.annotations`
    # entry at method level (`place`'s own `@MessageMapping("/place")`) —
    # exactly the double duty spring-kafka.yml's class-level, polymorphic
    # `@KafkaListener` already plays for `@KafkaHandler`. `annotations_effective`
    # (`derive_endpoints.sql`) and `prefixes` join on different roles
    # (`construct_kind IN ('method','function')` vs a type target), so the
    # one fqn cannot collide with itself here either (checkpoint answer 5).
    prefix_annotation: org.springframework.messaging.handler.annotation.MessageMapping
    annotations:
      - { fqn: org.springframework.messaging.handler.annotation.MessageMapping }
      # `@SubscribeMapping("/board")` carries no class-level shape of its
      # own — it composes under whatever `@MessageMapping` prefix the
      # enclosing class already declares, the same class-level join every
      # method-level mapping annotation shares (checkpoint answer 5:
      # `"/orders"` + `"/board"` = `"/orders/board"`).
      - { fqn: org.springframework.messaging.simp.annotation.SubscribeMapping }
  # D02 §2's `reply` block (spring-kafka.yml's own precedent, the ONLY
  # shipped catalog with one before this task): `@SendTo` derives a second,
  # OUTBOUND row per listed destination — `place`'s own
  # `@SendTo("/topic/order-placed")` — plus a path-NULL `unresolved` row for
  # any value-returning STOMP handler this catalog's own rows produced that
  # declares no `@SendTo` at all (none in the fixture: `board`'s own
  # `@SubscribeMapping` handler also returns `OrderView`, so it gets one too
  # — the reply block runs over every handler `spring-stomp`'s own rows
  # named, not only `@MessageMapping` ones).
  reply:
    annotation: org.springframework.messaging.handler.annotation.SendTo
    destination_from: value

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

nullability:
  nullable: [org.jspecify.annotations.Nullable, org.springframework.lang.Nullable,
             javax.annotation.Nullable, jakarta.annotation.Nullable,
             org.jetbrains.annotations.Nullable]
  not_null: [org.jspecify.annotations.NonNull, org.springframework.lang.NonNull,
             org.jetbrains.annotations.NotNull]
  scope:
    - { annotation: org.jspecify.annotations.NullMarked, means: not_null_by_default }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  # A `class` literal or a constructed `instance` reaches payload rooting as a
  # bare symbol: the extractor's own wire projection travels on a type
  # reference (D00 §5a), and a call argument carries none. So the types that
  # projection already flattens — the boxes and String — are declared here
  # too, with exactly the `wire`/`format` it emits for each, so a captured
  # `String.class` and a scanned `String` field can never disagree. `Void`
  # reaches no wire type at all: the empty `wire` a `void` return already
  # carries reads as "no payload", never as a shape nobody can expand.
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
