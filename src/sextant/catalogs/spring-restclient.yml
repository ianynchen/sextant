id: spring-restclient
displayName: Spring RestClient
style: fluent
protocol: http
direction: outbound

detect:
  coordinates: ["org.springframework:spring-web"]

requires: [call_site, string_constants, chain_reconstruction]

matches:
  roots:
    - { owner: org.springframework.web.client.RestClient, method: get,    captures: { http_method: GET } }
    - { owner: org.springframework.web.client.RestClient, method: post,   captures: { http_method: POST } }
    - { owner: org.springframework.web.client.RestClient, method: put,    captures: { http_method: PUT } }
    - { owner: org.springframework.web.client.RestClient, method: delete, captures: { http_method: DELETE } }
    - { owner: org.springframework.web.client.RestClient, method: patch,  captures: { http_method: PATCH } }
  # RestClient is WebClient's synchronous twin: same `uri` step, but `body`
  # is reused for two different roles on two different types — a
  # request-setter on `RequestBodySpec` and a response-extractor on
  # `ResponseSpec` — indistinguishable by method name alone, so both declare
  # `owner` (D02 §4's amendment). `retrieve` alone is the terminal: no
  # `exchange` on this synchronous surface.
  steps:
    - { method: uri, captures: { url: arg0 } }
    - { method: body, owner: org.springframework.web.client.RestClient$RequestBodySpec, captures: { body: arg0 } }
    - { method: body, owner: org.springframework.web.client.RestClient$ResponseSpec,     captures: { response: arg0 } }
  terminal: [retrieve]
  type_carriers: [org.springframework.core.ParameterizedTypeReference]

# Shared verbatim across every outbound catalog on purpose (not just these
# three plus RestTemplate): `_owns` (shapes/contracts.py) scopes ownership by
# direction only, so whichever outbound catalog sorts first — okhttp, here —
# describes every outbound row's shapes, including a row a *different*
# catalog produced (Retrofit's own `Call<OrderView>`, say). Every outbound
# catalog's wrappers/serialization/known_types must therefore agree, or the
# first one alphabetically silently mis-describes a route it never derived.
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: reactor.core.publisher.Mono,              payload_arg: 0, semantics: async }
  - { type: java.util.Optional,                       payload_arg: 0, semantics: optional }
  - { type: retrofit2.Call,                           payload_arg: 0, semantics: async }

serialization:
  name_from:
    - { annotation: com.fasterxml.jackson.annotation.JsonProperty, arg: value }
  ignore: [com.fasterxml.jackson.annotation.JsonIgnore]
  default_strategy: as_declared

known_types:
  - { type: java.time.Instant,    wire: string, format: date-time }
  - { type: java.math.BigDecimal, wire: number }
  # A `class` literal or a constructed `instance` reaches payload rooting as a
  # bare symbol: the extractor's own wire projection travels on a type
  # reference (D00 §5a), and a call argument carries none. So the types that
  # projection already flattens — the boxes and String — are declared here
  # too, with exactly the `wire`/`format` it emits for each, so a captured
  # `String.class` and a scanned `String` field can never disagree. `Void`
  # reaches no wire type at all: the empty `wire` a `void` return already
  # carries reads as "no payload", never as a shape nobody can expand.
  - { type: java.lang.String,     wire: string }
  - { type: java.lang.Boolean,    wire: boolean }
  - { type: java.lang.Byte,       wire: integer, format: int32 }
  - { type: java.lang.Short,      wire: integer, format: int32 }
  - { type: java.lang.Integer,    wire: integer, format: int32 }
  - { type: java.lang.Long,       wire: integer, format: int64 }
  - { type: java.lang.Character,  wire: integer }
  - { type: java.lang.Float,      wire: number,  format: float }
  - { type: java.lang.Double,     wire: number,  format: double }
  - { type: java.lang.Void,       wire: "" }
