id: micronaut-jms-producer
displayName: Micronaut JMS (producer)
style: annotation_driven
protocol: jms
direction: outbound
detect:
  coordinates:
    - "io.micronaut.jms:micronaut-jms-core"
measured:
  - { artifact: io.micronaut.jms:micronaut-jms-core, versions: ["4.2.0"],
      identity: reported, by: scripts/probes/w58_micronaut_quarkus_annotations.md }
  - { artifact: io.micronaut.jms:micronaut-jms-sqs, versions: ["4.2.0"],
      identity: reported, by: scripts/probes/cp21_micronaut_jms_sqs.md }
requires: [annotation_args]
# One of a PAIR, split by direction on the type annotation exactly as `micronaut-http.yml`
# and `micronaut-http-client.yml` are, and for the same reason: Micronaut uses ONE method
# annotation for both sides and the class-level marker decides which. Two catalogs gating
# on different markers derive each destination once.
matches:
  declared_on: interface
  # `@JMSProducer` marks an INTERFACE; `@Queue` or `@Topic` on each method names where it sends.
  type_annotation: io.micronaut.jms.annotations.JMSProducer
  # MEASURED (`javap` on micronaut-jms-core 4.2.0 `DefaultBodyArgumentBinder`): the body
  # binder keys on `@MessageBody`; an unannotated sole parameter is the message by default.
  request_body: { annotation: io.micronaut.messaging.annotation.MessageBody, fallback: sole_unannotated }
  mapping:
    path_from: [value]
    prefix_from: []
    method_from: method
    all_methods: []
    prefix_annotation: null
    annotations:
      - { fqn: io.micronaut.jms.annotations.Queue }
      - { fqn: io.micronaut.jms.annotations.Topic }

# `micronaut-jms-over-sqs` (spec 2026-09-18 §5b) — the producer's own gate, identical in
# shape to `micronaut-jms.yml`'s but read off `@JMSProducer` rather than `@JMSListener`:
# CP-21 row 1b measured `@JMSProducer` too, and it declares the same one attribute,
# `value(): String`, with no `connectionFactory` of its own either. `value` still names the
# connection-factory bean (CP-21 row 2's `Qualifiers.byName` resolution reads either
# annotation's `value` the same way), so this catalog needs its OWN `hint_when` — a Micronaut
# module publishing through the SQS producer and listening through the SQS listener are two
# different catalogs' own rows, and D02's union rule collects each catalog's condition rather
# than asking one to speak for the other.
#
# Same stated boundaries as the listener's: a hand-wired factory bean stays `jms`, and a
# placeholder `value` compares unequal to the literal and stays `jms` too.
protocol_hint:
  protocol: sqs
  hint_when:
    annotation_arg:
      annotation: io.micronaut.jms.annotations.JMSProducer
      name: value
      equals: sqsJmsConnectionFactory
