id: cdi-async-events
displayName: CDI events, asynchronous (Event.fireAsync, @ObservesAsync)
style: annotation_driven
# No wire, as `cdi-events.yml`: an in-process dispatch, a hop and never an endpoint row.
protocol: in_process
direction: inbound
# `fireAsync` notifies the ASYNCHRONOUS observers only (CP-59 finding 10), so `@ObservesAsync`
# and `fireAsync` are a mechanism of their own: a `fire` never reaches an `@ObservesAsync`
# observer, nor a `fireAsync` an `@Observes` one.
dispatch: { key: type, match: all, mechanism: cdi-async-events }

# CDI 2.0 added the asynchronous half: the javax CDI 2.x API (Java EE 8) and the Jakarta API
# declare it, the javax CDI 1.x API has neither `fireAsync` nor `@ObservesAsync` (finding 8).
detect:
  coordinates: ["jakarta.enterprise:jakarta.enterprise.cdi-api", "javax.enterprise:cdi-api"]

measured:
  - { artifact: jakarta.enterprise:jakarta.enterprise.cdi-api, versions: ["4.1.0"],
      identity: reported, by: scripts/probes/cp59_dispatch.md }
  - { artifact: javax.enterprise:cdi-api, versions: ["2.0.0"],
      identity: reported, by: scripts/probes/cp59_dispatch.md }
  - { artifact: io.quarkus.arc:arc, versions: ["3.17.5"],
      identity: reported, by: scripts/probes/cp59_dispatch.md }

requires: [typed_signatures, call_site]

matches:
  mapping:
    # A method with a parameter annotated `@ObservesAsync` (finding 9), keyed by that
    # parameter's type.
    selected_by_parameter:
      - jakarta.enterprise.event.ObservesAsync
      - javax.enterprise.event.ObservesAsync
    # A qualified observer is kept with no key, for the reason `cdi-events.yml` gives.
    keyless_when_meta_annotated:
      - jakarta.inject.Qualifier
      - javax.inject.Qualifier
    path_from: []
    prefix_from: []
    method_from: method
    all_methods: []
    prefix_annotation: null
    annotations: []

  # Both `fireAsync` overloads hand argument 0 to the container (finding 8); the second's
  # `NotificationOptions` chooses an executor, not observers.
  dispatch_sends:
    - { owner: jakarta.enterprise.event.Event, method: fireAsync,
        descriptor: "(Ljava/lang/Object;)Ljava/util/concurrent/CompletionStage;",
        value_arg: 0 }
    - { owner: jakarta.enterprise.event.Event, method: fireAsync,
        descriptor: "(Ljava/lang/Object;Ljakarta/enterprise/event/NotificationOptions;)Ljava/util/concurrent/CompletionStage;",
        value_arg: 0 }
    - { owner: javax.enterprise.event.Event, method: fireAsync,
        descriptor: "(Ljava/lang/Object;)Ljava/util/concurrent/CompletionStage;",
        value_arg: 0 }
    - { owner: javax.enterprise.event.Event, method: fireAsync,
        descriptor: "(Ljava/lang/Object;Ljavax/enterprise/event/NotificationOptions;)Ljava/util/concurrent/CompletionStage;",
        value_arg: 0 }
