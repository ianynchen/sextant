id: jakarta-jms
displayName: Jakarta JMS (raw Session)
style: single_call
protocol: jms
direction: outbound

detect:
  coordinates: ["jakarta.jms:jakarta.jms-api"]

measured:
  - { artifact: jakarta.jms:jakarta.jms-api, versions: ["3.1.0"],
      identity: reported, by: scripts/probes/cp12_sweep_round1b.md }

requires: [call_site, string_constants]

matches:
  owner: jakarta.jms.Session
  # CHECKPOINT FACT (real javap descriptors, jakarta.jms-api 3.1.0):
  # `createProducer(Destination)` and `createConsumer(Destination)` are both
  # arity 1. Neither one's own argument is ever the destination NAME
  # directly — it is a `Queue`/`Topic` instance, itself the return of a
  # SEPARATE `Session#createQueue(String)`/`createTopic(String)` call, so
  # `channel_via` (D02 §2's `single_call` style) follows that link rather
  # than reading `channel_arg`'s position as a literal.
  #
  # `Session#send(Message, ...)` is deliberately NOT declared here: a raw
  # `jakarta.jms.Message` is an opaque envelope this catalog's rules cannot
  # pull a real payload contract out of (the same reasoning spring-jms.yml's
  # own `excludes: [jakarta.jms.Message]` already states for the listener
  # side) — the producer/consumer REGISTRATION itself is the evidence a
  # route exists, not the send/receive call, so both rows below carry no
  # `body_arg` at all and their payload is honestly absent.
  #
  # Each row states its own erased JVM `descriptor`. Java identifies a method by
  # name and parameter types in order, never by argument count (GUIDELINES
  # §8.1's language rule), so a future sibling at the same arity derives
  # NOTHING rather than being read through `channel_arg: 0`. Re-running the
  # CP-10 harness is the check.
  #
  # MEASURED, at jakarta.jms-api 3.1.0 (CP-12 Q9,
  # `scripts/probes/cp12_sweep_round1b.md`): `jakarta.jms.Session` declares
  # THIRTEEN factories that open a receiver on a destination — read off the jar
  # as "returns a `MessageConsumer`, a `TopicSubscriber` or a `QueueBrowser`",
  # which is the framework's own statement that the call opens one. ELEVEN of
  # them are consumers, and this file modelled ONE (`A-M6`'s sibling finding
  # `A-M7`). Every selector-carrying consumer, and every durable or shared
  # subscription, derived nothing: a real inbound JMS endpoint on a destination
  # `channel_via` could already resolve, silently absent, with no COVERAGE row.
  # The comment that stood here mentioned the arity-2 and arity-3
  # `createConsumer` overloads and declined them; the durable and shared
  # families were not mentioned at all.
  #
  # ALL ELEVEN TAKE THEIR DESTINATION AT ARGUMENT 0, which is what makes the
  # ten new rows a mirror rather than a guess — the selector, the subscription
  # name, the client-id spelling and the `noLocal` flag are all trailing
  # arguments this catalog reads nothing from.
  #
  # Every row carries the SAME `createQueue`/`createTopic` `channel_via` pair,
  # and on the eight rows whose argument 0 is typed `Topic` the `createQueue`
  # half is INERT: `createQueue` returns a `Queue`, which is not a `Topic`, so
  # no call site can ever link through it there. The sentence that stood here
  # said "`Topic` and `Queue` both extend `Destination`, so the same pair
  # resolves every one", which is true of the two `Destination`-typed rows and
  # false of the other eight — an inert link presented as a working one. It is
  # left rather than trimmed to eight one-entry lists because `channel_via` is
  # a FIRST-MATCH list and an unmatchable entry changes no outcome, and because
  # one pair spelled once is what keeps a new row from acquiring the wrong
  # half. That stops being true if `channel_via` ever gains a rule where an
  # entry that cannot match costs something — an ordering, a count, a
  # diagnostic — at which point the eight lists want trimming.
  #
  # `createBrowser(Queue[, String])` is the twelfth and thirteenth and is
  # DELIBERATELY ABSENT, stated in COVERAGE §5.9 rather than left silent. A
  # `QueueBrowser` ENUMERATES a queue without consuming from it — it is not a
  # subscription, and publishing it as an inbound endpoint would say the module
  # receives messages the broker never delivers to it. That reading is the
  # specification's, not a measurement of a running broker, and it is why the
  # row is declined rather than derived: it stops being right if a reader wants
  # every read of a destination on the graph regardless of delivery semantics,
  # which is a modelling decision and not a catalog one.
  methods:
    - name: createProducer
      arity: 1
      descriptor: "(Ljakarta/jms/Destination;)Ljakarta/jms/MessageProducer;"
      direction: outbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createConsumer
      arity: 1
      descriptor: "(Ljakarta/jms/Destination;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createConsumer
      arity: 2
      descriptor: "(Ljakarta/jms/Destination;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createConsumer
      arity: 3
      descriptor: "(Ljakarta/jms/Destination;Ljava/lang/String;Z)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createSharedConsumer
      arity: 2
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createSharedConsumer
      arity: 3
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createDurableSubscriber
      arity: 2
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;)Ljakarta/jms/TopicSubscriber;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createDurableSubscriber
      arity: 4
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;Ljava/lang/String;Z)Ljakarta/jms/TopicSubscriber;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createDurableConsumer
      arity: 2
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createDurableConsumer
      arity: 4
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;Ljava/lang/String;Z)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createSharedDurableConsumer
      arity: 2
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }
    - name: createSharedDurableConsumer
      arity: 3
      descriptor: "(Ljakarta/jms/Topic;Ljava/lang/String;Ljava/lang/String;)Ljakarta/jms/MessageConsumer;"
      direction: inbound
      channel_arg: 0
      channel_via:
        - { owner: jakarta.jms.Session, method: createQueue, arg: 0 }
        - { owner: jakarta.jms.Session, method: createTopic, arg: 0 }

# Copied verbatim from spring-resttemplate.yml (harvest compatibility, same
# discipline as spring-kafka-template.yml — see its own comment for the full
# rationale).
wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
