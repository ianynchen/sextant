id: spring-websocket
displayName: Spring WebSocket (programmatic handler registration)
style: single_call
protocol: websocket
direction: inbound

detect:
  coordinates: ["org.springframework:spring-websocket"]

# 6.1.6 is the version the descriptor sweep OPENED and the jar reported, and
# it is what the row below is bounded by. Nothing in this repository depends
# on spring-websocket, so no run has ever exercised this rule at any other
# version — CP-10 says so in its own version-scope paragraph.
measured:
  - { artifact: org.springframework:spring-websocket, versions: ["6.1.6"],
      identity: reported, by: scripts/probes/cp10_catalog_descriptors.md }

# `array_arguments` added in W46's review: `addHandler`'s path argument is ALWAYS an array — varargs collapse into one argument — and reading its `elements` is capability 9.15.
# Undeclared, this catalog would derive nothing on an extractor lacking it rather
# than being SKIPPED with a reason, which is the whole point of the gate.
requires: [call_site, string_constants, array_arguments]

# `WebSocketHandlerRegistry.addHandler(WebSocketHandler handler, String...
# paths)` — the raw, non-STOMP registration form
# (`WebSocketConfigurer#registerWebSocketHandlers`'s own callback argument),
# a single_call surface rather than an annotation one: nothing on the
# `WebSocketHandler` implementation itself names a path, and the path lives
# entirely at the `.addHandler(handler, "/ws")` call site instead — the same
# shape `spring-kafka-template.yml`'s `KafkaTemplate.send` reads off a call
# rather than an annotation.
#
# COVERAGE boundary (Task 5): this entry has NO live fixture surface — Task 1
# built none (2H Task 5 brief, spec ruling) — and no pom anywhere in this
# repository depends on `spring-websocket` at all, so it is proved only by
# unit-level tests over synthetic call facts, never by a fixture pin.
#
# WHAT THE OLD COMMENT SAID HERE, AND WHY IT WAS WRONG (descriptor sweep R6).
# It called the two-argument shape "unverified against real bytecode" and then
# asserted that a multi-path call `.addHandler(handler, "/ws", "/ws2")` "is a
# THREE-argument call this row's own `arity: 2` does not match at all". Both
# halves are now measured, by compiling those exact two calls against
# spring-websocket 6.1.6 and running the shipped extractor over the class file:
#
#   .addHandler(h, "/ws")          -> 2 arguments; argument 1 is
#                                     {kind: array, elements: [{string "/ws"}]}
#   .addHandler(h, "/ws", "/ws2")  -> 2 arguments; argument 1 is
#                                     {kind: array, elements: [{"/ws"}, {"/ws2"}]}
#
# VARARGS COLLAPSE INTO ONE ARGUMENT. The multi-path call has always matched
# this row; the comment's reassurance that it "derives no row rather than a
# wrong one" was describing a mechanism that does not exist.
#
# THE BOUNDARY THAT STOOD HERE IS CLOSED (2O Task 13). It read: "`channel_of`
# resolves only a `kind: "string"` argument (`shapes/arguments.py`), and
# argument 1 is ALWAYS an `array` — for one path as much as for two. So
# `channel_arg: 1` can never resolve a WebSocket path at all: every call,
# single- or multi-path, derives one honest row with `path` NULL and
# `resolution: unresolved`." Every word of that was true of the reader, and
# the reader is what changed: `single_call` now reads a `channel_arg` slot
# through `channels_of`, which reads an `array`'s own `elements` (extractor
# capability 9.15) and answers one destination per element.
#
# So `.addHandler(h, "/ws")` derives `/ws` resolved, and
# `.addHandler(h, "/ws", "/ws2")` derives BOTH — one row per registered path,
# the way each `urlPatterns` entry is already its own row, because Spring
# registers the one handler at every path named. A path element javac could
# not fold to a constant keeps the ONE trailing unresolved row `all_strings`
# gives, never a guess: the row count still says how many registrations there
# are, and the unread one says so.
#
# Nothing about this file changed to close it; the catalog was already correct
# for the shape the extractor emits, which is why the boundary was worth
# stating precisely rather than working around.
#
# `arity: 2` is therefore right, and it now carries the erased JVM `descriptor`
# of the one overload `WebSocketHandlerRegistry` declares — the interface has
# exactly one method (javap -p -s, spring-websocket 6.1.6, recorded in
# `scripts/probes/cp10_catalog_descriptors.md`). Unique today, so the claim
# costs nothing; the day the interface gains a second two-argument
# `addHandler`, that overload derives NOTHING rather than having its own
# argument 1 read as a dispatch path.
#
# `channel_arg`, not `url_arg`: a WebSocket dispatch path is a destination
# identity `SockJS`/plain handshake registration resolves against, never a
# peer+path URL to split (CP-2) — the same `channel_arg` reasoning
# `spring-pubsub.yml`/`google-pubsub-subscriber.yml` already keep for their
# own inbound registration calls.
matches:
  owner: org.springframework.web.socket.config.annotation.WebSocketHandlerRegistry
  methods:
    - { name: addHandler, arity: 2,
        descriptor: "(Lorg/springframework/web/socket/WebSocketHandler;[Ljava/lang/String;)Lorg/springframework/web/socket/config/annotation/WebSocketHandlerRegistration;",
        channel_arg: 1 }

wrappers:
  - { type: org.springframework.http.ResponseEntity, payload_arg: 0, semantics: http_envelope }
  - { type: java.util.Optional, payload_arg: 0, semantics: optional }

# D02 §1b — the payload-type blocks, declared once in
# `shape-models/json.yml` rather than copied into this file.
shape_model: json
