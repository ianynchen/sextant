# `management.endpoints.web.exposure.include` is deliberately NOT set here.
# It is Boot's own gate on whether a custom `@Endpoint` is served over HTTP at
# all, and its DEFAULT is `health` alone — so setting it in this file would
# make the default unmeasurable from this harness. `run.sh` passes it on the
# command line for the runs that need the endpoint exposed, and leaves it
# unset for the run that measures what the default actually serves.
server.port=18085
