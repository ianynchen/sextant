# The words of Sextant as they were on `main` on 2026-11-23 (GUIDELINES §8.9), the approvals
# since, and what is not a Sextant word. ANY diff of this file — baseline, approvals or
# exemptions — is reviewed as an approval.
#
# `baseline` was generated ONCE by `_document()` in test_vocabulary_ratchet.py and is never
# regenerated: regenerating is how a word would slip in. A word added after it needs an entry
# under `approvals`:
#   - word: <the word>
#     where: catalog key | catalog value: <key> | <path>::<name> (as a failure message spells it)
#     approved_by: <who approved it>
#     approved_on: YYYY-MM-DD (after 2026-11-23)
#     reference: <the ruling, design section or issue>
# A new catalog key that takes string values is also put in exactly one of
# baseline.closed_value_keys, baseline.mixed_value_keys or exemptions.open_value_keys. A word
# removed from the code is removed here by hand; a closed set that moves is moved here, as the
# failure message says. An exemption is only for something that is NOT a Sextant word, and
# carries its reason.
