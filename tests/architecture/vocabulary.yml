# The words of Sextant as they were on `main` on 2026-11-23 (GUIDELINES §8.9).
#
# `baseline` was generated ONCE by `_document()` in test_vocabulary_ratchet.py and is never
# regenerated: regenerating is how a word would slip in. Any diff of this file is reviewed as an
# approval. A word added after the baseline needs an entry under `approvals`:
#   - word: <the word>
#     where: catalog key | catalog value: <key> | <path>::<name> (as a failure message spells it)
#     approved_by: <who approved it>
#     approved_on: YYYY-MM-DD (after 2026-11-23)
#     reference: <the ruling, design section or issue>
# A new key that takes word values is also added under `baseline.closed_value_keys` in the same
# change when its approval says it is closed-valued. A word removed from the code is removed
# from this file by hand; a closed set that moves is moved here, as the failure message says.
