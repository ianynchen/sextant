[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sextant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "click>=8.1",
  "rich>=13.7",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "protobuf>=7.36.1",
  "grpcio-tools>=1.83.1",
  "graphql-core>=3.2.6",
  "pathspec==1.1.1",
  # Import-confined to `src/sextant/agents/tradewind.py` (2N design §1): the
  # one sanctioned model-calling adapter, enforced by
  # `tests/architecture/test_agents_confinement.py`. Pinned by commit sha —
  # no version tags exist past 0.6.0 — via `[tool.uv.sources]` below.
  # `anthropic` is no longer a direct dependency: it stays installed
  # transitively through tradewind's own `langchain-anthropic`, which is
  # what the api-key auth profile actually talks to.
  "tradewind",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "import-linter>=2.0"]

[tool.uv.sources]
# Commit-sha pin (2N design §1): the exact commit `examples/tradewind` is a
# read-only clone of, for the source questions this adapter's tests and
# docstrings answer against.
tradewind = { git = "https://github.com/ianynchen/Tradewind.git", rev = "9a23e45356e22dcc0005a31edf0a344d04a1b6a6" }

[project.scripts]
sextant = "sextant.cli.app:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]
# The extractor ships inside the distribution (ARCHITECTURE §9): version drift
# between extractor and loader is a silent correctness fault. Gradle builds it
# into the package, so it is git-ignored — `artifacts` is what carries an
# ignored build output into the wheel. Not `force-include`, which is mandatory
# and made `pip install -e .` fail on any clone where the jar did not exist.
artifacts = ["src/sextant/extractor-jvm/*.jar"]

# The extractor is not force-included. Gradle builds it straight into
# src/sextant/extractor-jvm/, so it is ordinary package data — present in the
# wheel when it has been built, and simply absent when it has not. A
# force-include is mandatory in hatchling, which made `pip install -e .` fail
# on any clone where the jar did not exist yet: an install-time hard error for
# a file only `module analyze` needs.

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The formatter rewrites fenced Python in Markdown too, and `docs/` holds the
# specs and the phase plans — documents that are a contract, not code to be
# restyled. Their illustrative snippets stay as written.
extend-exclude = ["docs"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# The protobuf runtime ships no inline types and its stubs are a separate
# distribution (`types-protobuf`) — a third dependency for one module's
# annotations. Same treatment as `yaml`: the import is untyped, and
# `descriptors.py` annotates its own surface.
[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

# `tradewind` ships no `py.typed` marker (its own source is typed, but mypy
# only trusts that for an installed package carrying the marker file) — the
# same untyped-runtime treatment as `yaml`, confined to the one module
# (`src/sextant/agents/tradewind.py`) permitted to import it.
[[tool.mypy.overrides]]
module = "tradewind.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "sextant"

[[tool.importlinter.contracts]]
name = "Layering: cli -> api -> outer groups -> application -> domain | resources"
type = "layers"
containers = ["sextant"]
# `agents` joins the outer-group rank (2K design §8): it imports
# `application`/`domain` inward like `ingress`/`storage`/`egress`, and nothing
# else outward — the one module it houses, `tradewind.py`, is the ONE
# sanctioned model-calling adapter (DR-2's amendment).
#
# `api` (2N Task 5, §5b — the library facade) sits directly below `cli`:
# `cli/app.py`'s own commands became thin wrappers over `sextant.api`'s
# extracted composition, so `cli` is the one layer allowed to import it,
# never the reverse. `resources` (`sextant.resources`, module docstring has
# the full story) sits at the bottom, `domain`'s own SIBLING rather than
# beneath it (fix round 1, MINOR-9: a bare linear tail left `domain`
# legally able to import a filesystem lookup, uncaught by this contract —
# `domain` must not, so the two are independent instead) — a leaf with no
# `sextant`-internal imports of its own, needed by `api` directly. `cli`
# imports it too (2N Task 6 retired `cli.resources`, its own delegating
# copy, once its whitebox `_package_root` pin moved to `resources`'s own
# test file), which is unremarkable — `cli` sits above `resources` in this
# same layering already.
layers = ["cli", "api", "ingress | storage | egress | agents", "application", "domain | resources"]
# Exhaustive so a new top-level package cannot land outside every contract:
# an unlisted package is unlayered, and an unlayered package is unchecked.
# The container form is what makes this option available.
exhaustive = true

[[tool.importlinter.contracts]]
name = "Outer groups never import one another"
type = "independence"
modules = ["sextant.ingress", "sextant.storage", "sextant.egress", "sextant.agents"]

[[tool.importlinter.contracts]]
name = "Ingress is write-only: it never depends on the Workspace port"
type = "forbidden"
source_modules = ["sextant.ingress"]
forbidden_modules = ["sextant.application.ports.workspace"]

[[tool.importlinter.contracts]]
name = "Egress is read-only: it never depends on the Workspace port"
type = "forbidden"
source_modules = ["sextant.egress"]
forbidden_modules = ["sextant.application.ports.workspace"]
# Direct imports only. A renderer is handed a ResolveReport, and the module
# that defines that report also imports the port, so the indirect chain is
# unavoidable without moving the report out of the pipeline module. What this
# contract forbids is what the rule is actually about: a renderer reaching for
# the workspace itself, which is derivation hiding in presentation.
allow_indirect_imports = true
