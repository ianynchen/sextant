[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sextant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "click>=8.1",
  "rich>=13.7",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "import-linter>=2.0"]

[project.scripts]
sextant = "sextant.cli.app:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "sextant"

[[tool.importlinter.contracts]]
name = "Layering: cli -> outer groups -> application -> domain"
type = "layers"
containers = ["sextant"]
layers = ["cli", "ingress | storage | egress", "application", "domain"]
# Exhaustive so a new top-level package cannot land outside every contract:
# an unlisted package is unlayered, and an unlayered package is unchecked.
# The container form is what makes this option available.
exhaustive = true

[[tool.importlinter.contracts]]
name = "Outer groups never import one another"
type = "independence"
modules = ["sextant.ingress", "sextant.storage", "sextant.egress"]

[[tool.importlinter.contracts]]
name = "Ingress is write-only: it never depends on the Workspace port"
type = "forbidden"
source_modules = ["sextant.ingress"]
forbidden_modules = ["sextant.application.ports.workspace"]

[[tool.importlinter.contracts]]
name = "Egress is read-only: it never depends on the Workspace port"
type = "forbidden"
source_modules = ["sextant.egress"]
forbidden_modules = ["sextant.application.ports.workspace"]
# Direct imports only. A renderer is handed a ResolveReport, and the module
# that defines that report also imports the port, so the indirect chain is
# unavoidable without moving the report out of the pipeline module. What this
# contract forbids is what the rule is actually about: a renderer reaching for
# the workspace itself, which is derivation hiding in presentation.
allow_indirect_imports = true
