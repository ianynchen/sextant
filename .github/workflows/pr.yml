name: PR gates

# Blocks a merge on compilation and unit tests. Runs on pull requests and on
# pushes to main, so a merge that breaks the branch is visible immediately
# rather than at the next pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # One job, running the same script a developer runs. Two jobs looked
    # tidier and were a lie: the Python end-to-end tests load the shaded jar,
    # so a Python job without a JVM either fails or skips the tests that matter
    # most — and a green run that skipped them is worse than a red one.
    name: All gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the floor in pyproject; a newer local version must not hide a break
          # No pip cache: nothing installs with pip here any more. See below.

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        # FROM THE LOCK, which is the whole point of this step (`OI-137`).
        #
        # This was `pip install -e ".[dev]"`, and that **ignores `uv.lock`**: it reads the
        # floors in `pyproject.toml` and installs whatever is newest on PyPI that satisfies
        # them. The floors are loose — `graphql-core>=3.2.6`, `mypy>=1.10`, `ruff>=0.5`,
        # `import-linter>=2.0` — so the versions this job tested were chosen by the DATE it
        # ran, while a developer's `.venv` resolves from the lock. The two were therefore
        # different environments, and a green local gate said nothing about this one.
        #
        # IT COST A DIAGNOSIS CYCLE ON PR #38. `graphql-core` 3.3.0 changed
        # `EnumTypeDefinitionNode.values` from `Tuple[...]` to `tuple[...] | None`; CI
        # resolved 3.3.0, the developer's machine had 3.2.12, and mypy failed in
        # `ingress/interpret/graphql_sdl.py` — a file the branch had not touched, and broken
        # on `main` too, whose last green run was three weeks earlier. The first suspicion
        # for a red gate is always the branch, so the honest signal ("does this branch
        # pass?") was unavailable until someone reproduced the resolution by hand.
        #
        # `--frozen` is the half that matters beyond pinning: it REFUSES to re-resolve, so a
        # `pyproject.toml` edited without `uv lock` fails here loudly instead of silently
        # installing something the lock never saw. `--extra dev` because `dev` is an extra
        # (`[project.optional-dependencies]`) rather than a dependency group, which is what
        # the old `".[dev]"` was asking for.
        #
        # `scripts/check.sh` needs no change: it already prefers `.venv/bin/` where one
        # exists, which is where `uv sync` installs. The two fixture-priming steps below
        # keep using the bare interpreter deliberately — both are stdlib-only, so neither
        # needs the project's dependencies, and pointing them at the venv would imply they
        # do.
        run: uv sync --frozen --extra dev

      - name: Prime the fixture's dependencies
        # The suite compiles fixtures with `mvn -o`. Offline is deliberate —
        # ARCHITECTURE §9a makes it policy, so no test reaches the network and
        # a broken build cannot look like a slow one. A fresh runner has an
        # empty ~/.m2, so this is the one step allowed to fetch. The stub
        # library goes in first: `orders-service` declares it as a dependency,
        # Maven resolves every dependency before compiling anything, and the
        # stub exists nowhere but the local repository this script installs
        # it into (the suite's conftest does the same, offline — too late for
        # this step, which is why the script exists). The second script
        # compiles every fixture the suite compiles (`PRIMED_FIXTURES`) and
        # stamps each `target/` with a fingerprint of its inputs, so the
        # suite's own `compile_fixture` calls find nothing to do — without the
        # stamps every one of the four workers would run Maven once per
        # fixture (docs/performance.md D).
        run: |
          python tests/fixture_stub.py
          python tests/fixture_build.py

      - name: Prime the Gradle fixture's dependencies
        # The Gradle counterpart of the step above — the ONE fetch-allowed
        # Gradle step (2M design §4). `tests/e2e/test_gradle_fixture_builds.py`
        # is the one opt-in Gradle integration test, and it runs `./gradlew
        # --offline`, so a fresh runner's empty Gradle caches (the wrapper
        # distribution, fixtures/gradle-orders's own dependencies) must be
        # warm before it does. Running `sextantModel` itself here — the exact
        # task that test re-runs offline — both fetches those and compiles
        # both subprojects once, online, the same "successful build first"
        # precondition `MavenDetector`'s own priming step states for `mvn`.
        run: |
          cd fixtures/gradle-orders
          ./gradlew --init-script ../../src/sextant/ingress/detect/sextant-model.init.gradle \
            --no-configuration-cache -q sextantModel -Psextant.out=/tmp/sextant-model-prime.json

      # One step per stage, cheapest first (docs/performance.md P-2): a lint or type
      # failure is visible in seconds instead of after a twenty-minute test run, and the
      # pytest step's log streams on its own while it runs. Locally `scripts/check.sh`
      # still runs every stage in one go; each flag below runs exactly one of them.
      - name: Lint, types, import contracts
        run: scripts/check.sh --lint
      - name: Extractor build and tests
        run: scripts/check.sh --extractor
      - name: Tests
        run: scripts/check.sh --tests
