# The key this fixture exists for. A trailing separator ON PURPOSE: `spring-petclinic-rest`
# writes `/petclinic/` and the joined path must be `/shop/orders/{id}`, never `/shop//orders/{id}`.
server.servlet.context-path=/shop/

# The DispatcherServlet's own mapping inside that context, which composes after it: the
# served path is context-path + servlet path + the mapping on the method.
spring.mvc.servlet.path=/api
