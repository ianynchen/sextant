# application-prod.yml — the "prod" filename-profile variant, layered over
# application.yml (config_model.profiles.from_filename). only.in.default is
# deliberately never mentioned here — the per-env unresolved pin.

# Overrides application.yml's billing.url for prod.
billing:
  url: http://billing.prod.internal

# Repeats application.yml's kafka serializer keys with the SAME values, so
# both the media stamp (2F design §3, job 2) and the format ladder's rung 3
# (2G design §5) see agreement across every resolved environment. A key that
# resolved differently here would say nothing either could carry.
spring:
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
