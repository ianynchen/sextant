# 2K Task 2 fixture decoy — PLANTED, must never be read. `application-secret.yml`
# is a real Spring config source (`config_model.sources`'s own
# `application{-profile}.yml` pattern names this the "secret" profile), so
# without `.sextantignore` excluding it this key WOULD resolve into its own
# `resolved_config` environment. `.sextantignore` at the fixture root
# excludes this exact path — the live pin (tests/e2e/test_vertical_slice.py)
# asserts `decoy.should-never-resolve` is absent from `resolved_config`
# altogether, in every environment, not merely unmasked or unresolved.
decoy:
  should-never-resolve: this-key-must-never-reach-resolved-config
